<!-- PROTOTYPE — throwaway. Three structurally different redesigns of the per-prayer Reminder sheet and the Prayer Reminders settings screen (?variant=A|B|C, ?lang=ar|en, ?theme=dark|light). Every variant replaces the enabled/muted/voice switches with one alert type: Off · Silent · Tone · Adhan, mapped back onto the same ReminderRule fields. -->
<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:," />
<title>Reminder sheet — redesign prototype</title>
<style>
/* Tokens: panelui-native theme.css light/dark + apps/native/global.css overrides (same as prayer.html). */
:root, [data-theme="light"] {
  --background:#ffffff; --foreground:#262626; --card:#ffffff;
  --surface:#f7f7f7; --surface-2:#f1f1f1; --surface-3:#eaeaea;
  --inset:rgba(0,0,0,.035);
  --primary:#262626; --primary-fg:#fafafa;
  --secondary:rgba(0,0,0,.06); --muted:rgba(0,0,0,.06); --muted-fg:#686868;
  --border:rgba(0,0,0,.08); --input:rgba(0,0,0,.1); --ring:#a3a3a3;
  --destructive:#dc2626; --destructive-solid-fg:#ffffff;
  --success:#10b981; --success-fg:#047857; --success-soft:rgba(16,185,129,.1);
  --warning:#f59e0b; --warning-fg:#b45309; --warning-soft:rgba(245,158,11,.1);
  --info:#3b82f6; --info-fg:#1d4ed8; --info-soft:rgba(59,130,246,.1);
  --overlay:#ffffff; --skeleton:rgba(0,0,0,.1);
  --radius-md:8px; --radius-lg:10px; --radius-xl:14px; --radius-2xl:16px; --radius-3xl:24px;
  --page:#e9e8e4; --frame:#1b1b1b; --scrim:rgba(0,0,0,.32);
  --wash:color-mix(in srgb, var(--foreground) 5%, transparent);
  --wash-2:color-mix(in srgb, var(--foreground) 9%, transparent);
  --ease:cubic-bezier(.16,1,.3,1);
}
[data-theme="dark"] {
  --background:#141414; --foreground:#f5f5f5; --card:#191919;
  --surface:#1c1c1c; --surface-2:#222222; --surface-3:#282828;
  --inset:rgba(0,0,0,.22);
  --primary:#f5f5f5; --primary-fg:#262626;
  --secondary:rgba(255,255,255,.08); --muted:rgba(255,255,255,.08); --muted-fg:#a1a1a1;
  --border:rgba(255,255,255,.06); --input:rgba(255,255,255,.24); --ring:#737373;
  --destructive:#e5484d; --destructive-solid-fg:#ffffff;
  --success:#10b981; --success-fg:#34d399; --success-soft:rgba(16,185,129,.16);
  --warning:#f59e0b; --warning-fg:#fbbf24; --warning-soft:rgba(245,158,11,.16);
  --info:#3b82f6; --info-fg:#60a5fa; --info-soft:rgba(59,130,246,.16);
  --overlay:#232323; --skeleton:rgba(255,255,255,.1);
  --page:#0b0b0b; --frame:#2a2a2a; --scrim:rgba(0,0,0,.55);
  --wash:color-mix(in srgb, var(--foreground) 6%, transparent);
  --wash-2:color-mix(in srgb, var(--foreground) 11%, transparent);
}
* { box-sizing:border-box; }
html,body { margin:0; }
body {
  background:var(--page); color:var(--foreground);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Arabic", "Segoe UI", "Noto Sans Arabic", "Noto Naskh Arabic", "Geeza Pro", sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:flex-start; justify-content:center; gap:28px;
  padding:28px 24px 110px; min-height:100vh;
}
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit; }
input { font:inherit; color:inherit; }
.num { font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
.muted { color:var(--muted-fg); }
.small { font-size:13px; }
.grow { flex:1; min-width:0; }
[dir="rtl"] .flipx { transform:scaleX(-1); }

/* ── Phone ───────────────────────────────────────────── */
.phone {
  width:390px; height:844px; flex:none; position:relative; overflow:hidden;
  border-radius:52px; background:var(--background);
  box-shadow:0 0 0 11px var(--frame), 0 0 0 12px rgba(0,0,0,.25), 0 40px 80px -20px rgba(0,0,0,.35);
  display:flex; flex-direction:column;
}
.statusbar { height:50px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:6px 34px 0; font-weight:600; font-size:15px; direction:ltr; }
.statusbar .island { width:120px; height:34px; border-radius:20px; background:#000; }
.statusbar .icons { display:flex; gap:6px; align-items:center; }
.scroll { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; padding-bottom:104px; }
.scroll::-webkit-scrollbar { display:none; }
.navbar { display:flex; align-items:center; justify-content:space-between; height:44px; padding:0 16px; }
.toolbtn { width:36px; height:36px; border-radius:18px; display:grid; place-items:center; background:var(--secondary); }
.largetitle { padding:0 20px 2px; font-size:34px; font-weight:700; letter-spacing:-.01em; line-height:1.15; }
[dir="rtl"] .largetitle { letter-spacing:0; }
.subline { padding:2px 20px 0; color:var(--muted-fg); font-size:15px; }
.section { padding:0 16px; margin-top:20px; }
.sec-title { font-size:13px; font-weight:600; color:var(--muted-fg); padding:0 4px 8px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-2xl); }
[data-theme="light"] .card { box-shadow:0 1px 2px rgba(0,0,0,.03); }
.row { display:flex; align-items:center; gap:12px; min-height:48px; padding:0 16px; }
.row + .row { border-top:1px solid var(--border); }
.btn { height:40px; padding:0 16px; border-radius:var(--radius-xl); font-weight:600; font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary { background:var(--primary); color:var(--primary-fg); }
.btn-secondary { background:var(--secondary); }
.btn-sm { height:32px; padding:0 12px; font-size:13px; border-radius:var(--radius-lg); }
.btn-block { width:100%; }
.badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--secondary); white-space:nowrap; }
.chip { height:34px; padding:0 13px; border-radius:999px; border:1px solid var(--input); font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:background .2s var(--ease), color .2s var(--ease); }
.chip.on { background:var(--primary); color:var(--primary-fg); border-color:var(--primary); font-weight:600; }
.iconbtn { width:32px; height:32px; border-radius:16px; display:grid; place-items:center; background:var(--secondary); flex:none; }
.linkbtn { color:var(--info-fg); font-weight:500; font-size:15px; display:inline-flex; align-items:center; gap:4px; height:40px; }
[data-theme="dark"] .linkbtn { color:var(--info-fg); }

.switch { width:51px; height:31px; border-radius:16px; background:var(--muted); position:relative; flex:none; transition:background .25s var(--ease); }
[data-theme="light"] .switch { background:#e5e5e5; }
.switch::after { content:""; position:absolute; top:2px; inset-inline-start:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.2); transition:inset-inline-start .25s var(--ease); }
.switch[aria-checked="true"] { background:var(--success); }
.switch[aria-checked="true"]::after { inset-inline-start:22px; }
.switch:disabled { opacity:.4; cursor:default; }

.stepper { display:inline-flex; align-items:center; border:1px solid var(--input); border-radius:var(--radius-lg); overflow:hidden; flex:none; }
.stepper button { width:40px; height:36px; font-size:18px; }
.stepper button:disabled { opacity:.3; cursor:default; }
.stepper input { width:52px; height:36px; text-align:center; border:0; background:transparent; border-inline:1px solid var(--input); font-weight:600; }

.seg { display:flex; background:var(--secondary); border-radius:var(--radius-lg); padding:2px; }
.seg button { flex:1; min-height:34px; border-radius:8px; font-size:13px; font-weight:500; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 6px; line-height:1.25; }
.seg button[aria-checked="true"] { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.12); font-weight:600; }
[data-theme="dark"] .seg button[aria-checked="true"] { background:#3a3a3a; }
.seg button .sub { font-size:11px; font-weight:400; color:var(--muted-fg); }

/* Radio dot */
.radio { width:22px; height:22px; border-radius:50%; border:1.5px solid var(--input); flex:none; transition:border-width .2s var(--ease), border-color .2s; }
[aria-checked="true"] > .radio, .radio.on { border:6.5px solid var(--foreground); }
.check { width:22px; height:22px; display:grid; place-items:center; flex:none; color:var(--foreground); opacity:0; }
[aria-checked="true"] > .check { opacity:1; }

/* Preview play button with progress ring */
.play { width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center; position:relative; background:var(--wash-2); color:var(--foreground); --p:0; transition:background .2s; }
.play:hover { background:color-mix(in srgb, var(--foreground) 15%, transparent); }
.play.on { background:var(--primary); color:var(--primary-fg); }
.play.on::before { content:""; position:absolute; inset:-4px; border-radius:50%;
  background:conic-gradient(var(--foreground) calc(var(--p) * 360deg), var(--wash-2) 0);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
          mask:radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); }
.eq { display:inline-flex; gap:2px; align-items:flex-end; height:12px; }
.eq i { width:2.5px; background:currentColor; border-radius:1px; animation:eq .9s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay:-.3s; } .eq i:nth-child(3) { animation-delay:-.6s; }
@keyframes eq { 0%,100% { height:3px } 50% { height:12px } }

/* Bell (Prayer tab rows) */
.bell { width:32px; height:32px; border-radius:16px; display:grid; place-items:center; color:var(--muted-fg); flex:none; position:relative; }
.bell.on { color:var(--foreground); }
.bell .dot { position:absolute; top:6px; inset-inline-end:6px; width:7px; height:7px; border-radius:50%; box-shadow:0 0 0 2px var(--card); }
.bell .dot.voice { background:var(--success); }
.bell .dot.muted { background:var(--muted-fg); }

/* Prayer tab (approved 'Next up', variant A of prayer.html) — context behind the sheet */
.a-hero { margin:16px 16px 0; padding:22px 22px 18px; border-radius:28px; background:var(--primary); color:var(--primary-fg); position:relative; overflow:hidden; }
.a-hero .lbl { font-size:13px; opacity:.7; }
.a-hero .name { font-size:40px; font-weight:700; line-height:1.15; margin-top:2px; }
.a-hero .at { font-size:15px; opacity:.8; }
.a-hero .cd { font-size:56px; font-weight:300; letter-spacing:-.02em; line-height:1; margin:18px 0 14px; direction:ltr; text-align:start; }
[dir="rtl"] .a-hero .cd { text-align:right; }
.a-hero .track { height:4px; border-radius:2px; background:color-mix(in srgb, var(--primary-fg) 18%, transparent); overflow:hidden; }
.a-hero .fill { height:100%; background:var(--primary-fg); border-radius:2px; }
.a-hero .hero-bell { position:absolute; top:18px; inset-inline-end:18px; width:40px; height:40px; border-radius:20px; display:grid; place-items:center; background:color-mix(in srgb, var(--primary-fg) 12%, transparent); color:var(--primary-fg); }
.a-loc { display:inline-flex; align-items:center; gap:4px; height:28px; padding:0 10px; border-radius:14px; background:var(--secondary); font-size:13px; font-weight:500; margin-top:6px; }
.a-tt .row { min-height:46px; }
.a-tt .row.past .nm, .a-tt .row.past .tm { color:var(--muted-fg); }
.a-tt .row.now { background:var(--inset); }
.a-tt .row.now .nm { font-weight:700; }
.a-tt .tm { font-weight:600; }
.a-tt .nm { font-size:16px; }
.a-tt .minor .nm, .a-tt .minor .tm { font-size:14px; font-weight:500; color:var(--muted-fg); }
.tabbar { position:absolute; inset-inline:0; bottom:0; height:86px; display:flex; justify-content:space-around; padding:8px 8px 0; border-top:1px solid var(--border);
  background:color-mix(in srgb, var(--background) 82%, transparent); backdrop-filter:saturate(1.6) blur(20px); -webkit-backdrop-filter:saturate(1.6) blur(20px); z-index:5; }
.tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:500; color:var(--muted-fg); }
.tab.active { color:var(--foreground); }
.homebar { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:var(--foreground); opacity:.85; z-index:30; }

/* Sheet */
.scrim { position:absolute; inset:0; background:var(--scrim); z-index:20; animation:fade .25s ease-out; }
.sheet { position:absolute; inset-inline:0; bottom:0; z-index:21; background:var(--overlay); border-radius:var(--radius-3xl) var(--radius-3xl) 0 0; max-height:90%; display:flex; flex-direction:column; animation:rise .4s var(--ease); }
.sheet .grab { width:36px; height:5px; border-radius:3px; background:var(--muted-fg); opacity:.4; margin:8px auto 2px; flex:none; }
.sheet-head { display:flex; align-items:center; gap:12px; padding:6px 20px 12px; flex:none; }
.sheet-head h2 { margin:0; font-size:22px; line-height:1.2; }
.sheet-head .sub { font-size:13px; color:var(--muted-fg); margin-top:2px; }
.sheet-body { overflow-y:auto; padding:0 20px 16px; scrollbar-width:none; }
.sheet-body::-webkit-scrollbar { display:none; }
.sheet-foot { flex:none; padding:10px 20px 30px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:12px; }
.label { font-size:13px; font-weight:600; color:var(--muted-fg); margin:20px 2px 8px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.hint { font-size:13px; color:var(--muted-fg); line-height:1.5; margin:8px 2px 0; }
.group { background:var(--wash); border-radius:var(--radius-xl); overflow:hidden; }
.lrow { display:flex; align-items:center; gap:12px; min-height:56px; padding:8px 14px; width:100%; text-align:start; }
.lrow + .lrow, .group-h + .lrow { border-top:1px solid var(--border); }
.lrow .t { font-weight:500; font-size:15px; }
.lrow .d { font-size:12.5px; color:var(--muted-fg); margin-top:1px; }
[aria-checked="true"] .t { font-weight:600; }
.lrow:disabled, .lrow[aria-disabled="true"] { opacity:.4; cursor:default; }
.toast { position:absolute; z-index:40; top:58px; left:50%; transform:translateX(-50%); background:var(--primary); color:var(--primary-fg); padding:10px 16px; border-radius:999px; font-size:13px; font-weight:500; white-space:nowrap; animation:drop .3s var(--ease); }
@keyframes fade { from { opacity:0 } }
@keyframes rise { from { transform:translateY(100%) } }
@keyframes drop { from { opacity:0; transform:translate(-50%,-8px) } }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

/* Live summary sentence (shared) */
.summary { display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:var(--radius-xl); background:var(--wash); font-size:15px; font-weight:500; line-height:1.45; }
.summary .ic { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--primary); color:var(--primary-fg); flex:none; }
.summary.off .ic { background:var(--wash-2); color:var(--muted-fg); }
.summary.off { color:var(--muted-fg); }

/* ── Variant A · Alert type ──────────────────────────── */
.a-types { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.a-types button { height:72px; border-radius:var(--radius-xl); background:var(--wash); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:13px; font-weight:500; border:1.5px solid transparent; transition:background .2s var(--ease), color .2s var(--ease); }
.a-types button[aria-checked="true"] { background:var(--primary); color:var(--primary-fg); font-weight:600; }
.a-ctx { animation:ctx .3s var(--ease); }
@keyframes ctx { from { opacity:0; transform:translateY(6px) } }
.a-preview { width:100%; display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--radius-xl); border:1px solid var(--input); margin-top:12px; text-align:start; }
.a-preview .play { pointer-events:none; }
.a-preview .bar { height:3px; border-radius:2px; background:var(--wash-2); margin-top:6px; overflow:hidden; }
.a-preview .bar i { display:block; height:100%; width:calc(var(--p, 0) * 100%); background:var(--foreground); }
.a-timing { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.minitypes { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; background:var(--wash); border-radius:var(--radius-lg); padding:3px; margin-top:10px; }
.minitypes button { height:32px; border-radius:8px; font-size:12.5px; font-weight:500; display:flex; align-items:center; justify-content:center; gap:5px; }
.minitypes button[aria-checked="true"] { background:var(--primary); color:var(--primary-fg); font-weight:600; }

/* ── Variant B · One list ────────────────────────────── */
.b-master { display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:var(--radius-xl); background:var(--wash); }
.b-master .t { font-weight:600; font-size:17px; }
.b-master .d { font-size:13.5px; color:var(--muted-fg); margin-top:2px; line-height:1.45; }
.b-master.on .d { color:var(--foreground); }
.b-chips { display:flex; flex-wrap:wrap; gap:8px; }
.group-h { font-size:12px; font-weight:600; color:var(--muted-fg); padding:14px 14px 4px; display:flex; align-items:center; gap:6px; border-top:1px solid var(--border); }
.group-h + .lrow { border-top:0; }
.b-list .lrow { min-height:58px; }
.b-list .dur { font-size:12px; color:var(--muted-fg); white-space:nowrap; }
.b-off { padding:28px 8px; text-align:center; color:var(--muted-fg); font-size:14px; line-height:1.6; }

/* ── Variant C · Summary drill-in ────────────────────── */
.c-hero { display:flex; gap:14px; align-items:flex-start; padding:18px 16px; border-radius:var(--radius-2xl); background:var(--primary); color:var(--primary-fg); }
.c-hero.off { background:var(--wash); color:var(--muted-fg); }
.c-hero .k { font-size:12px; opacity:.7; font-weight:500; }
.c-hero .s1 { font-size:20px; font-weight:700; line-height:1.3; margin-top:4px; }
.c-hero .s2 { font-size:15px; opacity:.75; margin-top:2px; }
.c-hero .play { background:color-mix(in srgb, var(--primary-fg) 14%, transparent); color:var(--primary-fg); }
.c-hero .play.on { background:var(--primary-fg); color:var(--primary); }
.c-hero .play.on::before { background:conic-gradient(var(--primary-fg) calc(var(--p) * 360deg), color-mix(in srgb, var(--primary-fg) 20%, transparent) 0); }
.c-rows .lrow { min-height:54px; }
.c-rows .v { color:var(--muted-fg); font-size:15px; max-width:56%; text-align:end; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.c-page { animation:slide .32s var(--ease); }
[dir="rtl"] .c-page { animation-name:slideRtl; }
@keyframes slide { from { opacity:0; transform:translateX(28px) } }
@keyframes slideRtl { from { opacity:0; transform:translateX(-28px) } }
.c-big { text-align:center; padding:10px 0 4px; }
.c-big b { font-size:64px; font-weight:300; line-height:1; letter-spacing:-.02em; display:block; }
.c-big span { font-size:15px; color:var(--muted-fg); }
input[type="range"] { width:100%; accent-color:var(--foreground); margin:16px 0 4px; }
.c-ticks { display:flex; justify-content:space-between; font-size:11px; color:var(--muted-fg); padding:0 2px; }
.ticon { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--wash-2); flex:none; }
.ticon.on { background:var(--primary); color:var(--primary-fg); }

/* Settings screen */
.banner { padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
.srow { padding:12px 16px; }
.srow + .srow { border-top:1px solid var(--border); }
.timein { height:36px; border-radius:var(--radius-lg); border:1px solid var(--input); background:transparent; padding:0 10px; color-scheme:light dark; }
.timein:disabled { opacity:.4; }

/* ── Prototype chrome (outside the design) ───────────── */
.side { width:320px; flex:none; font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color:#e8e8e8; direction:ltr; text-align:left; }
.side details { background:#121212; border:1px solid #333; border-radius:12px; padding:10px 14px; }
.side details + details { margin-top:10px; }
.side summary { cursor:pointer; font-weight:700; color:#d9f99d; }
.side h4 { margin:12px 0 4px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#9ca3af; }
.side p { margin:4px 0; color:#cbd5e1; }
.side ul { margin:0; padding-left:16px; }
.side li { margin:2px 0; }
.side .kv { display:grid; grid-template-columns:76px 1fr; gap:2px 8px; }
.side .kv span:nth-child(odd) { color:#9ca3af; }
.side .sim { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center; }
.side .sim button { border:1px solid #444; border-radius:6px; padding:3px 8px; color:#e8e8e8; font:inherit; font-size:12px; }
.side .sim button.on { background:#d9f99d; color:#111; border-color:#d9f99d; }
.side table { border-collapse:collapse; width:100%; font-size:11.5px; }
.side td { border-top:1px solid #2a2a2a; padding:4px 4px; vertical-align:top; }

  audio.ctx = audio.ctx || new AC();
  const ctx = audio.ctx, now = ctx.currentTime;
  [[880, 0], [1318.5, .16]].forEach(([f, at]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, now + at); g.gain.linearRampToValueAtTime(.22, now + at + .02); g.gain.exponentialRampToValueAtTime(.0001, now + at + .5);
    o.connect(g).connect(ctx.destination); o.start(now + at); o.stop(now + at + .55);
  });
}
function playSound(id) {
  if (audio.id === id) { stopAudio(); return; }
  stopAudio(true);
  audio.id = id; audio.start = performance.now();
  if (id === "default") {
    synthSystemSound();
    setTimeout(() => { if (audio.id === "default") stopAudio(); }, SOUNDS.default.dur * 1000);
  } else {
    const el = new Audio(SOUNDS[id].src);
    audio.el = el;
    el.onended = () => stopAudio();
    el.onerror = () => { if (audio.el === el) { stopAudio(); toast("⚠ " + SOUNDS[id].src); } };
    el.play().catch((err) => { if (audio.el === el && err.name !== "AbortError") { console.warn("preview blocked:", err.name); stopAudio(); } });
  }
  render();
  const loop = () => {
    if (!audio.id) return;
    const total = audio.el && isFinite(audio.el.duration) ? audio.el.duration : SOUNDS[audio.id].dur;
    const cur = audio.el ? audio.el.currentTime : (performance.now() - audio.start) / 1000;
    const p = Math.min(1, cur / total);
    phone.querySelectorAll(`[data-prog="${audio.id}"]`).forEach((el) => el.style.setProperty("--p", p));
    phone.querySelectorAll(`[data-elapsed="${audio.id}"]`).forEach((el) => { el.textContent = `${fmtDur(cur)} / ${fmtDur(total)}`; });
    audio.raf = requestAnimationFrame(loop);
  };
  audio.raf = requestAnimationFrame(loop);
}
const playing = (id) => audio.id === id;

  const on = playing(id), name = soundName(id);

      <button class="grow" style="text-align:start" data-act="open" data-name="${n}">${head} ${time}<span class="small ${r.enabled ? "" : "muted"}" style="display:block;margin-top:2px">${esc(summary(n, r))}</span></button>
      <button class="switch" role="switch" aria-checked="${r.enabled}" data-act="rowmaster" data-name="${n}" aria-label="${esc(title(n) + ": " + t("rule.enabled"))}"></button></div>`;
  return `<button class="srow" style="display:flex;align-items:center;gap:12px;width:100%;text-align:start" data-act="open" data-name="${n}">
      <span class="ticon ${r.enabled ? "on" : ""}">${icon(TYPE_ICON[ty], 17, 2)}</span>
      <span class="grow">${head} ${time}<span class="small muted" style="display:block;margin-top:2px">${esc(summary(n, r))}</span></span>${icon("chev", 16, 2, "flipx")}</button>`;
}
function renderSettings() {
  const q = S.quietHours;
  const banner = S.access === "denied"
    ? `<div class="section"><div class="card banner"><div>${esc(t("screen.denied"))}</div><button class="btn btn-primary" data-act="toast" data-msg="${esc(t("screen.allow"))}">${esc(t("screen.allow"))}</button></div></div>`
    : S.access === "late" ? `<div class="section"><div class="card banner"><div>${esc(t("screen.exactAlarms"))}</div><button class="btn btn-primary" data-act="allowExact">${esc(t("screen.allowExactAlarms"))}</button></div></div>` : "";
  return `<div class="navbar"><button class="iconbtn" data-act="view" data-v="prayer" aria-label="${esc(t("p.back"))}">${icon("chevBack", 18, 2.2, "flipx")}</button><span></span></div>
    <div class="largetitle">${esc(t("settingsReminders.title"))}</div>
    <div class="section" style="margin-top:8px"><div class="muted" style="font-size:15px;line-height:1.5;padding:0 4px">${esc(t("screen.intro"))}</div></div>
    ${banner}
    ${S.hasLocation ? "" : `<div class="section"><div class="muted" style="padding:0 4px">${esc(t("screen.noLocation"))}</div></div>`}
    <div class="section"><div class="sec-title"><span>${esc(t("screen.salahTitle"))}</span></div><div class="card" style="overflow:hidden">${SALAH.map(settingsRow).join("")}</div></div>
    <div class="section"><div class="sec-title"><span>${esc(t("screen.imsakTitle"))}</span></div><div class="card" style="overflow:hidden">${settingsRow("imsak")}</div>
      <div class="muted small" style="padding:8px 4px 0">${esc(t("screen.imsakDescription"))}</div></div>
    <div class="section"><div class="sec-title"><span>${esc(t("quietHours.title"))}</span></div>
      <div class="card" style="overflow:hidden">
        <div class="row" style="min-height:56px">${icon("moon", 18)}<div class="grow" style="font-weight:500">${esc(t("quietHours.enabled"))}</div><button class="switch" role="switch" aria-checked="${q.enabled}" data-act="qh" aria-label="${esc(t("quietHours.enabled"))}"></button></div>
        ${["start","end"].map((edge) => `<div class="row"><label class="grow" for="qh-${edge}">${esc(t(`quietHours.${edge}`))}</label><input id="qh-${edge}" class="timein num" type="time" value="${hhmm(q[edge])}" data-input="qh" data-edge="${edge}" ${q.enabled ? "" : "disabled"}/></div>`).join("")}
      </div><div class="muted small" style="padding:8px 4px 0">${esc(t("quietHours.description"))}</div></div>`;
}

// ── Side state panel ──
function renderSide() {
  const v = VARIANTS.find((x) => x.key === S.variant);
  const rules = REMINDABLE.map((n) => {
    const r = S.rules[n];
    return `<span>${n}</span><span>${typeOf(r)} · {enabled:${r.enabled}, muted:${r.muted}, voice:${r.voice}, sound:${r.sound}, adhan:${r.adhan}, minutesBefore:${r.minutesBefore}}</span>`;
  }).join("");
  const n = S.sheet ? S.sheet.name : null;
  const prop = PROPOSED_KEYS.map((k) => {
    const fmt = (lang) => esc(get(k, lang));
    return `<tr><td>${k.replace(/^p\./, "")}</td><td class="ar">${fmt("ar")}</td><td>${fmt("en")}</td></tr>`;
  }).join("");
  document.getElementById("side").innerHTML = `<details open><summary>Variant ${S.variant} · ${v.name}</summary>
    <p>${esc(v.why)}</p>
    <h4>Carries everything today's RuleCard does</h4><ul>
      <li>enabled → Off (${S.variant === "B" ? "master switch" : "alert type"})</li>
      <li>muted → Silent · voice → Adhan · otherwise Tone (precedence made visible)</li>
      <li>minutesBefore 0..60 (${S.variant === "A" ? "stepper" : S.variant === "B" ? "chips + custom stepper" : "slider + chips"})</li>
      <li>sound: System / Chime / Bell, each previewable</li>
      <li>adhan: 2 muezzins × takbeer/full, each previewable (full stoppable)</li>
      <li>iOS 30 s note (toggle platform below) · Imsak description</li>
      <li>Settings screen: intro, notification-denied / exact-alarm banners, no-location note, 5 Salah + Imsak, quiet hours</li>
      <li>Live one-line summary of what will happen</li></ul>
    <h4>State</h4><div class="kv">
      <span>view</span><span>${S.view}${S.sheet ? ` + sheet(${S.sheet.name}${S.variant === "C" ? "/" + S.sheet.page : ""})` : ""}</span>
      <span>playing</span><span>${audio.id || "—"}</span>
      ${n ? `<span>summary</span><span>${esc(summary(n, S.rules[n]))}</span>` : ""}
      ${rules}
      <span>quiet</span><span>${S.quietHours.enabled} ${hhmm(S.quietHours.start)}–${hhmm(S.quietHours.end)}</span>
    </div>
    <h4>Simulate</h4>
    <div class="sim">open: ${REMINDABLE.map((x) => `<button data-sim="open" data-v="${x}" class="${n === x ? "on" : ""}">${x}</button>`).join("")}</div>
    <div class="sim">view: ${["prayer","settings"].map((x) => `<button data-sim="view" data-v="${x}" class="${S.view === x ? "on" : ""}">${x}</button>`).join("")}</div>
    <div class="sim">platform: ${["android","ios"].map((x) => `<button data-sim="platform" data-v="${x}" class="${S.platform === x ? "on" : ""}">${x}</button>`).join("")}</div>
    <div class="sim">notifications: ${["granted","denied","late"].map((x) => `<button data-sim="access" data-v="${x}" class="${S.access === x ? "on" : ""}">${x}</button>`).join("")}</div>
    <div class="sim"><button data-sim="loc" class="${S.hasLocation ? "" : "on"}">no location</button></div>
  </details>
  <details><summary>Proposed strings (${PROPOSED_KEYS.length}, key p.*)</summary>
    <p>Everything else is verbatim from the reminders/settings catalogs.</p>
    <table>${prop}</table></details>`;
}

// ── Render ──
const phone = document.getElementById("phone");
function render() {
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.lang = S.lang;
  phone.dir = S.lang === "ar" ? "rtl" : "ltr";
  phone.lang = S.lang;
  const prev = phone.querySelector(".scroll"), top = prev ? prev.scrollTop : 0;
  const sbPrev = phone.querySelector(".sheet-body"), sbTop = sbPrev ? sbPrev.scrollTop : 0;
  const pageKey = S.sheet ? `${S.sheet.name}/${S.sheet.page}` : "";
  const keep = pageKey && pageKey === render.lastPage;
  const body = S.view === "settings" ? renderSettings() : renderPrayer();
  phone.innerHTML = `${statusBar()}<div class="scroll">${body}</div>${S.view === "prayer" ? tabBar() : ""}<div class="homebar"></div>${sheetHtml()}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ""}`;
  const sc = phone.querySelector(".scroll"); if (sc && S.view === render.lastView) sc.scrollTop = top;
  const sb = phone.querySelector(".sheet-body"); if (sb && keep) sb.scrollTop = sbTop;
  // Only animate the sheet and sub-pages on entry, not on every state change.
  if (keep) phone.querySelectorAll(".sheet, .scrim, .c-page, .a-ctx").forEach((el) => { if (!el.matches(".a-ctx") || el.dataset.ctx === render.lastCtx) el.style.animation = "none"; });
  const ctxEl = phone.querySelector(".a-ctx"); render.lastCtx = ctxEl ? ctxEl.dataset.ctx : null;
  render.lastPage = pageKey; render.lastView = S.view;
  const v = VARIANTS.find((x) => x.key === S.variant);
  document.getElementById("sw-label").textContent = `${v.key} · ${v.name}`;
  document.getElementById("sw-theme").textContent = S.theme === "dark" ? "☀ light" : "☾ dark";
  document.getElementById("sw-lang").textContent = S.lang === "ar" ? "EN" : "عربي";
  renderSide();
}
function syncUrl() {
  const p = new URLSearchParams(location.search);
  p.set("variant", S.variant); p.set("lang", S.lang); p.set("theme", S.theme);
  history.replaceState(null, "", `${location.pathname}?${p}`);
}
function toast(msg) { S.toast = msg; render(); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = null; render(); }, 1800); }
setInterval(() => {
  const el = phone.querySelector('[data-live="cd"]');
  if (!el) return;
  const now = nowSec(), next = TIMETABLE.find((n) => BASE[n] * 60 > now) || TIMETABLE[0];
  el.textContent = fmtCountdown((BASE[next] * 60 - now + 86400) % 86400);
}, 1000);

// ── Actions ──
const rule = () => S.rules[S.sheet.name];
const setMinutes = (r, v) => { r.minutesBefore = Math.max(0, Math.min(MAX_MINUTES_BEFORE, v)); };
phone.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const d = el.dataset;
  switch (d.act) {
    case "open": S.sheet = { name:d.name, page:"root" }; S.bCustom = false; render(); break;
    case "close": stopAudio(true); S.sheet = null; render(); break;
    case "view": stopAudio(true); S.sheet = null; S.view = d.v; render(); break;
    case "toast": toast(t("proto.opens", { route: d.msg })); break;
    case "play": playSound(d.id); break;
    case "type": setType(rule(), d.t); render(); break;
    case "tone": rule().sound = d.k; render(); break;
    case "adhanPick": rule().adhan = d.k; render(); break;
    case "muezzin": rule().adhan = `${d.m}-${adhanOf(rule().adhan).form}`; render(); break;
    case "form": rule().adhan = `${adhanOf(rule().adhan).muezzin}-${d.f}`; render(); break;
    case "pick": {
      const r = rule();
      if (d.kind === "silent") setType(r, "silent");
      if (d.kind === "tone") { setType(r, "tone"); r.sound = d.id; }
      if (d.kind === "adhan") { setType(r, "adhan"); r.adhan = d.id; }
      render(); break;
    }
    case "master": rule().enabled = !rule().enabled; render(); break;
    case "min": setMinutes(rule(), rule().minutesBefore + Number(d.d)); render(); break;
    case "preset": setMinutes(rule(), Number(d.v)); S.bCustom = false; render(); break;
    case "custom": S.bCustom = true; render(); break;
    case "page": stopAudio(true); S.sheet.page = d.p; render(); break;
    case "rowtype": setType(S.rules[d.name], d.t); render(); break;
    case "rowmaster": S.rules[d.name].enabled = !S.rules[d.name].enabled; render(); break;
    case "qh": S.quietHours.enabled = !S.quietHours.enabled; render(); break;
    case "allowExact": S.access = "granted"; render(); break;
  }
});
phone.addEventListener("input", (e) => {
  if (e.target.dataset.input === "range") {
    setMinutes(rule(), Number(e.target.value));
    const big = phone.querySelector(".c-big");
    big.querySelector("b").textContent = digits(rule().minutesBefore);
    big.querySelector("span").textContent = rule().minutesBefore === 0 ? t("p.summary.at", { name: nm(S.sheet.name) }) : t("p.summary.before", { name: nm(S.sheet.name), minutes: minutes(rule().minutesBefore) });
    phone.querySelector(".sheet-foot span").textContent = summary(S.sheet.name, rule());
    phone.querySelectorAll('[data-act="preset"]').forEach((c) => { const on = Number(c.dataset.v) === rule().minutesBefore; c.classList.toggle("on", on); c.setAttribute("aria-pressed", on); });
    renderSide();
  }
});
phone.addEventListener("change", (e) => {
  const k = e.target.dataset.input;
  if (k === "min") {
    const v = parseInt(e.target.value.replace(/[٠-٩]/g, (c) => "٠١٢٣٤٥٦٧٨٩".indexOf(c)), 10);
    if (Number.isInteger(v)) setMinutes(rule(), v);
    render();
  }
  if (k === "range") render();
  if (k === "qh" && e.target.value) { const [h, m] = e.target.value.split(":").map(Number); S.quietHours[e.target.dataset.edge] = h * 60 + m; renderSide(); }
});
phone.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.sheet) { stopAudio(true); S.sheet = null; render(); }
  if (e.key === "Enter" && e.target.dataset.input === "min") e.target.blur();
});
document.getElementById("side").addEventListener("click", (e) => {
  const b = e.target.closest("[data-sim]"); if (!b) return;
  const k = b.dataset.sim, v = b.dataset.v;
  if (k === "open") { S.sheet = { name:v, page:"root" }; S.bCustom = false; }
  if (k === "view") { stopAudio(true); S.view = v; S.sheet = null; }
  if (k === "platform") S.platform = v;
  if (k === "access") S.access = v;
  if (k === "loc") S.hasLocation = !S.hasLocation;
  render();
});

// ── Switcher ──
function cycle(step) {
  const i = VARIANTS.findIndex((x) => x.key === S.variant);
  S.variant = VARIANTS[(i + step + VARIANTS.length) % VARIANTS.length].key;
  if (S.sheet) S.sheet.page = "root";
  stopAudio(true); syncUrl(); render();
}
document.getElementById("sw-prev").onclick = () => cycle(-1);
document.getElementById("sw-next").onclick = () => cycle(1);
document.getElementById("sw-theme").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; syncUrl(); render(); };
document.getElementById("sw-lang").onclick = () => { S.lang = S.lang === "ar" ? "en" : "ar"; syncUrl(); render(); };
document.addEventListener("keydown", (e) => {
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.isContentEditable)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

syncUrl();
render();
</script>
</body>
</html>
