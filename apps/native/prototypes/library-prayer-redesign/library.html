const AR_DIGITS = "٠١٢٣٤٥٦٧٨٩";

const lookup = (obj, key) => key.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
const t = (key, vars = {}) => {
  let s = lookup(S[state.lang], key);
  if (s == null) s = key;
  return s.replace(/\{\{(\w+)\}\}/g, (_, k) => (typeof vars[k] === "number" ? fmt(vars[k]) : vars[k] ?? ""));
};
const pluralAr = new Intl.PluralRules("ar");
const pluralEn = new Intl.PluralRules("en");
const tp = (key, count, vars) => t(`${key}_${(state.lang === "ar" ? pluralAr : pluralEn).select(count)}`, vars);
const L = (o) => (o ? o[state.lang] : "");
const join = (parts) => parts.filter(Boolean).join(t("separator"));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const surahName = (n) => (state.lang === "ar" ? QURAN.s[n - 1][0] : QURAN.s[n - 1][1]);

/* Diacritic-insensitive matching with a map back to the original string, so
   the match can be marked in the title the Believer reads. */
const normChar = (c) => {
  let n = c.normalize("NFD").replace(/[\u0300-\u036f\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640ʿʾ‘’'`]/g, "");
  n = n.replace(/[أإآٱ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/[٠-٩]/g, (d) => AR_DIGITS.indexOf(d));
  return n.toLowerCase();
};
const norm = (s) => Array.from(s).map(normChar).join("").replace(/\s+/g, " ").trim();
const markMatch = (text, query) => {
  const q = norm(query);
  if (!q) return esc(text);
  const chars = Array.from(text);
  let flat = "";
  const map = [];
  chars.forEach((c, i) => { const n = normChar(c); for (const _ of n) { flat += _; map.push(i); } });
  const at = flat.indexOf(q);
  if (at < 0) return esc(text);
  const start = map[at];
  let end = map[at + q.length - 1] + 1;
  while (end < chars.length && normChar(chars[end]) === "") end++;
  return esc(chars.slice(0, start).join("")) + "<mark>" + esc(chars.slice(start, end).join("")) + "</mark>" + esc(chars.slice(end).join(""));
};
const matches = (text, query) => norm(text).includes(norm(query));

const parsePage = (text) => {
  const s = String(text).trim().replace(/[٠-٩]/g, (d) => AR_DIGITS.indexOf(d));
  if (!/^\d{1,3}$/.test(s)) return null;
  const n = Number(s);
  return n >= 1 && n <= PAGE_COUNT ? n : null;
};

  return { cls: "muted", text: t("quran.navigation.pageNumber", { first: 1, last: PAGE_COUNT }), page: null };
};

/* Search: one section per feature, as SearchResults draws them. */
const searchSections = (query) => {
  const q = norm(query);
  const surahs = QURAN.s.map((s, i) => ({ n: i + 1, s })).filter(({ n, s }) => norm(s[0]).includes(q) || norm(s[1]).includes(q) || String(n) === q);
  const supp = SUPPLICATIONS.flatMap((s) => {
    if (matches(s.title.ar, query) || matches(s.title.en, query)) return [{ s, passage: null }];
    if (state.textsIndexed && matches(s.passage, query)) return [{ s, passage: s.passage }];
    return [];
  });
  const assets = assetsList().filter((a) => matches(a.title.ar, query) || matches(a.title.en, query));
  const LIMIT = 6;
  let suppNote;
  if (!state.textsIndexed) suppNote = t("books.search.indexing");
  else if (supp.length > LIMIT) suppNote = t("books.search.more", { shown: LIMIT, total: supp.length });
  return [
    { id: "surahs", title: t("quran.navigation.surahs"), results: surahs.slice(0, 8).map(({ n }) => ({ title: surahName(n), desc: fmt(n), icon: "bookOpen", href: `/quran?surah=${n}` })) },
    { id: "supplications", title: t("books.search.title"), note: suppNote, results: supp.slice(0, LIMIT).map(({ s, passage }) => ({ title: L(s.title), desc: passage || L(BOOKS.find((b) => b.id === s.bookId).title), icon: "scroll", href: `/library/supplication/${s.id}`, passage: !!passage })) },
    { id: "library-assets", title: t("assets.title"), results: assets.map((a) => ({ title: L(a.title), desc: join([t(`assets.category.${a.category}`), t(`assets.kind.${a.kind}`)]), icon: KIND_ICON[a.kind], tint: `t-${a.category}`, href: `/library/asset/${a.id}` })) },
  ];
};

  if (!sections.length) return `<div class="results"><div class="none" aria-live="polite">${t("search.noResults")}</div></div>`;
  return `<div class="results" aria-live="polite">${sections.map((s) => `

};

const continueHref = () => (state.hasLastRead ? `/quran?ayah=${LAST_READ.surah}:${LAST_READ.ayah}` : "/quran?page=1");
const pageInput = (fk, extra = "") => `<input data-model="page" data-fk="${fk}" data-enter="jump" inputmode="numeric" enterkeyhint="go" maxlength="3" value="${esc(state.page)}" placeholder="${state.lang === "ar" ? "١–٦٠٤" : "1–604"}" aria-label="${esc(t("quran.navigation.pageNumber", { first: 1, last: PAGE_COUNT }))}" ${extra} />`;
const favoritesEmpty = () => `<div class="empty-note">${icon("heart")}<span>${t("favorites.empty")}</span></div>`;
const assetsEmpty = () => `<div class="empty-note">${icon("books")}<span>${t("assets.empty")}</span></div>`;

/* Surah / Juz index (Quran index sheet in A and C; inline in B). */
const indexList = () => {
  const curJuz = pageInfo(LAST_READ.page).juz;
  if (state.indexTab === "juz") {
    return QURAN.juz.map((page, i) => {
      const juz = i + 1;
      const s = pageInfo(page).surah;
      return `<button class="srow" data-act="go" data-href="/quran?page=${page}"><span class="no num">${fmt(juz)}</span><span class="body"><div class="nm">${t("quran.navigation.juzTitle", { juz })}</div><div class="mt">${t("quran.navigation.juzMeta", { name: surahName(s), page })}</div></span>${state.hasLastRead && juz === curJuz ? `<span class="cur">${t("quran.navigation.current")}</span>` : ""}</button>`;
    }).join("");
  }
  return QURAN.s.map((s, i) => {
    const n = i + 1;
    return `<button class="srow" data-act="go" data-href="/quran?surah=${n}"><span class="no num">${fmt(n)}</span><span class="body"><div class="nm ${state.lang === "ar" ? "naskh" : ""}">${surahName(n)}</div><div class="mt">${tp("quran.navigation.surahMeta", s[2], { ayat: s[2], page: s[3] })}</div></span>${state.hasLastRead && n === LAST_READ.surah ? `<span class="cur">${t("quran.navigation.current")}</span>` : ""}</button>`;
  }).join("");
};
const indexTabs = () => `<div class="seg2" role="tablist">${["surahs", "juz"].map((k) => `<button role="tab" aria-selected="${state.indexTab === k}" data-act="index-tab" data-v="${k}">${t(`quran.navigation.${k}`)}</button>`).join("")}</div>`;

/* Quran search sheet results */
const quranSearchHTML = () => {
  const q = state.qquery.trim();
  if (!q) return `<p class="muted sm" style="line-height:1.6;margin:4px 4px 0">${t("quran.navigation.searchHint", { surah: 2, ayah: 255 })}</p>`;
  const ref = q.replace(/[٠-٩]/g, (d) => AR_DIGITS.indexOf(d)).match(/^(\d{1,3})\s*[:：]\s*(\d{1,3})$/);
  const surahs = QURAN.s.map((s, i) => i + 1).filter((n) => matches(QURAN.s[n - 1][0], q) || matches(QURAN.s[n - 1][1], q));
  const ayat = AYAT_SAMPLE.filter((a) => matches(a.text, q) || (ref && a.key === `${+ref[1]}:${+ref[2]}`));
  let out = "";
  if (ref && +ref[1] >= 1 && +ref[1] <= 114 && +ref[2] >= 1 && +ref[2] <= QURAN.s[+ref[1] - 1][2]) {
    out += `<div class="group" style="margin-bottom:16px"><button class="row" data-act="go" data-href="/quran?ayah=${+ref[1]}:${+ref[2]}"><span class="body"><span class="title">${t("quran.navigation.ayahRef", { name: surahName(+ref[1]), ayah: +ref[2] })}</span></span>${chev()}</button></div>`;
  }
  if (surahs.length) out += `<h4 class="muted xs" style="margin:0 4px 8px">${t("quran.navigation.surahs")}</h4><div class="group" style="margin-bottom:16px">${surahs.slice(0, 5).map((n) => `<button class="row" data-act="go" data-href="/quran?surah=${n}"><span class="body"><span class="title">${markMatch(surahName(n), q)}</span><span class="desc">${fmt(n)}</span></span>${chev()}</button>`).join("")}</div>`;
  if (ayat.length) out += `<h4 class="muted xs" style="margin:0 4px 8px">${t("quran.navigation.ayat")}</h4><div class="group">${ayat.map((a) => { const [s, y] = a.key.split(":").map(Number); return `<button class="row" data-act="go" data-href="/quran?ayah=${a.key}"><span class="body"><span class="quran-text" style="display:block">${markMatch(a.text, q)}</span><span class="desc">${t("quran.navigation.ayahRef", { name: surahName(s), ayah: y })}</span></span></button>`; }).join("")}</div>`;
  return out || `<p class="muted sm" style="text-align:center;padding:20px 0">${t("quran.navigation.noResults")}</p>`;
};

const sheetHTML = () => {
  if (!state.sheet) return "";
  let title = "", body = "";
  if (state.sheet === "index") {
    title = t("quran.navigation.index");
    body = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 0 8px">${indexTabs()}<button class="btn sm soft" data-act="index-to-jump">${icon("file")}${t("quran.navigation.pageJump")}</button></div><div>${indexList()}</div>`;
  } else if (state.sheet === "qsearch") {
    title = t("quran.navigation.search");
    body = `<label class="field" style="margin-bottom:14px">${icon("search")}<input data-model="qquery" data-fk="qsearch" value="${esc(state.qquery)}" placeholder="${esc(t("quran.navigation.searchPlaceholder"))}" data-autofocus autocomplete="off" /></label>${quranSearchHTML()}`;
  }
  return `<div class="sheet-wrap" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <button class="sheet-backdrop" data-act="close-sheet" aria-label="${esc(t("controls.closeSheet"))}"></button>
    <div class="sheet" style="${state.sheet === "index" ? "height:86%" : "height:72%"}"><div class="grabber"></div>
      <div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="close-sheet" aria-label="${esc(t("controls.closeSheet"))}">${icon("x")}</button></div>
      <div class="sheet-body" data-scroll="sheet-${state.sheet}">${body}</div>
    </div></div>`;
};

/* ======================================================================
 * Variant A — Search hub
 * A permanent search field leads; a dark hero resumes reading; one compact
 * Quran strip holds open / index / search and the inline page jump.
 * ==================================================================== */
const variantA = () => {
  const searching = state.query.trim() !== "";
  const hint = pageHint();
  const favs = favoriteEntries();
  let body;
  if (searching) {
    const counts = Object.fromEntries(searchSections(state.query).map((s) => [s.id, s.results.length]));
    const scopes = [["all", t("lessons.categories.all")], ["surahs", t("quran.navigation.surahs")], ["supplications", t("books.search.title")], ["library-assets", t("assets.title")]];
    body = `<div class="a-scopes chips" role="tablist">${scopes.map(([k, label]) => `<button class="chip" role="tab" aria-selected="${state.scope === k}" data-act="scope" data-v="${k}">${esc(label)}${k !== "all" ? `<span class="n num">${fmt(counts[k] || 0)}</span>` : ""}</button>`).join("")}</div>${resultsHTML(state.query, state.scope)}`;

    ${state.hasLastRead ? `
    <section class="a-hero" aria-label="${esc(t("quran.lastRead.continue"))}">

      <h2 class="${state.lang === "ar" ? "naskh" : ""}">${surahName(LAST_READ.surah)}</h2>

      <div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="${PAGE_COUNT}" aria-valuenow="${LAST_READ.page}"><span style="width:${(LAST_READ.page / PAGE_COUNT) * 100}%"></span></div>
      <div class="foot"><span class="xs" style="opacity:.75">${t("quran.chrome.position", { juz: pageInfo(LAST_READ.page).juz, page: LAST_READ.page })}</span><button class="btn" data-act="go" data-href="${continueHref()}">${icon("bookmark")}${t("quran.lastRead.resume")}</button></div>
    </section>` : `
    <section class="a-hero empty">
      <div class="eyebrow">${icon("bookmark")}${t("quran.lastRead.continue")}</div>
      <h2>${t("quran.lastRead.empty")}</h2>
      <div class="foot" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-act="go" data-href="/quran?page=1">${icon("bookmark")}${t("quran.lastRead.start")}</button></div>
    </section>`}

    <section class="a-strip" aria-label="${esc(t("quran.title"))}">
      <div class="a-strip-head"><b>${t("quran.title")}</b><span>${t("quran.library.description", { pages: PAGE_COUNT })}</span></div>
      <div class="a-actions">
        <button class="a-act primary" data-act="go" data-href="/quran?page=1">${icon("bookOpen")}${t("quran.library.open")}</button>
        <button class="a-act" data-act="sheet" data-v="index">${icon("list")}${t("quran.navigation.index")}</button>
        <button class="a-act" data-act="sheet" data-v="qsearch">${icon("search")}${t("quran.navigation.search")}</button>
      </div>
      <div class="a-jump">
        <label for="pj-a">${icon("file")}${t("quran.navigation.pageJump")}</label>
        <span class="field ${hint.cls === "err" ? "invalid" : ""}">${pageInput("page-A", 'id="pj-a"')}</span>
        <button class="btn sm" data-act="jump" ${hint.page ? "" : "disabled"}>${t("quran.navigation.open")}</button>
      </div>
      <div class="a-jump-hint ${hint.cls}" aria-live="polite">${esc(hint.text)}</div>
    </section>

    <div class="sec-h"><h3>${t("favorites.title")}</h3>${favs.length ? `<span class="count num">${fmt(favs.length)}</span>` : ""}</div>
    <div class="a-list group">${favs.length ? favs.map((f) => `
      <button class="row has-media" data-act="go" data-href="${esc(f.href)}"><span class="thumb">${icon(FAV_ICON[f.kind])}</span><span class="body"><span class="title">${esc(f.title)}</span><span class="desc">${t(`favorites.kind.${f.kind}`)}</span></span>${chev()}</button>`).join("") : favoritesEmpty()}</div>

    <div class="sec-h"><h3>${t("books.books")}</h3></div>
    <div class="a-list group">${BOOKS.map((b) => `
      <button class="row has-media" data-act="go" data-href="/library/book/${b.id}"><span class="thumb ${b.tint}">${icon("bookOpen")}</span><span class="body"><span class="title">${L(b.title)}</span><span class="desc">${bookDesc(b)}</span></span>${chev()}</button>`).join("")}</div>

    <div class="sec-h"><h3>${t("lessons.link.title")}</h3></div>
    <section class="a-lessons">
      ${ring(LESSONS.completed, LESSONS.total)}
      <div class="body"><div class="t">${t("lessons.link.completed", { completed: LESSONS.completed, total: LESSONS.total })}</div><p class="d">${t("lessons.link.description")}</p></div>
      <button class="btn sm outline" data-act="go" data-href="/library/lessons" data-testid="lessons-open">${t("lessons.link.open")}</button>
    </section>

    <div class="sec-h"><h3>${t("assets.title")}</h3></div>
    ${shelves().length ? shelves().map((sh) => `<div class="sublabel">${t(`assets.category.${sh.category}`)}</div><div class="a-list group" style="margin-bottom:6px">${sh.assets.map((a) => `
      <button class="row has-media" data-act="go" data-href="/library/asset/${a.id}"><span class="thumb t-${a.category}">${icon(KIND_ICON[a.kind])}</span><span class="body"><span class="title">${esc(L(a.title))}</span><span class="desc">${esc(assetDesc(a))}</span></span>${chev()}</button>`).join("")}</div>`).join("") : `<div class="a-list group">${assetsEmpty()}</div>`}
    <div style="height:20px"></div>`;
  }
  return `${navBar()}<main class="content" data-scroll="A"><div class="a-search">${searchField("q-A")}</div>${body}</main>`;
};

/* ======================================================================
 * Variant B — Sections
 * A segmented bar splits the Library into Quran · Books · Lessons · Media ·
 * Favorites; the Quran pane carries the Surah/Juz index inline as its list.
 * Search lives behind the nav-bar button.
 * ==================================================================== */
const variantB = () => {
  const favs = favoriteEntries();
  const segs = [
    ["quran", t("assets.category.quran")],
    ["books", t("books.books")],
    ["lessons", t("lessons.link.title")],
    ["media", t("proto.media")],
    ["favorites", t("favorites.title"), favs.length],
  ];
  const searching = state.searchOpen && state.query.trim() !== "";
  const hint = pageHint();
  let pane = "";
  if (state.segment === "quran") {
    pane = `
      ${state.hasLastRead ? `
      <div class="b-resume"><span class="ic">${icon("bookmark")}</span><div class="body"><div class="t">${t("quran.lastRead.continue")}</div><div class="p" data-testid="quran-last-read-position">${lastReadPosition()}</div></div><button class="btn sm" data-act="go" data-href="${continueHref()}">${t("quran.lastRead.resume")}</button></div>` : `
      <div class="b-resume"><span class="ic">${icon("bookmark")}</span><div class="body"><div class="t">${t("quran.lastRead.continue")}</div><div class="p" style="font-weight:500;font-size:14px">${t("quran.lastRead.empty")}</div></div><button class="btn sm" data-act="go" data-href="/quran?page=1">${t("quran.lastRead.start")}</button></div>`}
      <div class="b-tools">
        <button class="btn soft" data-act="go" data-href="/quran?page=1">${icon("bookOpen")}${t("quran.library.open")}</button>
        <button class="btn soft" data-act="sheet" data-v="qsearch">${icon("search")}${t("quran.navigation.search")}</button>
      </div>
      <div class="b-jump">
        <div class="top"><label for="pj-b">${icon("file")}${t("quran.navigation.pageJump")}</label><span class="field ${hint.cls === "err" ? "invalid" : ""}">${pageInput("page-B", 'id="pj-b"')}</span><button class="btn sm" data-act="jump" ${hint.page ? "" : "disabled"} aria-label="${esc(t("quran.navigation.open"))}">${icon("arrow", "flip")}</button></div>
        <div class="hint ${hint.cls}" aria-live="polite">${esc(hint.text)}</div>
      </div>
      <div class="b-index-h"><h3>${t("quran.navigation.index")}</h3>${indexTabs()}</div>
      <div class="b-index">${indexList()}</div>
      <p class="muted xs" style="padding:14px 20px 0;line-height:1.5">${t("quran.library.description", { pages: PAGE_COUNT })}</p>`;
  } else if (state.segment === "books") {
    pane = BOOKS.map((b) => {
      const open = !!state.openBooks[b.id];
      return `<section class="b-book">
        <button class="b-book-h" data-act="toggle-book" data-v="${b.id}" aria-expanded="${open}">
          <span class="spine ${b.tint}">${icon("bookOpen")}</span>
          <span class="body"><div class="t">${L(b.title)}</div><div class="d">${bookDesc(b)}</div></span>
          ${icon("chevron", "tw flip")}
        </button>
        ${open ? b.sections.map((s, si) => {
          return `<div class="b-book-sec"><span>${L(s.title)}</span><span class="num">${t("proto.supplicationsCount", { count: s.total })}</span></div>
          ${s.items.slice(0, 3).map(([id, ar, en]) => `<button class="row" data-act="go" data-href="/library/supplication/${id}"><span class="body"><span class="title">${state.lang === "ar" ? ar : en}</span></span>${chev()}</button>`).join("")}
          ${s.total > 3 ? `<button class="more" data-act="go" data-href="/library/book/${b.id}">${t("proto.showAll", { count: s.total })}</button>` : ""}`;
        }).join("") : ""}
      </section>`;
    }).join("");
  } else if (state.segment === "lessons") {
    pane = `<section class="b-lessons">
        <div class="stat">${ring(LESSONS.completed, LESSONS.total, 56)}<div><div class="big num">${fmt(LESSONS.completed)}<span class="muted" style="font-size:16px;font-weight:500"> / ${fmt(LESSONS.total)}</span></div><div class="muted xs" style="margin-top:4px">${t("lessons.link.completed", { completed: LESSONS.completed, total: LESSONS.total })}</div></div></div>
        <p>${t("lessons.link.description")}</p>
        <button class="btn" style="width:100%" data-act="go" data-href="/library/lessons" data-testid="lessons-open">${icon("cap")}${t("lessons.link.open")}</button>
      </section>
      <div class="sublabel" style="padding-top:20px">${t("lessons.categories.label")}</div>
      <div class="group" style="margin:0 16px">${Object.entries(LESSONS.byCategory).map(([k, n]) => `<button class="row" data-act="go" data-href="/library/lessons?category=${k}"><span class="body"><span class="title">${t(`lessons.categories.${k}`)}</span></span><span class="muted sm num">${t("proto.lessonsIn", { count: n })}</span>${chev()}</button>`).join("")}</div>`;
  } else if (state.segment === "media") {
    const cats = shelves();
    const list = assetsList().filter((a) => state.mediaCat === "all" || a.category === state.mediaCat);
    pane = cats.length ? `<div class="chips" role="tablist" style="padding-bottom:12px">${[["all", t("lessons.categories.all")], ...cats.map((c) => [c.category, t(`assets.category.${c.category}`)])].map(([k, l]) => `<button class="chip" role="tab" aria-selected="${state.mediaCat === k}" data-act="media-cat" data-v="${k}">${l}</button>`).join("")}</div>
      <div class="group" style="margin:0 16px">${list.map((a) => `<button class="row has-media" data-act="go" data-href="/library/asset/${a.id}"><span class="thumb t-${a.category}">${icon(KIND_ICON[a.kind])}</span><span class="body"><span class="title">${esc(L(a.title))}</span><span class="desc">${esc(join([t(`assets.category.${a.category}`), assetDesc(a)]))}</span></span>${chev()}</button>`).join("")}</div>`
      : `<div class="group" style="margin:0 16px">${assetsEmpty()}</div>`;
  } else {
    pane = `<div class="group" style="margin:0 16px">${favs.length ? favs.map((f) => `<button class="row has-media" data-act="go" data-href="${esc(f.href)}"><span class="thumb">${icon(FAV_ICON[f.kind])}</span><span class="body"><span class="title">${esc(f.title)}</span><span class="desc">${t(`favorites.kind.${f.kind}`)}</span></span>${chev()}</button>`).join("") : favoritesEmpty()}</div>`;
  }
  const actions = `<button class="icon-btn" data-act="toggle-search" aria-pressed="${state.searchOpen}" aria-label="${esc(t("search.label"))}">${icon(state.searchOpen ? "x" : "search")}</button>`;
  return `${navBar(actions)}
    ${state.searchOpen ? `<div class="b-search" style="background:var(--background)">${searchField("q-B", true)}</div>` : ""}
    <main class="content" data-scroll="B-${searching ? "search" : state.segment}">
      ${searching ? resultsHTML(state.query) : `
      <div class="b-seg"><div class="tabs" role="tablist">${segs.map(([k, l, n]) => `<button class="b-tab" role="tab" aria-selected="${state.segment === k}" data-act="segment" data-v="${k}">${l}${n ? `<span class="n num">${fmt(n)}</span>` : ""}</button>`).join("")}</div></div>
      <div class="b-pane">${pane}</div>`}
    </main>`;
};

/* ======================================================================

      <div class="c-tile c-scrub">

          <span class="pv ${hint.cls}" aria-live="polite">${esc(hint.text)}</span>
          <button class="btn sm" data-act="jump" ${hint.page ? "" : "disabled"}>${t("quran.navigation.open")}</button>
        </div>
      </div>
      <p class="c-desc">${t("quran.library.description", { pages: PAGE_COUNT })}</p>
    </section>

    <section class="c-shelf"><div class="sec-h"><h3>${t("favorites.title")}</h3>${favs.length ? `<span class="count num">${fmt(favs.length)}</span>` : ""}</div>
      ${favs.length ? `<div class="c-row" data-scroll="c-fav">${favs.map((f) => `<button class="c-card c-fav" data-act="go" data-href="${esc(f.href)}"><span class="k">${icon("heart")}${t(`favorites.kind.${f.kind}`)}</span><span class="t ${f.kind !== "library-asset" && state.lang === "ar" ? "naskh" : ""}">${esc(f.title)}</span></button>`).join("")}</div>` : `<div class="group" style="margin:0 16px">${favoritesEmpty()}</div>`}
    </section>

    <section class="c-shelf"><div class="sec-h"><h3>${t("books.books")}</h3></div>
      <div class="c-row" data-scroll="c-books">${BOOKS.map((b) => `<button class="c-card c-book" data-act="go" data-href="/library/book/${b.id}"><div class="c-cover ${coverTone[b.id]}"><span class="ct">${L(b.title)}</span><span class="cn num">${t("proto.sections", { count: b.sections.length })}</span></div><div class="meta">${bookDesc(b)}</div></button>`).join("")}</div>
    </section>

    <section class="c-lessons">
      <h3>${t("lessons.link.title")}</h3>
      ${ring(LESSONS.completed, LESSONS.total, 58)}
      <p>${t("lessons.link.description")}</p>
      <div class="foot"><span class="sm" style="font-weight:600">${t("lessons.link.completed", { completed: LESSONS.completed, total: LESSONS.total })}</span><button class="btn sm" data-act="go" data-href="/library/lessons" data-testid="lessons-open">${t("lessons.link.open")}</button></div>
    </section>

    <section class="c-shelf"><div class="sec-h"><h3>${t("assets.title")}</h3></div>
      ${shelves().length ? shelves().map((sh) => `<div class="cat">${t(`assets.category.${sh.category}`)}</div><div class="c-row" data-scroll="c-${sh.category}">${sh.assets.map((a) => `<button class="c-card c-asset" data-act="go" data-href="/library/asset/${a.id}"><div class="c-art t-${a.category}">${icon(KIND_ICON[a.kind])}<span class="kind">${t(`assets.kind.${a.kind}`)}</span></div><div class="t">${esc(L(a.title))}</div>${a.author ? `<div class="a">${esc(L(a.author))}</div>` : ""}</button>`).join("")}</div>`).join("") : `<div class="group" style="margin:0 16px">${assetsEmpty()}</div>`}
    </section>`;
  const overlay = state.searchOpen ? `<div class="c-overlay">${statusBar()}
      <div class="bar-top">${searchField("q-C", true)}<button class="link" data-act="toggle-search">${t("controls.close")}</button></div>
      <div class="scroll" data-scroll="C-search">${state.query.trim() ? resultsHTML(state.query) : `<div class="c-recent"><h4>${t("quran.navigation.surahs")} · ${t("books.search.title")}</h4><div class="chips">${[surahName(36), surahName(18), L(supplicationById("mafatih-dua-kumayl").title), L(supplicationById("mafatih-ziyarat-ashura").title)].map((s) => `<button class="chip" data-act="suggest" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`}</div>
    </div>` : "";
  const actions = `<button class="icon-btn" data-act="toggle-search" aria-label="${esc(t("search.label"))}">${icon("search")}</button>`;
  return `${navBar(actions)}<main class="content" data-scroll="C">${content}<div style="height:24px"></div></main>${overlay}`;
};

/* ---------------------------------------------------------------------------
 * Render + focus/scroll preservation
 * ------------------------------------------------------------------------- */
const phone = document.getElementById("phone");
const screen = document.getElementById("screen");
const render = () => {
  const ae = document.activeElement;
  const focus = ae && ae.dataset && ae.dataset.fk ? { fk: ae.dataset.fk, s: ae.selectionStart, e: ae.selectionEnd } : null;
  const scrolls = {};
  screen.querySelectorAll("[data-scroll]").forEach((el) => { scrolls[el.dataset.scroll] = [el.scrollTop, el.scrollLeft]; });

  document.documentElement.lang = state.lang;
  phone.setAttribute("dir", state.lang === "ar" ? "rtl" : "ltr");
  phone.setAttribute("lang", state.lang);
  phone.classList.toggle("dark", state.theme === "dark");
  document.body.classList.toggle("page-dark", state.theme === "dark");

  const view = { A: variantA, B: variantB, C: variantC }[state.variant]();
  screen.innerHTML = statusBar() + view + tabBar() + sheetHTML() + (state.toast ? `<div class="toast" role="status">${icon("arrow", "flip")}<span>${esc(state.toast.label)}</span><code>${esc(state.toast.href)}</code></div>` : "");

  screen.querySelectorAll("[data-scroll]").forEach((el) => { const s = scrolls[el.dataset.scroll]; if (s) { el.scrollTop = s[0]; el.scrollLeft = s[1]; } });
  if (focus) {
    const el = screen.querySelector(`[data-fk="${focus.fk}"]`);
    if (el) { el.focus({ preventScroll: true }); try { if (focus.s != null) el.setSelectionRange(focus.s, focus.e); } catch (_) {} }
  } else {
    const af = screen.querySelector("[data-autofocus]");
    if (af && pendingAutofocus) af.focus({ preventScroll: true });
  }
  pendingAutofocus = false;
  renderChrome();
};
let pendingAutofocus = false;

/* Scale the phone down on short windows so the switcher never covers it. */
const fit = () => phone.style.setProperty("--fit", Math.min(1, (innerHeight - 28 - 96) / 868).toFixed(3));
addEventListener("resize", fit);
fit();

const syncURL = () => {
  const p = new URLSearchParams(location.search);
  p.set("variant", state.variant);
  state.lang === "en" ? p.set("lang", "en") : p.delete("lang");
  state.theme === "dark" ? p.set("theme", "dark") : p.delete("theme");
  history.replaceState(null, "", `${location.pathname}?${p}`);
};

const go = (href) => {
  const label = state.lang === "ar" ? "يفتح" : "Opens";
  state.toast = { href, label };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 1800);
  render();
};
const startIndexing = () => {
  if (state.textsIndexed || indexTimer) return;
  indexTimer = setTimeout(() => { state.textsIndexed = true; indexTimer = null; render(); }, 1400);
};

const actions = {
  go: (el) => go(el.dataset.href),
  "tab-top": () => { const c = screen.querySelector(".content"); if (c) c.scrollTo({ top: 0, behavior: "smooth" }); },
  "clear-query": () => { state.query = ""; render(); const i = screen.querySelector('[data-model="query"]'); if (i) i.focus(); },
  scope: (el) => { state.scope = el.dataset.v; render(); },
  sheet: (el) => { state.sheet = el.dataset.v; pendingAutofocus = true; render(); },
  "close-sheet": () => { state.sheet = null; render(); },
  "index-tab": (el) => { state.indexTab = el.dataset.v; render(); },
  "index-to-jump": () => {
    state.sheet = null; render();
    const i = screen.querySelector('[data-model="page"]');
    if (i) { i.scrollIntoView({ block: "center", behavior: "smooth" }); i.focus({ preventScroll: true }); }
  },
  jump: () => { const p = parsePage(state.page); if (p) go(`/quran?page=${p}`); },
  step: (el) => { const cur = parsePage(state.page) || (state.hasLastRead ? LAST_READ.page : 1); state.page = fmt(Math.min(PAGE_COUNT, Math.max(1, cur + Number(el.dataset.v)))); render(); },
  segment: (el) => { state.segment = el.dataset.v; render(); },
  "toggle-search": () => { state.searchOpen = !state.searchOpen; if (!state.searchOpen) state.query = ""; pendingAutofocus = state.searchOpen; render(); },
  "toggle-book": (el) => { state.openBooks[el.dataset.v] = !state.openBooks[el.dataset.v]; render(); },
  "media-cat": (el) => { state.mediaCat = el.dataset.v; render(); },
  suggest: (el) => { state.query = el.dataset.v; startIndexing(); render(); },
};

screen.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  if (el.tagName === "LABEL") return;
  actions[el.dataset.act]?.(el);
});
screen.addEventListener("input", (e) => {
  const el = e.target;
  const model = el.dataset.model;
  if (!model || e.isComposing) return;
  if (model === "slider") { state.page = fmt(el.value); }
  else state[model] = el.value;
  if (model === "query" && el.value.trim()) startIndexing();
  render();
});
screen.addEventListener("compositionend", (e) => { const m = e.target.dataset.model; if (m) { state[m] = e.target.value; render(); } });
screen.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.dataset.enter === "jump") { e.preventDefault(); actions.jump(); }
  if (e.key === "Escape") {
    if (state.sheet) { state.sheet = null; render(); }
    else if (state.searchOpen) { actions["toggle-search"](); }
  }
});

/* ---------------------------------------------------------------------------
 * Switcher + State panel (outside the phone)
 * ------------------------------------------------------------------------- */
const cycle = (d) => { const i = VARIANTS.indexOf(state.variant); state.variant = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length]; state.searchOpen = false; state.sheet = null; state.query = ""; syncURL(); render(); };
document.getElementById("sw-prev").onclick = () => cycle(-1);
document.getElementById("sw-next").onclick = () => cycle(1);
document.getElementById("sw-theme").onclick = () => { state.theme = state.theme === "dark" ? "light" : "dark"; syncURL(); render(); };
document.getElementById("sw-lang").onclick = () => { state.lang = state.lang === "ar" ? "en" : "ar"; state.page = ""; syncURL(); render(); };
document.addEventListener("keydown", (e) => {
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.isContentEditable)) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); cycle(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); cycle(1); }
});

const INVENTORY = [
  ["Library search (Surahs · Supplications · Library materials, sectioned, notes for indexing / “showing n of m”, no-results line)", { A: "Permanent field under the title; scope chips with counts while searching", B: "Nav-bar search button reveals field; results replace the sections", C: "Nav-bar search opens a full-screen layer with suggestion chips" }],
  ["Continue reading (last-read surah · ayah · page, resume; empty → start at Al-Fatihah)", { A: "Dark hero card with page progress", B: "Compact resume row atop the Quran section", C: "Full-width bento tile with the page numeral" }],
  ["Quran: open mushaf at page 1 + description", { A: "Primary tile in the Quran strip", B: "Button under resume row; description at pane end", C: "Square bento tile; description under bento" }],
  ["Quran: Surah & Juz index (current juz marked; jump-to-page from index)", { A: "Bottom sheet from the strip", B: "Inline list in the Quran section (Surahs/Juz toggle)", C: "Bottom sheet from a bento tile" }],
  ["Quran: go to page (1–604, Arabic or Western digits, live surah/juz preview, invalid message, Enter opens)", { A: "Inline field row in the Quran strip", B: "Inline card above the index", C: "Inline scrubber tile: slider + stepper + field" }],
  ["Quran: search (surah names, ayah words, 2:255 refs, hint, no-results)", { A: "Bottom sheet", B: "Bottom sheet", C: "Bottom sheet" }],
  ["Favorites (newest first, kind label, empty guidance)", { A: "Inset list section", B: "Favorites segment with count badge", C: "Horizontal shelf of cards" }],
  ["Books (Mafatih · Sahifa · Nahj, sections as description)", { A: "Inset list section", B: "Books segment: expandable books → sections → texts", C: "Horizontal shelf of covers" }],
  ["Lessons link (completed n of m, description, browse)", { A: "Row with progress ring", B: "Lessons segment: summary + per-category rows", C: "Banner tile with ring" }],
  ["Library materials by shelf (category, kind, author, empty)", { A: "Grouped lists per category", B: "Media segment with category chips", C: "One horizontal shelf per category" }],
];
const renderChrome = () => {
  document.getElementById("sw-label").innerHTML = `<b>${state.variant}</b> · ${VARIANT_NAMES[state.variant]}`;
  document.getElementById("sw-theme").textContent = state.theme === "dark" ? "☀ Light" : "☾ Dark";
  document.getElementById("sw-lang").textContent = state.lang === "ar" ? "EN" : "عربي";
  const hint = pageHint();
  const panel = document.getElementById("state");
  const wasOpen = panel.querySelector("details") ? panel.querySelector("details").open : true;
  const tg = (key, on, labelOn, labelOff) => `<button data-toggle="${key}" aria-pressed="${on}">${on ? labelOn : labelOff}</button>`;
  panel.innerHTML = `<details ${wasOpen ? "open" : ""}><summary>State · ${state.variant} ${VARIANT_NAMES[state.variant]}</summary>
    <h4>URL</h4><dl><dt>variant</dt><dd>${state.variant}</dd><dt>lang</dt><dd>${state.lang} (${state.lang === "ar" ? "rtl" : "ltr"})</dd><dt>theme</dt><dd>${state.theme}</dd></dl>
    <h4>UI state</h4><dl>
      <dt>query</dt><dd>${esc(JSON.stringify(state.query))}${state.variant === "A" && state.query ? ` · scope=${state.scope}` : ""}</dd>
      <dt>search open</dt><dd>${state.variant === "A" ? "always" : state.searchOpen}</dd>
      <dt>sheet</dt><dd>${state.sheet || "none"}${state.sheet === "index" ? ` (${state.indexTab})` : ""}${state.sheet === "qsearch" ? ` q=${esc(JSON.stringify(state.qquery))}` : ""}</dd>
      <dt>page field</dt><dd>${esc(JSON.stringify(state.page))} → ${hint.page ? `valid p.${hint.page}` : state.page.trim() ? "invalid" : "empty"}</dd>
      ${state.variant === "B" ? `<dt>segment</dt><dd>${state.segment}${state.segment === "media" ? ` · ${state.mediaCat}` : ""}</dd><dt>index tab</dt><dd>${state.indexTab}</dd>` : ""}
      <dt>last nav</dt><dd>${state.toast ? esc(state.toast.href) : "—"}</dd>
    </dl>
    <h4>Data states</h4><div class="toggles">
      ${tg("hasLastRead", state.hasLastRead, "Last read: Al-Kahf 46", "Last read: none")}
      ${tg("hasFavorites", state.hasFavorites, "Favorites: 5", "Favorites: empty")}
      ${tg("hasAssets", state.hasAssets, "Materials: 9", "Materials: none")}
      ${tg("textsIndexed", state.textsIndexed, "Dua texts: indexed", "Dua texts: indexing")}
    </div>
    <h4>Inventory → where it lives in ${state.variant}</h4><ul>${INVENTORY.map(([what, where]) => `<li><b>${what}</b><br><span style="opacity:.75">${where[state.variant]}</span></li>`).join("")}</ul>
    <h4>Proposed new copy</h4><ul>${PROPOSED_KEYS.map((k) => `<li><code>${k}</code>: <span class="copy">${esc(lookup(S.ar, k))}</span> / ${esc(lookup(S.en, k))}</li>`).join("")}</ul>
    <h4>Try</h4><ul><li>Search “كهف”, “كميل”, “عاشوراء”, “منهاج”, “36”; after indexing, “الصباح” matches passage text.</li><li>Page field accepts ٢٩٩ or 299; 700 shows the error.</li><li>Quran search: “نور”, or 2:255.</li></ul>
  </details>`;
  panel.querySelector("details").addEventListener("toggle", () => {});
  panel.querySelectorAll("[data-toggle]").forEach((b) => b.onclick = () => { const k = b.dataset.toggle; state[k] = !state[k]; if (k === "textsIndexed") { clearTimeout(indexTimer); indexTimer = null; } render(); });
};

syncURL();
render();
</script>
</body>
</html>
