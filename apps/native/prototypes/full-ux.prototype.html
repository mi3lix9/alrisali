          `<button class="nb-btn" data-a="openSheet" data-x="tasbihNew" data-y="${p.id}" aria-label="${L("تعديل", "Edit")}">${ic("edit")}</button>`,
        render: (p) => {
          const i = S.user.tasbih.open.findIndex((t) => t.id === p.id),
            t = S.user.tasbih.open[i];
          if (!t) return empty("beads", L("غير موجود", "Not found"), "");
          const reached = t.target && t.count >= t.target;
          return `<div class="center strong mb2" style="font-family:var(--font-text);font-size:var(--t-lg)">${esc(t.name)}</div>
      <div class="ring" id="open-ring">${ringSVG(t.target ? t.count / t.target : (t.count % 100) / 100)}<button class="ring-in" data-a="openTap" data-x="${t.id}" aria-label="${L("سبّح", "Count")}"><span class="ring-count">${N(t.count)}</span><span class="xs muted">${t.target ? "/ " + N(t.target) : L("بلا هدف", "no target")}</span></button></div>
      ${reached ? `<div class="alert success mt4">${ic("check")}<div>${L("بلغت هدفك. احفظ الجلسة أو تابع.", "Target reached. Save the session or keep going.")}</div></div>` : ""}
      <div class="grid2 mt4"><button class="btn primary" data-a="openSave" data-x="${t.id}" ${t.count ? "" : "disabled"}>${ic("check")}${L("احفظ الجلسة", "Save session")}</button><button class="btn outline" data-a="openReset" data-x="${t.id}" ${t.count ? "" : "disabled"}>${ic("refresh")}${L("تصفير", "Reset")}</button></div>
      <div class="field mt4"><label class="label" for="tn-${t.id}">${L("النية والملاحظات", "Intention & notes")}</label><textarea id="tn-${t.id}" class="textarea" data-m="user.tasbih.open.${i}.notes" placeholder="${L("مثال: لشفاء والدتي", "e.g. for my mother's recovery")}">${esc(t.notes)}</textarea></div>
      <button class="btn ghost block mt3" data-a="openDelete" data-x="${t.id}" style="color:var(--color-destructive-foreground)">${ic("trash")}${L("حذف التسبيح", "Delete Tasbih")}</button>`;
        },
      };

      /* ── Insights (Analytics) ── */
      function insightsBody() {
        const t = todayISO(),
          days = S.view.insightsRange === "month" ? 30 : 7;
        const range = Array.from({ length: days }, (_, i) =>
          addDays(t, i - days + 1)
        );
        const salahCount = (d) => SALAH.filter((k) => logOf(d)[k]).length;
        const kh = Object.entries(S.user.khushu)
          .filter(([k]) => range.includes(k.split("|")[0]))
          .map(([, v]) => v);
        const avgK = kh.length
          ? (kh.reduce((n, v) => n + v.level, 0) / kh.length).toFixed(1)
          : "—";
        const hs = S.user.habits.filter((h) => !h.archived);
        let sched = 0,
          done = 0;
        for (const d of range)
          for (const h of hs)
            if (habitScheduled(h, d)) {
              sched++;
              if (S.user.habitLogs[d + "|" + h.id]) done++;
            }
        const pages = range.reduce(
          (n, d) => n + (S.user.quran.pagesRead[d] || 0),
          0
        );
        const week = range.slice(-7);
        const heat = Array.from({ length: 84 }, (_, i) => addDays(t, i - 83));
        const dist = {};
        for (const v of Object.values(S.user.khushu))
          for (const x of v.distractions) dist[x] = (dist[x] || 0) + 1;
        const distMax = Math.max(1, ...Object.values(dist));
        const moods = {};
        for (const m of S.user.moods) moods[m.mood] = (moods[m.mood] || 0) + 1;
        const moodTotal = Math.max(1, S.user.moods.length);
        const tz = {};
        for (const s of S.user.dhikrSessions)
          tz[s.name] = (tz[s.name] || 0) + s.count;
        const streak = prayerStreak(t);
        const colors = [
          "--color-chart-1",
          "--color-chart-2",
          "--color-chart-3",
          "--color-chart-4",
          "--color-chart-5",
        ];
        const prevWeek = Array.from({ length: 7 }, (_, i) =>
            addDays(t, i - 13)
          ).reduce((n, d) => n + salahCount(d), 0),
          thisWeek = week.reduce((n, d) => n + salahCount(d), 0);
        const change = prevWeek
          ? Math.round(((thisWeek - prevWeek) / prevWeek) * 100)
          : 0;
        return `${seg(
          [
            ["week", L("أسبوع", "Week")],
            ["month", L("شهر", "Month")],
          ],
          S.view.insightsRange,
          "insightsRange"
        )}
    ${streak >= 7 ? `<div class="alert success mt3">${ic("flame")}<div><div class="a-title">${L(`${N(streak)} أيام متتالية!`, `${streak} days in a row!`)}</div>${tone("logged")}</div></div>` : ""}
    <div class="grid2 mt3">
      <div class="card pad stat"><div class="s-v">${N(avgK)}</div><div class="s-k">${L("متوسط الخشوع /١٠", "Average Khushu /10")}</div></div>
      <div class="card pad stat"><div class="s-v">${N(sched ? Math.round((done / sched) * 100) : 0)}%</div><div class="s-k">${L("إنجاز العادات", "Habit completion")}</div></div>
      <div class="card pad stat"><div class="s-v">${N(streak)}</div><div class="s-k">${L("سلسلة الصلاة", "Prayer Streak")}</div></div>
      <div class="card pad stat"><div class="s-v">${N(pages)}</div><div class="s-k">${L("صفحات قرآن", "Quran Pages read")}</div></div>
    </div>
    ${section(L("الصلوات هذا الأسبوع", "Salah this week"), `<span class="sec-act" style="color:${change >= 0 ? "var(--color-success-foreground)" : "var(--color-destructive-foreground)"}">${change >= 0 ? "+" : ""}${N(change)}%</span>`)}
    <div class="card pad"><div class="bars">${week.map((d) => `<div class="bar ${d === t ? "today" : ""}"><span class="num">${N(salahCount(d))}</span><i style="height:${(salahCount(d) / 5) * 90}%"></i>${L(WD_SHORT_AR, WD_SHORT_EN)[weekday(d)]}</div>`).join("")}</div></div>
    ${section(L("خريطة الالتزام — ١٢ أسبوعًا", "Consistency — 12 weeks"))}
    <div class="card pad"><div class="heat">${heat
      .map((d) => {
        const n = salahCount(d);
        return `<i class="${n >= 5 ? "l3" : n >= 3 ? "l2" : n >= 1 ? "l1" : ""}" title="${d}: ${n}/5"></i>`;
      })
      .join(
        ""
      )}</div><div class="hstack xs muted mt2"><span>${L("أقل", "Less")}</span><span class="spacer"></span><span>${L("أكثر", "More")}</span></div></div>
    ${section(L("سلاسل العادات", "Habit streaks"))}
    ${group(hs.map((h) => row({ icon: "flame", title: esc(habitName(h)), sub: freqLabel(h), end: `<span class="strong num">${N(habitStreak(h))}</span>` })))}
    ${section(L("مجموع التسبيح", "Tasbih totals"))}
    <div class="card pad">${
      Object.entries(tz)
        .map(
          ([k, v], i) =>
            `<div class="hbar"><span class="hb-l" style="width:140px;font-family:var(--font-text)">${esc(k)}</span><span class="hb-t"><i style="width:${(v / Math.max(...Object.values(tz))) * 100}%;background:var(${colors[(i + 1) % 5]})"></i></span><span class="hb-v">${N(v)}</span></div>`
        )
        .join("") ||
      `<span class="small muted">${L("لا جلسات بعد", "No sessions yet")}</span>`
    }</div>
    ${section(L("توزيع المزاج", "Mood distribution"))}
    <div class="card pad">${MOODS.map((m, i) => `<div class="hbar"><span class="hb-l">${LL(m.name)}</span><span class="hb-t"><i style="width:${((moods[m.k] || 0) / moodTotal) * 100}%;background:var(${colors[i]})"></i></span><span class="hb-v">${N(Math.round(((moods[m.k] || 0) / moodTotal) * 100))}%</span></div>`).join("")}</div>
    ${section(L("المشتتات", "Distractions"))}
    <div class="card pad">${
      Object.keys(dist).length
        ? Object.entries(dist)
            .sort((a, b) => b[1] - a[1])
            .map(
              ([k, v]) =>
                `<div class="hbar"><span class="hb-l">${esc(LL(DISTRACTIONS.find((d) => d[0] === k) || [k, k]))}</span><span class="hb-t"><i style="width:${(v / distMax) * 100}%;background:var(--color-chart-4)"></i></span><span class="hb-v">${N(v)}</span></div>`
            )
            .join("")
        : `<span class="small muted">${L("قيّم خشوعك بعد الصلاة لترى ما يشتتك.", "Rate Khushu after a Salah to see what distracts you.")}</span>`
    }</div>`;
      }
      SCREENS.insights = {
        title: () => L("الإحصائيات", "Insights"),

          S.auth.signedIn

    <div class="gate-cta"><span style="width:56px;height:56px;border-radius:16px;background:var(--color-card);box-shadow:var(--shadow-lg);display:grid;place-items:center">${ic("lock")}</span><div class="strong" style="font-size:var(--t-lg)">${L("الإحصائيات للمسجّلين", "Insights need an account")}</div><div class="small muted" style="max-width:260px">${L("سجّل الدخول لترى سلاسلك وخشوعك ومزاجك عبر الأسابيع، محفوظة ومتزامنة.", "Sign in to see your streaks, Khushu and mood across weeks — saved and synced.")}</div><button class="btn primary" data-a="openSheet" data-x="signin">${L("تسجيل الدخول", "Sign in")}</button></div></div>`,
      };

      /* ── Companion ── */
      SCREENS.companion = {
        title: () => L("المرافق", "Companion"),
        render: () => {
          const xp = S.user.companion.xp,
            lv = level(),
            th = S.settings.companionTheme,

            inLv = xp % XP_PER_LEVEL;
          return `${seg(
            [
              ["garden", L("الحديقة", "Garden")],
              ["traveler", L("المسافر", "Traveler")],
            ],
            th,
            "compTheme"
          )}
      <div class="comp-art mt3">${companionArt(st)}</div>
      <div class="card pad mt3"><div class="hstack"><div class="spacer"><div class="xs muted">${L("المستوى", "Level")} ${N(lv)}</div><div class="strong" style="font-size:var(--t-lg)">${LL(COMP_STAGES[st])}</div></div><span class="strong num">${N(xp)} XP</span></div>
        <div class="mt3">${progress(inLv)}</div><div class="xs muted mt2">${N(XP_PER_LEVEL - inLv)} ${L("نقطة للمستوى التالي", "XP to next level")}</div></div>
      <div class="alert mt3">${ic("sparkle")}<div>${LL(COMP_TIPS[st])}</div></div>
      ${section(L("كيف تكسب النقاط", "How to earn XP"))}
      ${group([
        row({
          icon: "clock",
          title: L("تسجيل صلاة", "Log a Salah"),
          end: `+${N(XP_RULES.salah)}`,
          a: "tab",
          x: "prayer",
        }),
        row({
          icon: "hands",
          title: L("إنجاز عمل من برنامج", "Complete an Act"),
          end: `+${N(XP_RULES.act)}`,
          a: "tab",
          x: "worship",
        }),
        row({
          icon: "beads",
          title: L("إكمال جلسة ذكر", "Finish a Dhikr Session"),
          end: `+${N(XP_RULES.dhikr)}`,
          a: "tab",
          x: "tasbih",
        }),
        row({
          icon: "book",
          title: L("إكمال قراءة دعاء", "Complete a reading"),
          end: `+${N(XP_RULES.reading)}`,
          a: "tab",
          x: "library",
        }),
        row({
          icon: "graduation",
          title: L("إنهاء درس", "Finish a Lesson"),
          end: `+${N(XP_RULES.lesson)}`,
          a: "go",
          x: "learn",
        }),
      ])}
      ${section(L("المراحل", "Stages"))}
      <div class="chips">${(th === "garden" ? ["seedling", "sprout", "bloom", "tree", "garden"] : ["seeker", "wayfarer", "pilgrim", "guidingLight", "travellingSpirit"]).map((k) => `<span class="chip ${k === st ? "on" : ""}">${LL(COMP_STAGES[k])}</span>`).join("")}</div>`;
        },
      };

      /* ── Learn ── */
      const lessonProgress = (l) => {
        const pr = S.user.lessons[l.id];
        return pr
          ? pr.done
            ? 100
            : ((pr.last + 1) / l.slides.length) * 100
          : 0;
      };
      SCREENS.learn = {
        title: () => L("تعلّم", "Learn"),
        render: () => {
          const c = S.view.lessonCat,
            list = LESSONS.filter((l) => c === "all" || l.cat === c);
          return `<div class="chips scroll mb3">${[["all", L("الكل", "All")], ...Object.entries(LESSON_CATS).map(([k, v]) => [k, LL(v)])].map(([k, l]) => `<button class="chip ${c === k ? "on" : ""}" data-a="lessonCat" data-x="${k}">${l}</button>`).join("")}</div>
      ${
        list.length
          ? `<div class="stack">${list
              .map((l) => {
                const pct = lessonProgress(l),
                  pr = S.user.lessons[l.id];
                return `<button class="card pad" style="width:100%;text-align:start;display:block" data-a="go" data-x="lesson" data-y="${l.id}"><div class="hstack" style="gap:var(--s3)"><span style="width:48px;height:48px;border-radius:12px;background:color-mix(in srgb, var(${l.tint}) 18%, transparent);color:var(${l.tint});display:grid;place-items:center;flex:none">${ic(l.icon)}</span><span class="spacer"><div class="xs muted">${LL(LESSON_CATS[l.cat])} · ${N(l.slides.length)} ${L("شرائح", "Slides")}</div><div class="strong">${LL(l.title)}</div></span>${pr?.done ? badge(ic("check"), "success") : ""}</div><div class="hstack mt3">${progress(pct, pct >= 100 ? "success" : "")}<span class="xs muted num" style="width:40px;text-align:end">${N(Math.round(pct))}%</span></div></button>`;
              })
              .join("")}</div>`
          : empty(
              "graduation",
              L("لا دروس في هذا التصنيف", "No Lessons in this category"),
              L(
                "سيضيف فريق الرسالي دروسًا قريبًا.",

            name: f.name.trim(),
            target,
            notes: f.notes,
          });
        else
          S.user.tasbih.open.push({
            id: uid("t"),
            name: f.name.trim(),
            target,
            count: 0,
            notes: f.notes,
          });
        closeSheet();
        toast(
          "success",
          f.id
            ? L("حُفظ التسبيح", "Tasbih saved")
            : L("أُنشئ التسبيح", "Tasbih created"),
          f.name.trim()
        );
      };
      A.exportFmt = (f) => {
        S.view.exportFmt = f;
      };
      A.exportCopy = () => {
        try {
          navigator.clipboard &&
            navigator.clipboard
              .writeText(exportData(S.view.exportFmt || "csv"))
              .catch(() => {});
        } catch {
          /* clipboard blocked on file:// */
        }
        toast("success", L("نُسخ إلى الحافظة", "Copied to clipboard"));
      };
      A.exportShare = () => {
        closeSheet();
        toast(
          "info",
          L(
            "ستفتح ورقة المشاركة في النظام",
            "The system share sheet would open"
          ),
          "alrisali-dhikr." + (S.view.exportFmt || "csv")
        );
      };

      /* Insights, Companion, Learn */
      A.insightsRange = (v) => {
        S.view.insightsRange = v;
      };
      A.compTheme = (v) => {
        S.settings.companionTheme = v;
      };
      A.lessonCat = (v) => {
        S.view.lessonCat = v;
      };
      A.slideGo = (i) => {
        const r = topRoute(),
          l = LESSONS.find((x) => x.id === r.p.id),
          pr = S.user.lessons[l.id];
        pr.last = clamp(Number(i), 0, l.slides.length - 1);
        if (pr.last === l.slides.length - 1 && !pr.done) {
          pr.done = true;
          awardXP(XP_RULES.lesson, "lesson");
          toast(
            "success",
            L("أكملت الدرس", "Lesson complete"),
            "+" + XP_RULES.lesson + " XP"
          );
        }
      };
      A.lessonComplete = (id) => {
        const l = LESSONS.find((x) => x.id === id),
          pr = S.user.lessons[id];
        pr.done = true;
        pr.last = l.slides.length - 1;
        awardXP(XP_RULES.lesson, "lesson");
        toast(
          "success",
          L("أكملت الدرس", "Lesson complete"),
          "+" + XP_RULES.lesson + " XP"
        );
      };

      /* Home */
      A.mood = (k) => {
        const t = todayISO();
        S.user.moods = S.user.moods.filter((m) => m.date !== t);
        S.user.moods.unshift({ date: t, mood: k, remedy: remedyFor(k) });
        haptic(10);
      };
      A.homeCard = (i) => {
        S.view.homeCard = Number(i);
      };

      /* Settings, auth, notifications */
      A.timeFormat = (v) => {
        S.settings.timeFormat = v;
      };
      A.setLang = (v) => {
        S.ui.lang = v;
      };
      A.fontSize = (v) => {
        S.settings.fontSize = v;
      };
      A.messageStyle = (v) => {
        S.settings.messageStyle = v;
      };
      A.reminderMode = (k, m) => {
        S.settings.reminders[k].mode = m;
      };
      A.readAll = () => {
        S.user.announcementsRead = ANNOUNCEMENTS.map((a) => a.id);
      };
      A.tabToggle = (k) => {
        const s = S.form.tabs;
        if (s.includes(k)) S.form.tabs = s.filter((x) => x !== k);
        else if (s.length < 4) s.push(k);
        else
          toast(
            "error",
            L("٤ تبويبات فقط", "Only 4 tabs"),
            L("أزل تبويبًا أولًا", "Remove one first")
          );
      };
      A.tabsSave = () => {
        S.settings.tabs = ["home", ...S.form.tabs];
        if (!S.settings.tabs.includes(S.nav.tab)) {
          const cur = stack();
          S.nav.tab = "home";
          S.nav.stacks.home = [{ s: "home", p: {} }, ...cur.slice(1)];
        }
        closeSheet();
        toast("success", L("حُفظ الشريط السفلي", "Tab bar saved"));
      };
      A.signIn = (provider) => {
        S.auth = {
          signedIn: true,
          provider,
          name: ["عبدالله", "Abdullah"],
          email:
            provider === "apple"
              ? "abdullah@privaterelay.appleid.com"
              : "abdullah@gmail.com",
        };
        closeSheet();
        const fromOnboarding = !S.ui.onboarded;
        if (fromOnboarding) A.obFinish();
        toast(
          "success",
          L("تم تسجيل الدخول", "Signed in"),
          L(
            "أُنشئت قاعدة بياناتك ورُفعت إليها سجلات الضيف",
            "Your database was created and Guest records pushed to it"
          )
        );
      };
      A.signOut = () =>
        confirmDialog({
          title: L("تسجيل الخروج؟", "Sign out?"),
          text: L(
            "سيُمسح كل ما على هذا الجهاز. تبقى بياناتك محفوظة في حسابك وتعود عند الدخول مجددًا.",
            "Everything on this device will be wiped. Your data stays in your account and returns when you sign in again."
          ),
          ok: L("خروج ومسح", "Sign out & wipe"),
          danger: true,
          a: "doWipe",
          x: "signout",
        });
      A.deleteAccount = () =>
        confirmDialog({
          title: L("حذف الحساب نهائيًا؟", "Delete account permanently?"),
          text: L(
            "ستُدمَّر قاعدة بياناتك على الخادم ولا يمكن استعادتها.",
            "Your database on the server is destroyed and cannot be recovered."
          ),
          ok: L("احذف حسابي", "Delete my account"),
          danger: true,
          a: "doWipe",
          x: "delete",
        });
      A.doWipe = (why) => {
        S.auth = { signedIn: false, provider: null, name: null, email: null };
        S.user = seedUser(false);
        S.form = {};
        for (const k in NAV_TABS)
          S.nav.stacks[k] = [{ s: NAV_TABS[k].root, p: {} }];
        S.nav.tab = "home";
        toast(
          "info",
          why === "delete"
            ? L("حُذف حسابك", "Account deleted")
            : L("سجّلت الخروج", "Signed out"),
          L("مُسحت البيانات من هذا الجهاز", "This device was wiped")
        );
      };
      A.contactSend = () => {
        const f = S.form.contact,
          e = {};
        if (f.name.trim().length < 2 || f.name.trim().length > 100)
          e.name = L("الاسم بين ٢ و١٠٠ حرف", "Name must be 2–100 characters");
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim()))
          e.email = L("أدخل بريدًا صحيحًا", "Enter a valid email");
        if (f.subject.trim().length < 3 || f.subject.trim().length > 120)
          e.subject = L(
            "الموضوع بين ٣ و١٢٠ حرفًا",
            "Subject must be 3–120 characters"
          );
        if (f.message.trim().length < 10 || f.message.trim().length > 3000)
          e.message = L(
            "الرسالة بين ١٠ و٣٠٠٠ حرف",
            "Message must be 10–3000 characters"
          );
        f.errors = e;
        if (Object.keys(e).length) {
          toast("error", L("تحقق من الحقول", "Check the highlighted fields"));
          return;
        }
        S.user.contactSent.unshift({
          subject: f.subject.trim(),
          date: todayISO(),
        });
        S.form.contact = {
          name: f.name,
          email: f.email,
          subject: "",
          message: "",
          errors: {},
        };
        toast(
          "success",
          L("وصلت رسالتك", "Message sent"),
          L(
            "سيرد عليك فريق الرسالي عبر البريد",
            "The Al-Risali team will reply by email"
          )
        );
      };

      /* Onboarding */
      A.obNext = () => {
        S.ui.onboardStep = Math.min(4, S.ui.onboardStep + 1);
        RT.navDir = "push";
      };
      A.obBack = () => {
        S.ui.onboardStep = Math.max(0, S.ui.onboardStep - 1);
        RT.navDir = "pop";
      };
      A.obGps = () => A.gps();
      A.obMethod = (k) => {
        S.settings.method = k;
      };
      A.obStyle = (k) => {
        S.settings.messageStyle = k;
      };
      A.obFinish = () => {
        S.ui.onboarded = true;
        S.ui.onboardStep = 0;
        S.nav.tab = "home";
        S.nav.stacks.home = [{ s: "home", p: {} }];
        RT.navDir = "tab";
      };

      /* ── Model binding (data-m) ── */
      function setPath(path, value) {
        if (path.startsWith("pause:")) {
          const s = S.user.subscriptions.find((x) => x.id === path.slice(6));
          s.paused = value;
          toast(
            "info",
            value
              ? L("أُوقف الاشتراك مؤقتًا", "Subscription paused")
              : L("استُؤنف الاشتراك", "Subscription resumed")
          );
          return;
        }
        if (path === "ui.dark") {
          S.ui.theme = value ? "dark" : "light";
          return;
        }
        const keys = path.split(".");
        let o = S;
        for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
        o[keys[keys.length - 1]] = value;
      }
      function readValue(el) {
        if (el.type === "checkbox") return el.checked;
        if (el.dataset.t === "num") return Number(el.value);
        return el.value;
      }
      document.addEventListener("input", (e) => {
        const el = e.target.closest("[data-m]");
        if (!el || el.type === "checkbox") return;
        setPath(el.dataset.m, readValue(el));
        if (el.type === "range") {
          syncRange(el);
          if (el.dataset.out) {
            const o = document.getElementById(el.dataset.out);
            if (o) o.textContent = N(el.value) + (el.dataset.suffix || "");
          }
        }
        RT.lastAction = "input " + el.dataset.m;
        if (el.dataset.r === "input") render();
        else if (el.dataset.r === "live") {
          const r = topRoute();
          SCREENS[r.s].live && SCREENS[r.s].live(r.p);
          renderStatePanel();
        } else renderStatePanel();
      });
      document.addEventListener("change", (e) => {
        const el = e.target.closest("[data-m]");
        if (!el) return;
        setPath(el.dataset.m, readValue(el));
        RT.lastAction = "change " + el.dataset.m;
        if (el.dataset.r) render();
        else renderStatePanel();
      });
      document.addEventListener("click", (e) => {
        const pb = e.target.closest("[data-proto]");
        if (pb) {
          protoAction(pb.dataset.proto);
          return;
        }
        const el = e.target.closest("[data-a]");
        if (!el || el.disabled) return;
        const fn = A[el.dataset.a];
        if (!fn) {
          console.warn("missing action", el.dataset.a);
          return;
        }
        RT.lastAction =
          el.dataset.a +
          (el.dataset.x != null
            ? `(${el.dataset.x}${el.dataset.y != null ? ", " + el.dataset.y : ""})`
            : "");
        const r = fn(el.dataset.x, el.dataset.y, el, e);
        if (r !== false) render();
        else renderStatePanel();
      });
      document.addEventListener("pointerdown", (e) => {
        if (e.target.closest("[data-hold]")) {
          RT.holding = true;
          RT.reciteAt = 0;
          e.preventDefault();
        }
      });
      for (const ev of ["pointerup", "pointercancel"])
        document.addEventListener(ev, () => {
          RT.holding = false;
        });
      document.addEventListener("keydown", (e) => {
        const tag =
          (document.activeElement && document.activeElement.tagName) || "";
        if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
        const turn =
          (e.key === "ArrowLeft" || e.key === "ArrowRight") &&
          S.ui.onboarded &&
          !S.sheet &&
          !S.dialog &&
          topRoute().s === "quran" &&
          isCarousel() &&
          $(".q-carousel");
        if (turn) {
          scrollToPage(
            turn,
            clamp(
              S.user.quran.currentPage + (e.key === "ArrowLeft" ? 1 : -1),
              1,
              604
            ),
            true
          );
          RT.lastAction = "key " + e.key + " (mushaf: left = next page)";
          e.preventDefault();
          return;
        }
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          protoAction(e.key === "ArrowLeft" ? "prev" : "next");
          e.preventDefault();
        }
        if (e.key === "Escape" && (S.sheet || S.dialog)) {
          S.dialog = null;
          if (!S.dialog) closeSheet();
          RT.lastAction = "escape";
          render();
        }
      });
      function protoAction(k) {
        const order = ["A", "B", "C"],
          i = order.indexOf(S.ui.variant);
        if (k === "prev") setVariant(order[(i + 2) % 3]);
        else if (k === "next") setVariant(order[(i + 1) % 3]);
        else if (k === "lang") S.ui.lang = S.ui.lang === "ar" ? "en" : "ar";
        else if (k === "theme")
          S.ui.theme = S.ui.theme === "dark" ? "light" : "dark";
        else if (k === "auth") {
          if (S.auth.signedIn)
            S.auth = {
              signedIn: false,
              provider: null,
              name: null,
              email: null,
            };
          else
            S.auth = {
              signedIn: true,
              provider: "apple",
              name: ["عبدالله", "Abdullah"],
              email: "abdullah@privaterelay.appleid.com",
            };
        } else if (k === "onboard") {
          S.ui.onboarded = false;
          S.ui.onboardStep = 0;
          S.sheet = null;
          S.dialog = null;
        } else if (k === "state") S.ui.statePanel = !S.ui.statePanel;
        RT.lastAction = "proto:" + k;
        render();
      }

      /* ── Engine: simulated recognition, Recite-Along, audio mocks ── */
      const RECITE_MS = { slow: 1100, normal: 750, fast: 480 };
      let lastTick = 0;
      setInterval(() => {
        const now = performance.now();
        let dirty = false;
        const route = S.ui.onboarded ? topRoute() : null;
        const r = S.assistantRun;
        if (
          r &&
          route &&
          route.s === "assistantRun" &&
          !r.finished &&
          !S.dialog &&
          !S.sheet
        ) {
          const step = r.seq[r.i];
          if (step.final) {
            if (RT.holdStart == null) RT.holdStart = now;
            const left = Math.max(
              0,
              PACES[r.pace].finalHold - (now - RT.holdStart) / 1000
            );
            if (Math.ceil(left) !== Math.ceil(r.holdLeft ?? -1)) dirty = true;
            r.holdLeft = left;
            if (left <= 0) {
              assistFinish();
              RT.lastAction = "assistant: final Tashahhud held";
              dirty = true;
            }
          } else {
            RT.holdStart = null;
            const ms = step.middle
              ? S.settings.assistant.tashahhudMs
              : r.pace === "custom"
                ? S.settings.assistant.holdMs + 1000
                : PACES[r.pace].ms;
            if (r.auto && now - RT.stepAt >= ms) {
              r.i++;
              RT.stepAt = now;
              RT.lastAction = "assistant: recognised " + r.seq[r.i].p;
              haptic(10);
              dirty = true;
            }
          }
        }
        const v = S.view;
        if (route && route.s === "supp" && v.reciteOn) {
          const total = RT.reciteTotal || 0,
            mode = S.settings.recite.mode;
          const running = mode === "hold" ? RT.holding : v.reciteRunning;
          const ms =
            mode === "hold"
              ? 360
              : mode === "auto"
                ? RECITE_MS[S.settings.recite.pace]
                : 520 + Math.random() * 500;
          if (
            running &&
            v.reciteIdx < total &&
            now - (RT.reciteAt || 0) >= ms
          ) {
            v.reciteIdx++;
            RT.reciteAt = now;
            RT.lastAction = "recite: word " + v.reciteIdx;
            dirty = true;
          }
          if (v.reciteIdx >= total && total && !RT.reciteDoneToast) {
            RT.reciteDoneToast = true;
            v.reciteRunning = false;
            RT.holding = false;
            toast(
              "success",
              L("أتممت التلاوة", "Recitation finished"),
              L("سجّل إكمال القراءة بالأسفل", "Mark the reading complete below")
            );
            dirty = true;
          }
        }
        if (v.playing && now - (RT.playAt || 0) >= 1000) {
          RT.playAt = now;
          v.playPos++;
          if (v.playPos >= durOf(v.playing)) {
            stopPlay();
            dirty = true;
          } else if (route && route.s === "quran")
            patchQuranPlayer(); // keep the reader's scroll/drag untouched
          else dirty = true;
        }
        if (dirty) render();
        else if (now - lastTick > 1000) {
          lastTick = now;
          tick();
        }
      }, 100);

      /* ── Boot ── */
      (function boot() {
        const host = document.createElement("div");
        host.className = "toasts";
        host.id = "toasts";
        host.setAttribute("aria-live", "polite");
        $("#phone").appendChild(host);
        $("#sb-sys").innerHTML =
          `<svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>${ic("wifi").replace("<svg", '<svg width="17" height="17"')}<svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><rect x="25" y="4.5" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".4"/></svg>`;
        render();
      })();
    </script>
  </body>
</html>
