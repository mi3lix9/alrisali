          "فِي قُلُوبِهِم مَّرَضٞ فَزَادَهُمُ ٱللَّهُ مَرَضٗاۖ وَلَهُمۡ عَذَابٌ أَلِيمُۢ بِمَا كَانُواْ يَكۡذِبُونَ",
        "2:11":
          "وَإِذَا قِيلَ لَهُمۡ لَا تُفۡسِدُواْ فِي ٱلۡأَرۡضِ قَالُوٓاْ إِنَّمَا نَحۡنُ مُصۡلِحُونَ",
        "2:12":
          "أَلَآ إِنَّهُمۡ هُمُ ٱلۡمُفۡسِدُونَ وَلَٰكِن لَّا يَشۡعُرُونَ",
        "2:13":
          "وَإِذَا قِيلَ لَهُمۡ ءَامِنُواْ كَمَآ ءَامَنَ ٱلنَّاسُ قَالُوٓاْ أَنُؤۡمِنُ كَمَآ ءَامَنَ ٱلسُّفَهَآءُۗ أَلَآ إِنَّهُمۡ هُمُ ٱلسُّفَهَآءُ وَلَٰكِن لَّا يَعۡلَمُونَ",
        "2:14":
          "وَإِذَا لَقُواْ ٱلَّذِينَ ءَامَنُواْ قَالُوٓاْ ءَامَنَّا وَإِذَا خَلَوۡاْ إِلَىٰ شَيَٰطِينِهِمۡ قَالُوٓاْ إِنَّا مَعَكُمۡ إِنَّمَا نَحۡنُ مُسۡتَهۡزِءُونَ",
        "2:15":
          "ٱللَّهُ يَسۡتَهۡزِئُ بِهِمۡ وَيَمُدُّهُمۡ فِي طُغۡيَٰنِهِمۡ يَعۡمَهُونَ",
        "2:16":
          "أُوْلَٰٓئِكَ ٱلَّذِينَ ٱشۡتَرَوُاْ ٱلضَّلَٰلَةَ بِٱلۡهُدَىٰ فَمَا رَبِحَت تِّجَٰرَتُهُمۡ وَمَا كَانُواْ مُهۡتَدِينَ",
        "17:105":
          "وَبِٱلۡحَقِّ أَنزَلۡنَٰهُ وَبِٱلۡحَقِّ نَزَلَۗ وَمَآ أَرۡسَلۡنَٰكَ إِلَّا مُبَشِّرٗا وَنَذِيرٗا",
        "17:106":
          "وَقُرۡءَانٗا فَرَقۡنَٰهُ لِتَقۡرَأَهُۥ عَلَى ٱلنَّاسِ عَلَىٰ مُكۡثٖ وَنَزَّلۡنَٰهُ تَنزِيلٗا",
        "17:107":
          "قُلۡ ءَامِنُواْ بِهِۦٓ أَوۡ لَا تُؤۡمِنُوٓاْۚ إِنَّ ٱلَّذِينَ أُوتُواْ ٱلۡعِلۡمَ مِن قَبۡلِهِۦٓ إِذَا يُتۡلَىٰ عَلَيۡهِمۡ يَخِرُّونَۤ لِلۡأَذۡقَانِۤ سُجَّدٗاۤ",
        "17:108":
          "وَيَقُولُونَ سُبۡحَٰنَ رَبِّنَآ إِن كَانَ وَعۡدُ رَبِّنَا لَمَفۡعُولٗا",
        "17:109":
          "وَيَخِرُّونَ لِلۡأَذۡقَانِ يَبۡكُونَ وَيَزِيدُهُمۡ خُشُوعٗا۩",
        "17:110":
          "قُلِ ٱدۡعُواْ ٱللَّهَ أَوِ ٱدۡعُواْ ٱلرَّحۡمَٰنَۖ أَيّٗا مَّا تَدۡعُواْ فَلَهُ ٱلۡأَسۡمَآءُ ٱلۡحُسۡنَىٰۚ وَلَا تَجۡهَرۡ بِصَلَاتِكَ وَلَا تُخَافِتۡ بِهَا وَٱبۡتَغِ بَيۡنَ ذَٰلِكَ سَبِيلٗا",
        "17:111":
          "وَقُلِ ٱلۡحَمۡدُ لِلَّهِ ٱلَّذِي لَمۡ يَتَّخِذۡ وَلَدٗا وَلَمۡ يَكُن لَّهُۥ شَرِيكٞ فِي ٱلۡمُلۡكِ وَلَمۡ يَكُن لَّهُۥ وَلِيّٞ مِّنَ ٱلذُّلِّۖ وَكَبِّرۡهُ تَكۡبِيرَۢا",
        "18:1":
          "ٱلۡحَمۡدُ لِلَّهِ ٱلَّذِيٓ أَنزَلَ عَلَىٰ عَبۡدِهِ ٱلۡكِتَٰبَ وَلَمۡ يَجۡعَل لَّهُۥ عِوَجَاۜ",
        "18:2":
          "قَيِّمٗا لِّيُنذِرَ بَأۡسٗا شَدِيدٗا مِّن لَّدُنۡهُ وَيُبَشِّرَ ٱلۡمُؤۡمِنِينَ ٱلَّذِينَ يَعۡمَلُونَ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمۡ أَجۡرًا حَسَنٗا",
        "18:3": "مَّٰكِثِينَ فِيهِ أَبَدٗا",
        "18:4": "وَيُنذِرَ ٱلَّذِينَ قَالُواْ ٱتَّخَذَ ٱللَّهُ وَلَدٗا",
        "78:1": "عَمَّ يَتَسَآءَلُونَ",
        "78:2": "عَنِ ٱلنَّبَإِ ٱلۡعَظِيمِ",
        "78:3": "ٱلَّذِي هُمۡ فِيهِ مُخۡتَلِفُونَ",
        "78:4": "كـَلَّا سَيَعۡلَمُونَ",
        "78:5": "ثُمَّ كـَلَّا سَيَعۡلَمُونَ",
        "78:6": "أَلَمۡ نَجۡعَلِ ٱلۡأَرۡضَ مِهَٰدٗا",
        "78:7": "وَٱلۡجِبَالَ أَوۡتَادٗا",
        "78:8": "وَخَلَقۡنَٰكُمۡ أَزۡوَٰجٗا",
        "78:9": "وَجَعَلۡنَا نَوۡمَكُمۡ سُبَاتٗا",
        "78:10": "وَجَعَلۡنَا ٱلَّيۡلَ لِبَاسٗا",
        "78:11": "وَجَعَلۡنَا ٱلنَّهَارَ مَعَاشٗا",
        "78:12": "وَبَنَيۡنَا فَوۡقَكُمۡ سَبۡعٗا شِدَادٗا",
        "78:13": "وَجَعَلۡنَا سِرَاجٗا وَهَّاجٗا",
        "78:14": "وَأَنزَلۡنَا مِنَ ٱلۡمُعۡصِرَٰتِ مَآءٗ ثَجَّاجٗا",
        "78:15": "لِّنُخۡرِجَ بِهِۦ حَبّٗا وَنَبَاتٗا",
        "78:16": "وَجَنَّٰتٍ أَلۡفَافًا",
        "78:17": "إِنَّ يَوۡمَ ٱلۡفَصۡلِ كَانَ مِيقَٰتٗا",
        "78:18": "يَوۡمَ يُنفَخُ فِي ٱلصُّورِ فَتَأۡتُونَ أَفۡوَاجٗا",
        "78:19": "وَفُتِحَتِ ٱلسَّمَآءُ فَكَانَتۡ أَبۡوَٰبٗا",
        "78:20": "وَسُيِّرَتِ ٱلۡجِبَالُ فَكَانَتۡ سَرَابًا",
        "78:21": "إِنَّ جَهَنَّمَ كَانَتۡ مِرۡصَادٗا",
        "78:22": "لِّلطَّٰغِينَ مَـَٔابٗا",
        "78:23": "لَّٰبِثِينَ فِيهَآ أَحۡقَابٗا",
        "78:24": "لَّا يَذُوقُونَ فِيهَا بَرۡدٗا وَلَا شَرَابًا",
        "78:25": "إِلَّا حَمِيمٗا وَغَسَّاقٗا",
        "78:26": "جَزَآءٗ وِفَاقًا",
        "78:27": "إِنَّهُمۡ كَانُواْ لَا يَرۡجُونَ حِسَابٗا",
        "78:28": "وَكَذَّبُواْ بِـَٔايَٰتِنَا كِذَّابٗا",
        "78:29": "وَكُلَّ شَيۡءٍ أَحۡصَيۡنَٰهُ كِتَٰبٗا",
        "78:30": "فَذُوقُواْ فَلَن نَّزِيدَكُمۡ إِلَّا عَذَابًا",
        "78:31": "إِنَّ لِلۡمُتَّقِينَ مَفَازًا",
        "78:32": "حَدَآئِقَ وَأَعۡنَٰبٗا",
        "78:33": "وَكَوَاعِبَ أَتۡرَابٗا",
        "78:34": "وَكَأۡسٗا دِهَاقٗا",
        "78:35": "لَّا يَسۡمَعُونَ فِيهَا لَغۡوٗا وَلَا كِذَّٰبٗا",
        "78:36": "جَزَآءٗ مِّن رَّبِّكَ عَطَآءً حِسَابٗا",
        "78:37":
          "رَّبِّ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ وَمَا بَيۡنَهُمَا ٱلرَّحۡمَٰنِۖ لَا يَمۡلِكُونَ مِنۡهُ خِطَابٗا",
        "78:38":
          "يَوۡمَ يَقُومُ ٱلرُّوحُ وَٱلۡمَلَٰٓئِكَةُ صَفّٗاۖ لَّا يَتَكَلَّمُونَ إِلَّا مَنۡ أَذِنَ لَهُ ٱلرَّحۡمَٰنُ وَقَالَ صَوَابٗا",
        "78:39":
          "ذَٰلِكَ ٱلۡيَوۡمُ ٱلۡحَقُّۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ مَـَٔابًا",
        "78:40":
          "إِنَّآ أَنذَرۡنَٰكُمۡ عَذَابٗا قَرِيبٗا يَوۡمَ يَنظُرُ ٱلۡمَرۡءُ مَا قَدَّمَتۡ يَدَاهُ وَيَقُولُ ٱلۡكَافِرُ يَٰلَيۡتَنِي كُنتُ تُرَٰبَۢا",
        "79:1": "وَٱلنَّٰزِعَٰتِ غَرۡقٗا",
        "79:2": "وَٱلنَّٰشِطَٰتِ نَشۡطٗا",
        "79:3": "وَٱلسَّٰبِحَٰتِ سَبۡحٗا",
        "79:4": "فَٱلسَّٰبِقَٰتِ سَبۡقٗا",
        "79:5": "فَٱلۡمُدَبِّرَٰتِ أَمۡرٗا",
        "79:6": "يَوۡمَ تَرۡجُفُ ٱلرَّاجِفَةُ",
        "79:7": "تَتۡبَعُهَا ٱلرَّادِفَةُ",
        "79:8": "قُلُوبٞ يَوۡمَئِذٖ وَاجِفَةٌ",
        "79:9": "أَبۡصَٰرُهَا خَٰشِعَةٞ",
        "79:10": "يَقُولُونَ أَءِنَّا لَمَرۡدُودُونَ فِي ٱلۡحَافِرَةِ",
        "79:11": "أَءِذَا كُنَّا عِظَٰمٗا نَّخِرَةٗ",
        "79:12": "قَالُواْ تِلۡكَ إِذٗا كَرَّةٌ خَاسِرَةٞ",
        "79:13": "فَإِنَّمَا هِيَ زَجۡرَةٞ وَٰحِدَةٞ",
        "79:14": "فَإِذَا هُم بِٱلسَّاهِرَةِ",
        "79:15": "هَلۡ أَتَىٰكَ حَدِيثُ مُوسَىٰٓ",
        "79:16": "إِذۡ نَادَىٰهُ رَبُّهُۥ بِٱلۡوَادِ ٱلۡمُقَدَّسِ طُوًى",
        "79:17": "ٱذۡهَبۡ إِلَىٰ فِرۡعَوۡنَ إِنَّهُۥ طَغَىٰ",
        "79:18": "فَقُلۡ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ",
        "79:19": "وَأَهۡدِيَكَ إِلَىٰ رَبِّكَ فَتَخۡشَىٰ",
        "79:20": "فَأَرَىٰهُ ٱلۡأٓيَةَ ٱلۡكُبۡرَىٰ",
        "79:21": "فَكَذَّبَ وَعَصَىٰ",
        "79:22": "ثُمَّ أَدۡبَرَ يَسۡعَىٰ",
        "79:23": "فَحَشَرَ فَنَادَىٰ",
        "79:24": "فَقَالَ أَنَا۠ رَبُّكُمُ ٱلۡأَعۡلَىٰ",
        "79:25": "فَأَخَذَهُ ٱللَّهُ نَكَالَ ٱلۡأٓخِرَةِ وَٱلۡأُولَىٰٓ",
        "79:26": "إِنَّ فِي ذَٰلِكَ لَعِبۡرَةٗ لِّمَن يَخۡشَىٰٓ",
        "79:27": "ءَأَنتُمۡ أَشَدُّ خَلۡقًا أَمِ ٱلسَّمَآءُۚ بَنَىٰهَا",
        "79:28": "رَفَعَ سَمۡكَهَا فَسَوَّىٰهَا",
        "79:29": "وَأَغۡطَشَ لَيۡلَهَا وَأَخۡرَجَ ضُحَىٰهَا",
        "79:30": "وَٱلۡأَرۡضَ بَعۡدَ ذَٰلِكَ دَحَىٰهَآ",
        "79:31": "أَخۡرَجَ مِنۡهَا مَآءَهَا وَمَرۡعَىٰهَا",
        "79:32": "وَٱلۡجِبَالَ أَرۡسَىٰهَا",
        "79:33": "مَتَٰعٗا لَّكُمۡ وَلِأَنۡعَٰمِكُمۡ",
        "79:34": "فَإِذَا جَآءَتِ ٱلطَّآمَّةُ ٱلۡكُبۡرَىٰ",
        "79:35": "يَوۡمَ يَتَذَكَّرُ ٱلۡإِنسَٰنُ مَا سَعَىٰ",
        "79:36": "وَبُرِّزَتِ ٱلۡجَحِيمُ لِمَن يَرَىٰ",
        "79:37": "فَأَمَّا مَن طَغَىٰ",
        "79:38": "وَءَاثَرَ ٱلۡحَيَوٰةَ ٱلدُّنۡيَا",
        "79:39": "فَإِنَّ ٱلۡجَحِيمَ هِيَ ٱلۡمَأۡوَىٰ",
        "79:40":
          "وَأَمَّا مَنۡ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفۡسَ عَنِ ٱلۡهَوَىٰ",
        "79:41": "فَإِنَّ ٱلۡجَنَّةَ هِيَ ٱلۡمَأۡوَىٰ",
        "79:42": "يَسۡـَٔلُونَكَ عَنِ ٱلسَّاعَةِ أَيَّانَ مُرۡسَىٰهَا",
        "79:43": "فِيمَ أَنتَ مِن ذِكۡرَىٰهَآ",
        "79:44": "إِلَىٰ رَبِّكَ مُنتَهَىٰهَآ",
        "79:45": "إِنَّمَآ أَنتَ مُنذِرُ مَن يَخۡشَىٰهَا",
        "79:46":
          "كَأَنَّهُمۡ يَوۡمَ يَرَوۡنَهَا لَمۡ يَلۡبَثُوٓاْ إِلَّا عَشِيَّةً أَوۡ ضُحَىٰهَا",
        "80:1": "عَبَسَ وَتَوَلَّىٰٓ",
        "80:2": "أَن جَآءَهُ ٱلۡأَعۡمَىٰ",
        "80:3": "وَمَا يُدۡرِيكَ لَعَلَّهُۥ يَزَّكَّىٰٓ",
        "80:4": "أَوۡ يَذَّكَّرُ فَتَنفَعَهُ ٱلذِّكۡرَىٰٓ",
        "80:5": "أَمَّا مَنِ ٱسۡتَغۡنَىٰ",
        "80:6": "فَأَنتَ لَهُۥ تَصَدَّىٰ",
        "80:7": "وَمَا عَلَيۡكَ أَلَّا يَزَّكَّىٰ",
        "80:8": "وَأَمَّا مَن جَآءَكَ يَسۡعَىٰ",
        "80:9": "وَهُوَ يَخۡشَىٰ",
        "80:10": "فَأَنتَ عَنۡهُ تَلَهَّىٰ",
        "80:11": "كـَلَّآ إِنَّهَا تَذۡكِرَةٞ",
        "80:12": "فَمَن شَآءَ ذَكَرَهُۥ",
        "80:13": "فِي صُحُفٖ مُّكَرَّمَةٖ",
        "80:14": "مَّرۡفُوعَةٖ مُّطَهَّرَةِۭ",
        "80:15": "بِأَيۡدِي سَفَرَةٖ",
        "80:16": "كِرَامِۭ بَرَرَةٖ",
        "80:17": "قُتِلَ ٱلۡإِنسَٰنُ مَآ أَكۡفَرَهُۥ",
        "80:18": "مِنۡ أَيِّ شَيۡءٍ خَلَقَهُۥ",
        "80:19": "مِن نُّطۡفَةٍ خَلَقَهُۥ فَقَدَّرَهُۥ",
        "80:20": "ثُمَّ ٱلسَّبِيلَ يَسَّرَهُۥ",
        "80:21": "ثُمَّ أَمَاتَهُۥ فَأَقۡبَرَهُۥ",
        "80:22": "ثُمَّ إِذَا شَآءَ أَنشَرَهُۥ",
        "80:23": "كـَلَّا لَمَّا يَقۡضِ مَآ أَمَرَهُۥ",
        "80:24": "فَلۡيَنظُرِ ٱلۡإِنسَٰنُ إِلَىٰ طَعَامِهِۦٓ",
        "80:25": "أَنَّا صَبَبۡنَا ٱلۡمَآءَ صَبّٗا",
        "80:26": "ثُمَّ شَقَقۡنَا ٱلۡأَرۡضَ شَقّٗا",
        "80:27": "فَأَنۢبَتۡنَا فِيهَا حَبّٗا",
        "80:28": "وَعِنَبٗا وَقَضۡبٗا",
        "80:29": "وَزَيۡتُونٗا وَنَخۡلٗا",
        "80:30": "وَحَدَآئِقَ غُلۡبٗا",
        "80:31": "وَفَٰكِهَةٗ وَأَبّٗا",
        "80:32": "مَّتَٰعٗا لَّكُمۡ وَلِأَنۡعَٰمِكُمۡ",
        "80:33": "فَإِذَا جَآءَتِ ٱلصَّآخَّةُ",
        "80:34": "يَوۡمَ يَفِرُّ ٱلۡمَرۡءُ مِنۡ أَخِيهِ",
        "80:35": "وَأُمِّهِۦ وَأَبِيهِ",
        "80:36": "وَصَٰحِبَتِهِۦ وَبَنِيهِ",
        "80:37": "لِكُلِّ ٱمۡرِيٕٖ مِّنۡهُمۡ يَوۡمَئِذٖ شَأۡنٞ يُغۡنِيهِ",
        "80:38": "وُجُوهٞ يَوۡمَئِذٖ مُّسۡفِرَةٞ",
        "80:39": "ضَاحِكَةٞ مُّسۡتَبۡشِرَةٞ",
        "80:40": "وَوُجُوهٞ يَوۡمَئِذٍ عَلَيۡهَا غَبَرَةٞ",
        "80:41": "تَرۡهَقُهَا قَتَرَةٌ",
        "80:42": "أُوْلَٰٓئِكَ هُمُ ٱلۡكَفَرَةُ ٱلۡفَجَرَةُ",
        "81:1": "إِذَا ٱلشَّمۡسُ كُوِّرَتۡ",
        "81:2": "وَإِذَا ٱلنُّجُومُ ٱنكَدَرَتۡ",
        "81:3": "وَإِذَا ٱلۡجِبَالُ سُيِّرَتۡ",
        "81:4": "وَإِذَا ٱلۡعِشَارُ عُطِّلَتۡ",
        "81:5": "وَإِذَا ٱلۡوُحُوشُ حُشِرَتۡ",
        "81:6": "وَإِذَا ٱلۡبِحَارُ سُجِّرَتۡ",
        "81:7": "وَإِذَا ٱلنُّفُوسُ زُوِّجَتۡ",
        "81:8": "وَإِذَا ٱلۡمَوۡءُۥدَةُ سُئِلَتۡ",
        "81:9": "بِأَيِّ ذَنۢبٖ قُتِلَتۡ",
        "81:10": "وَإِذَا ٱلصُّحُفُ نُشِرَتۡ",
        "81:11": "وَإِذَا ٱلسَّمَآءُ كُشِطَتۡ",
        "81:12": "وَإِذَا ٱلۡجَحِيمُ سُعِّرَتۡ",
        "81:13": "وَإِذَا ٱلۡجَنَّةُ أُزۡلِفَتۡ",
        "81:14": "عَلِمَتۡ نَفۡسٞ مَّآ أَحۡضَرَتۡ",
        "81:15": "فَلَآ أُقۡسِمُ بِٱلۡخُنَّسِ",
        "81:16": "ٱلۡجَوَارِ ٱلۡكُنَّسِ",
        "81:17": "وَٱلَّيۡلِ إِذَا عَسۡعَسَ",
        "81:18": "وَٱلصُّبۡحِ إِذَا تَنَفَّسَ",
        "81:19": "إِنَّهُۥ لَقَوۡلُ رَسُولٖ كَرِيمٖ",
        "81:20": "ذِي قُوَّةٍ عِندَ ذِي ٱلۡعَرۡشِ مَكِينٖ",
        "81:21": "مُّطَاعٖ ثَمَّ أَمِينٖ",
        "81:22": "وَمَا صَاحِبُكُم بِمَجۡنُونٖ",
        "81:23": "وَلَقَدۡ رَءَاهُ بِٱلۡأُفُقِ ٱلۡمُبِينِ",
        "81:24": "وَمَا هُوَ عَلَى ٱلۡغَيۡبِ بِضَنِينٖ",
        "81:25": "وَمَا هُوَ بِقَوۡلِ شَيۡطَٰنٖ رَّجِيمٖ",
        "81:26": "فَأَيۡنَ تَذۡهَبُونَ",
        "81:27": "إِنۡ هُوَ إِلَّا ذِكۡرٞ لِّلۡعَٰلَمِينَ",
        "81:28": "لِمَن شَآءَ مِنكُمۡ أَن يَسۡتَقِيمَ",
        "81:29":
          "وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّ ٱلۡعَٰلَمِينَ",
        "82:1": "إِذَا ٱلسَّمَآءُ ٱنفَطَرَتۡ",
        "82:2": "وَإِذَا ٱلۡكَوَاكِبُ ٱنتَثَرَتۡ",
        "82:3": "وَإِذَا ٱلۡبِحَارُ فُجِّرَتۡ",
        "82:4": "وَإِذَا ٱلۡقُبُورُ بُعۡثِرَتۡ",
        "82:5": "عَلِمَتۡ نَفۡسٞ مَّا قَدَّمَتۡ وَأَخَّرَتۡ",
        "82:6": "يَٰٓأَيُّهَا ٱلۡإِنسَٰنُ مَا غَرَّكَ بِرَبِّكَ ٱلۡكَرِيمِ",
        "82:7": "ٱلَّذِي خَلَقَكَ فَسَوَّىٰكَ فَعَدَلَكَ",
        "82:8": "فِيٓ أَيِّ صُورَةٖ مَّا شَآءَ رَكَّبَكَ",
        "82:9": "كـَلَّا بَلۡ تُكَذِّبُونَ بِٱلدِّينِ",
        "82:10": "وَإِنَّ عَلَيۡكُمۡ لَحَٰفِظِينَ",
        "82:11": "كِرَامٗا كَٰتِبِينَ",
        "82:12": "يَعۡلَمُونَ مَا تَفۡعَلُونَ",
        "82:13": "إِنَّ ٱلۡأَبۡرَارَ لَفِي نَعِيمٖ",
        "82:14": "وَإِنَّ ٱلۡفُجَّارَ لَفِي جَحِيمٖ",
        "82:15": "يَصۡلَوۡنَهَا يَوۡمَ ٱلدِّينِ",
        "82:16": "وَمَا هُمۡ عَنۡهَا بِغَآئِبِينَ",
        "82:17": "وَمَآ أَدۡرَىٰكَ مَا يَوۡمُ ٱلدِّينِ",
        "82:18": "ثُمَّ مَآ أَدۡرَىٰكَ مَا يَوۡمُ ٱلدِّينِ",
        "82:19":
          "يَوۡمَ لَا تَمۡلِكُ نَفۡسٞ لِّنَفۡسٖ شَيۡـٔٗاۖ وَٱلۡأَمۡرُ يَوۡمَئِذٖ لِّلَّهِ",
        "83:1": "وَيۡلٞ لِّلۡمُطَفِّفِينَ",
        "83:2": "ٱلَّذِينَ إِذَا ٱكۡتَالُواْ عَلَى ٱلنَّاسِ يَسۡتَوۡفُونَ",
        "83:3": "وَإِذَا كَالُوهُمۡ أَو وَّزَنُوهُمۡ يُخۡسِرُونَ",
        "83:4": "أَلَا يَظُنُّ أُوْلَٰٓئِكَ أَنَّهُم مَّبۡعُوثُونَ",
        "83:5": "لِيَوۡمٍ عَظِيمٖ",
        "83:6": "يَوۡمَ يَقُومُ ٱلنَّاسُ لِرَبِّ ٱلۡعَٰلَمِينَ",
        "83:7": "كـَلَّآ إِنَّ كِتَٰبَ ٱلۡفُجَّارِ لَفِي سِجِّينٖ",
        "83:8": "وَمَآ أَدۡرَىٰكَ مَا سِجِّينٞ",
        "83:9": "كِتَٰبٞ مَّرۡقُومٞ",
        "83:10": "وَيۡلٞ يَوۡمَئِذٖ لِّلۡمُكَذِّبِينَ",
        "83:11": "ٱلَّذِينَ يُكَذِّبُونَ بِيَوۡمِ ٱلدِّينِ",
        "83:12": "وَمَا يُكَذِّبُ بِهِۦٓ إِلَّا كُلُّ مُعۡتَدٍ أَثِيمٍ",
        "83:13":
          "إِذَا تُتۡلَىٰ عَلَيۡهِ ءَايَٰتُنَا قَالَ أَسَٰطِيرُ ٱلۡأَوَّلِينَ",
        "83:14":
          "كـَلَّاۖ بَلۡۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُواْ يَكۡسِبُونَ",
        "83:15": "كـَلَّآ إِنَّهُمۡ عَن رَّبِّهِمۡ يَوۡمَئِذٖ لَّمَحۡجُوبُونَ",
        "83:16": "ثُمَّ إِنَّهُمۡ لَصَالُواْ ٱلۡجَحِيمِ",
        "83:17": "ثُمَّ يُقَالُ هَٰذَا ٱلَّذِي كُنتُم بِهِۦ تُكَذِّبُونَ",
        "83:18": "كـَلَّآ إِنَّ كِتَٰبَ ٱلۡأَبۡرَارِ لَفِي عِلِّيِّينَ",
        "83:19": "وَمَآ أَدۡرَىٰكَ مَا عِلِّيُّونَ",
        "83:20": "كِتَٰبٞ مَّرۡقُومٞ",
        "83:21": "يَشۡهَدُهُ ٱلۡمُقَرَّبُونَ",
        "83:22": "إِنَّ ٱلۡأَبۡرَارَ لَفِي نَعِيمٍ",
        "83:23": "عَلَى ٱلۡأَرَآئِكِ يَنظُرُونَ",
        "83:24": "تَعۡرِفُ فِي وُجُوهِهِمۡ نَضۡرَةَ ٱلنَّعِيمِ",
        "83:25": "يُسۡقَوۡنَ مِن رَّحِيقٖ مَّخۡتُومٍ",
        "83:26":
          "خِتَٰمُهُۥ مِسۡكٞۚ وَفِي ذَٰلِكَ فَلۡيَتَنَافَسِ ٱلۡمُتَنَٰفِسُونَ",
        "83:27": "وَمِزَاجُهُۥ مِن تَسۡنِيمٍ",
        "83:28": "عَيۡنٗا يَشۡرَبُ بِهَا ٱلۡمُقَرَّبُونَ",
        "83:29":
          "إِنَّ ٱلَّذِينَ أَجۡرَمُواْ كَانُواْ مِنَ ٱلَّذِينَ ءَامَنُواْ يَضۡحَكُونَ",
        "83:30": "وَإِذَا مَرُّواْ بِهِمۡ يَتَغَامَزُونَ",
        "83:31":
          "وَإِذَا ٱنقَلَبُوٓاْ إِلَىٰٓ أَهۡلِهِمُ ٱنقَلَبُواْ فَكِهِينَ",
        "83:32": "وَإِذَا رَأَوۡهُمۡ قَالُوٓاْ إِنَّ هَٰٓؤُلَآءِ لَضَآلُّونَ",
        "83:33": "وَمَآ أُرۡسِلُواْ عَلَيۡهِمۡ حَٰفِظِينَ",
        "83:34":
          "فَٱلۡيَوۡمَ ٱلَّذِينَ ءَامَنُواْ مِنَ ٱلۡكُفَّارِ يَضۡحَكُونَ",
        "83:35": "عَلَى ٱلۡأَرَآئِكِ يَنظُرُونَ",
        "83:36": "هَلۡ ثُوِّبَ ٱلۡكُفَّارُ مَا كَانُواْ يَفۡعَلُونَ",
        "84:1": "إِذَا ٱلسَّمَآءُ ٱنشَقَّتۡ",
        "84:2": "وَأَذِنَتۡ لِرَبِّهَا وَحُقَّتۡ",
        "84:3": "وَإِذَا ٱلۡأَرۡضُ مُدَّتۡ",
        "84:4": "وَأَلۡقَتۡ مَا فِيهَا وَتَخَلَّتۡ",
        "84:5": "وَأَذِنَتۡ لِرَبِّهَا وَحُقَّتۡ",
        "84:6":
          "يَٰٓأَيُّهَا ٱلۡإِنسَٰنُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدۡحٗا فَمُلَٰقِيهِ",
        "84:7": "فَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ بِيَمِينِهِۦ",
        "84:8": "فَسَوۡفَ يُحَاسَبُ حِسَابٗا يَسِيرٗا",
        "84:9": "وَيَنقَلِبُ إِلَىٰٓ أَهۡلِهِۦ مَسۡرُورٗا",
        "84:10": "وَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ وَرَآءَ ظَهۡرِهِۦ",
        "84:11": "فَسَوۡفَ يَدۡعُواْ ثُبُورٗا",
        "84:12": "وَيَصۡلَىٰ سَعِيرًا",
        "84:13": "إِنَّهُۥ كَانَ فِيٓ أَهۡلِهِۦ مَسۡرُورًا",
        "84:14": "إِنَّهُۥ ظَنَّ أَن لَّن يَحُورَ",
        "84:15": "بَلَىٰٓۚ إِنَّ رَبَّهُۥ كَانَ بِهِۦ بَصِيرٗا",
        "84:16": "فَلَآ أُقۡسِمُ بِٱلشَّفَقِ",
        "84:17": "وَٱلَّيۡلِ وَمَا وَسَقَ",
        "84:18": "وَٱلۡقَمَرِ إِذَا ٱتَّسَقَ",
        "84:19": "لَتَرۡكَبُنَّ طَبَقًا عَن طَبَقٖ",
        "84:20": "فَمَا لَهُمۡ لَا يُؤۡمِنُونَ",
        "84:21": "وَإِذَا قُرِئَ عَلَيۡهِمُ ٱلۡقُرۡءَانُ لَا يَسۡجُدُونَۤ۩",
        "84:22": "بَلِ ٱلَّذِينَ كَفَرُواْ يُكَذِّبُونَ",
        "84:23": "وَٱللَّهُ أَعۡلَمُ بِمَا يُوعُونَ",
        "84:24": "فَبَشِّرۡهُم بِعَذَابٍ أَلِيمٍ",
        "84:25":
          "إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ لَهُمۡ أَجۡرٌ غَيۡرُ مَمۡنُونِۭ",
        "85:1": "وَٱلسَّمَآءِ ذَاتِ ٱلۡبُرُوجِ",
        "85:2": "وَٱلۡيَوۡمِ ٱلۡمَوۡعُودِ",
        "85:3": "وَشَاهِدٖ وَمَشۡهُودٖ",
        "85:4": "قُتِلَ أَصۡحَٰبُ ٱلۡأُخۡدُودِ",
        "85:5": "ٱلنَّارِ ذَاتِ ٱلۡوَقُودِ",
        "85:6": "إِذۡ هُمۡ عَلَيۡهَا قُعُودٞ",
        "85:7": "وَهُمۡ عَلَىٰ مَا يَفۡعَلُونَ بِٱلۡمُؤۡمِنِينَ شُهُودٞ",
        "85:8":
          "وَمَا نَقَمُواْ مِنۡهُمۡ إِلَّآ أَن يُؤۡمِنُواْ بِٱللَّهِ ٱلۡعَزِيزِ ٱلۡحَمِيدِ",
        "85:9":
          "ٱلَّذِي لَهُۥ مُلۡكُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِۚ وَٱللَّهُ عَلَىٰ كُلِّ شَيۡءٖ شَهِيدٌ",
        "85:10":
          "إِنَّ ٱلَّذِينَ فَتَنُواْ ٱلۡمُؤۡمِنِينَ وَٱلۡمُؤۡمِنَٰتِ ثُمَّ لَمۡ يَتُوبُواْ فَلَهُمۡ عَذَابُ جَهَنَّمَ وَلَهُمۡ عَذَابُ ٱلۡحَرِيقِ",
        "85:11":
          "إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ لَهُمۡ جَنَّٰتٞ تَجۡرِي مِن تَحۡتِهَا ٱلۡأَنۡهَٰرُۚ ذَٰلِكَ ٱلۡفَوۡزُ ٱلۡكَبِيرُ",
        "85:12": "إِنَّ بَطۡشَ رَبِّكَ لَشَدِيدٌ",
        "85:13": "إِنَّهُۥ هُوَ يُبۡدِئُ وَيُعِيدُ",
        "85:14": "وَهُوَ ٱلۡغَفُورُ ٱلۡوَدُودُ",
        "85:15": "ذُو ٱلۡعَرۡشِ ٱلۡمَجِيدُ",
        "85:16": "فَعَّالٞ لِّمَا يُرِيدُ",
        "85:17": "هَلۡ أَتَىٰكَ حَدِيثُ ٱلۡجُنُودِ",
        "85:18": "فِرۡعَوۡنَ وَثَمُودَ",
        "85:19": "بَلِ ٱلَّذِينَ كَفَرُواْ فِي تَكۡذِيبٖ",
        "85:20": "وَٱللَّهُ مِن وَرَآئِهِم مُّحِيطُۢ",
        "85:21": "بَلۡ هُوَ قُرۡءَانٞ مَّجِيدٞ",
        "85:22": "فِي لَوۡحٖ مَّحۡفُوظِۭ",
        "86:1": "وَٱلسَّمَآءِ وَٱلطَّارِقِ",
        "86:2": "وَمَآ أَدۡرَىٰكَ مَا ٱلطَّارِقُ",
        "86:3": "ٱلنَّجۡمُ ٱلثَّاقِبُ",
        "86:4": "إِن كُلُّ نَفۡسٖ لَّمَّا عَلَيۡهَا حَافِظٞ",
        "86:5": "فَلۡيَنظُرِ ٱلۡإِنسَٰنُ مِمَّ خُلِقَ",
        "86:6": "خُلِقَ مِن مَّآءٖ دَافِقٖ",
        "86:7": "يَخۡرُجُ مِنۢ بَيۡنِ ٱلصُّلۡبِ وَٱلتَّرَآئِبِ",
        "86:8": "إِنَّهُۥ عَلَىٰ رَجۡعِهِۦ لَقَادِرٞ",
        "86:9": "يَوۡمَ تُبۡلَى ٱلسَّرَآئِرُ",
        "86:10": "فَمَا لَهُۥ مِن قُوَّةٖ وَلَا نَاصِرٖ",
        "86:11": "وَٱلسَّمَآءِ ذَاتِ ٱلرَّجۡعِ",
        "86:12": "وَٱلۡأَرۡضِ ذَاتِ ٱلصَّدۡعِ",
        "86:13": "إِنَّهُۥ لَقَوۡلٞ فَصۡلٞ",
        "86:14": "وَمَا هُوَ بِٱلۡهَزۡلِ",
        "86:15": "إِنَّهُمۡ يَكِيدُونَ كَيۡدٗا",
        "86:16": "وَأَكِيدُ كَيۡدٗا",
        "86:17": "فَمَهِّلِ ٱلۡكَٰفِرِينَ أَمۡهِلۡهُمۡ رُوَيۡدَۢا",
        "87:1": "سَبِّحِ ٱسۡمَ رَبِّكَ ٱلۡأَعۡلَى",
        "87:2": "ٱلَّذِي خَلَقَ فَسَوَّىٰ",
        "87:3": "وَٱلَّذِي قَدَّرَ فَهَدَىٰ",
        "87:4": "وَٱلَّذِيٓ أَخۡرَجَ ٱلۡمَرۡعَىٰ",
        "87:5": "فَجَعَلَهُۥ غُثَآءً أَحۡوَىٰ",
        "87:6": "سَنُقۡرِئُكَ فَلَا تَنسَىٰٓ",
        "87:7":
          "إِلَّا مَا شَآءَ ٱللَّهُۚ إِنَّهُۥ يَعۡلَمُ ٱلۡجَهۡرَ وَمَا يَخۡفَىٰ",
        "87:8": "وَنُيَسِّرُكَ لِلۡيُسۡرَىٰ",
        "87:9": "فَذَكِّرۡ إِن نَّفَعَتِ ٱلذِّكۡرَىٰ",
        "87:10": "سَيَذَّكَّرُ مَن يَخۡشَىٰ",
        "87:11": "وَيَتَجَنَّبُهَا ٱلۡأَشۡقَى",
        "87:12": "ٱلَّذِي يَصۡلَى ٱلنَّارَ ٱلۡكُبۡرَىٰ",
        "87:13": "ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحۡيَىٰ",
        "87:14": "قَدۡ أَفۡلَحَ مَن تَزَكَّىٰ",
        "87:15": "وَذَكَرَ ٱسۡمَ رَبِّهِۦ فَصَلَّىٰ",
        "87:16": "بَلۡ تُؤۡثِرُونَ ٱلۡحَيَوٰةَ ٱلدُّنۡيَا",
        "87:17": "وَٱلۡأٓخِرَةُ خَيۡرٞ وَأَبۡقَىٰٓ",
        "87:18": "إِنَّ هَٰذَا لَفِي ٱلصُّحُفِ ٱلۡأُولَىٰ",
        "87:19": "صُحُفِ إِبۡرَٰهِيمَ وَمُوسَىٰ",
        "88:1": "هَلۡ أَتَىٰكَ حَدِيثُ ٱلۡغَٰشِيَةِ",
        "88:2": "وُجُوهٞ يَوۡمَئِذٍ خَٰشِعَةٌ",
        "88:3": "عَامِلَةٞ نَّاصِبَةٞ",
        "88:4": "تَصۡلَىٰ نَارًا حَامِيَةٗ",
        "88:5": "تُسۡقَىٰ مِنۡ عَيۡنٍ ءَانِيَةٖ",
        "88:6": "لَّيۡسَ لَهُمۡ طَعَامٌ إِلَّا مِن ضَرِيعٖ",
        "88:7": "لَّا يُسۡمِنُ وَلَا يُغۡنِي مِن جُوعٖ",
        "88:8": "وُجُوهٞ يَوۡمَئِذٖ نَّاعِمَةٞ",
        "88:9": "لِّسَعۡيِهَا رَاضِيَةٞ",
        "88:10": "فِي جَنَّةٍ عَالِيَةٖ",
        "88:11": "لَّا تَسۡمَعُ فِيهَا لَٰغِيَةٗ",
        "88:12": "فِيهَا عَيۡنٞ جَارِيَةٞ",
        "88:13": "فِيهَا سُرُرٞ مَّرۡفُوعَةٞ",
        "88:14": "وَأَكۡوَابٞ مَّوۡضُوعَةٞ",
        "88:15": "وَنَمَارِقُ مَصۡفُوفَةٞ",
        "88:16": "وَزَرَابِيُّ مَبۡثُوثَةٌ",
        "88:17": "أَفَلَا يَنظُرُونَ إِلَى ٱلۡإِبِلِ كَيۡفَ خُلِقَتۡ",
        "88:18": "وَإِلَى ٱلسَّمَآءِ كَيۡفَ رُفِعَتۡ",
        "88:19": "وَإِلَى ٱلۡجِبَالِ كَيۡفَ نُصِبَتۡ",
        "88:20": "وَإِلَى ٱلۡأَرۡضِ كَيۡفَ سُطِحَتۡ",
        "88:21": "فَذَكِّرۡ إِنَّمَآ أَنتَ مُذَكِّرٞ",
        "88:22": "لَّسۡتَ عَلَيۡهِم بِمُصَيۡطِرٍ",
        "88:23": "إِلَّا مَن تَوَلَّىٰ وَكَفَرَ",
        "88:24": "فَيُعَذِّبُهُ ٱللَّهُ ٱلۡعَذَابَ ٱلۡأَكۡبَرَ",
        "88:25": "إِنَّ إِلَيۡنَآ إِيَابَهُمۡ",
        "88:26": "ثُمَّ إِنَّ عَلَيۡنَا حِسَابَهُم",
        "89:1": "وَٱلۡفَجۡرِ",
        "89:2": "وَلَيَالٍ عَشۡرٖ",
        "89:3": "وَٱلشَّفۡعِ وَٱلۡوَتۡرِ",
        "89:4": "وَٱلَّيۡلِ إِذَا يَسۡرِ",
        "89:5": "هَلۡ فِي ذَٰلِكَ قَسَمٞ لِّذِي حِجۡرٍ",
        "89:6": "أَلَمۡ تَرَ كَيۡفَ فَعَلَ رَبُّكَ بِعَادٍ",
        "89:7": "إِرَمَ ذَاتِ ٱلۡعِمَادِ",
        "89:8": "ٱلَّتِي لَمۡ يُخۡلَقۡ مِثۡلُهَا فِي ٱلۡبِلَٰدِ",
        "89:9": "وَثَمُودَ ٱلَّذِينَ جَابُواْ ٱلصَّخۡرَ بِٱلۡوَادِ",
        "89:10": "وَفِرۡعَوۡنَ ذِي ٱلۡأَوۡتَادِ",
        "89:11": "ٱلَّذِينَ طَغَوۡاْ فِي ٱلۡبِلَٰدِ",
        "89:12": "فَأَكۡثَرُواْ فِيهَا ٱلۡفَسَادَ",
        "89:13": "فَصَبَّ عَلَيۡهِمۡ رَبُّكَ سَوۡطَ عَذَابٍ",
        "89:14": "إِنَّ رَبَّكَ لَبِٱلۡمِرۡصَادِ",
        "89:15":
          "فَأَمَّا ٱلۡإِنسَٰنُ إِذَا مَا ٱبۡتَلَىٰهُ رَبُّهُۥ فَأَكۡرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّيٓ أَكۡرَمَنِ",
        "89:16":
          "وَأَمَّآ إِذَا مَا ٱبۡتَلَىٰهُ فَقَدَرَ عَلَيۡهِ رِزۡقَهُۥ فَيَقُولُ رَبِّيٓ أَهَٰنَنِ",
        "89:17": "كـَلَّاۖ بَل لَّا تُكۡرِمُونَ ٱلۡيَتِيمَ",
        "89:18": "وَلَا تَحَٰٓضُّونَ عَلَىٰ طَعَامِ ٱلۡمِسۡكِينِ",
        "89:19": "وَتَأۡكُلُونَ ٱلتُّرَاثَ أَكۡلٗا لَّمّٗا",
        "89:20": "وَتُحِبُّونَ ٱلۡمَالَ حُبّٗا جَمّٗا",
        "89:21": "كـَلَّآۖ إِذَا دُكَّتِ ٱلۡأَرۡضُ دَكّٗا دَكّٗا",
        "89:22": "وَجَآءَ رَبُّكَ وَٱلۡمَلَكُ صَفّٗا صَفّٗا",
        "89:23":
          "وَجِاْيٓءَ يَوۡمَئِذِۭ بِجَهَنَّمَۚ يَوۡمَئِذٖ يَتَذَكَّرُ ٱلۡإِنسَٰنُ وَأَنَّىٰ لَهُ ٱلذِّكۡرَىٰ",
        "89:24": "يَقُولُ يَٰلَيۡتَنِي قَدَّمۡتُ لِحَيَاتِي",
        "89:25": "فَيَوۡمَئِذٖ لَّا يُعَذِّبُ عَذَابَهُۥٓ أَحَدٞ",
        "89:26": "وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٞ",
        "89:27": "يَٰٓأَيَّتُهَا ٱلنَّفۡسُ ٱلۡمُطۡمَئِنَّةُ",
        "89:28": "ٱرۡجِعِيٓ إِلَىٰ رَبِّكِ رَاضِيَةٗ مَّرۡضِيَّةٗ",
        "89:29": "فَٱدۡخُلِي فِي عِبَٰدِي",
        "89:30": "وَٱدۡخُلِي جَنَّتِي",
        "90:1": "لَآ أُقۡسِمُ بِهَٰذَا ٱلۡبَلَدِ",
        "90:2": "وَأَنتَ حِلُّۢ بِهَٰذَا ٱلۡبَلَدِ",
        "90:3": "وَوَالِدٖ وَمَا وَلَدَ",
        "90:4": "لَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ فِي كَبَدٍ",
        "90:5": "أَيَحۡسَبُ أَن لَّن يَقۡدِرَ عَلَيۡهِ أَحَدٞ",
        "90:6": "يَقُولُ أَهۡلَكۡتُ مَالٗا لُّبَدًا",
        "90:7": "أَيَحۡسَبُ أَن لَّمۡ يَرَهُۥٓ أَحَدٌ",
        "90:8": "أَلَمۡ نَجۡعَل لَّهُۥ عَيۡنَيۡنِ",
        "90:9": "وَلِسَانٗا وَشَفَتَيۡنِ",
        "90:10": "وَهَدَيۡنَٰهُ ٱلنَّجۡدَيۡنِ",
        "90:11": "فَلَا ٱقۡتَحَمَ ٱلۡعَقَبَةَ",
        "90:12": "وَمَآ أَدۡرَىٰكَ مَا ٱلۡعَقَبَةُ",
        "90:13": "فَكُّ رَقَبَةٍ",
        "90:14": "أَوۡ إِطۡعَٰمٞ فِي يَوۡمٖ ذِي مَسۡغَبَةٖ",
        "90:15": "يَتِيمٗا ذَا مَقۡرَبَةٍ",
        "90:16": "أَوۡ مِسۡكِينٗا ذَا مَتۡرَبَةٖ",
        "90:17":
          "ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُواْ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ وَتَوَاصَوۡاْ بِٱلۡمَرۡحَمَةِ",
        "90:18": "أُوْلَٰٓئِكَ أَصۡحَٰبُ ٱلۡمَيۡمَنَةِ",
        "90:19":
          "وَٱلَّذِينَ كَفَرُواْ بِـَٔايَٰتِنَا هُمۡ أَصۡحَٰبُ ٱلۡمَشۡـَٔمَةِ",
        "90:20": "عَلَيۡهِمۡ نَارٞ مُّؤۡصَدَةُۢ",
        "91:1": "وَٱلشَّمۡسِ وَضُحَىٰهَا",
        "91:2": "وَٱلۡقَمَرِ إِذَا تَلَىٰهَا",
        "91:3": "وَٱلنَّهَارِ إِذَا جَلَّىٰهَا",
        "91:4": "وَٱلَّيۡلِ إِذَا يَغۡشَىٰهَا",
        "91:5": "وَٱلسَّمَآءِ وَمَا بَنَىٰهَا",
        "91:6": "وَٱلۡأَرۡضِ وَمَا طَحَىٰهَا",
        "91:7": "وَنَفۡسٖ وَمَا سَوَّىٰهَا",
        "91:8": "فَأَلۡهَمَهَا فُجُورَهَا وَتَقۡوَىٰهَا",
        "91:9": "قَدۡ أَفۡلَحَ مَن زَكَّىٰهَا",
        "91:10": "وَقَدۡ خَابَ مَن دَسَّىٰهَا",
        "91:11": "كَذَّبَتۡ ثَمُودُ بِطَغۡوَىٰهَآ",
        "91:12": "إِذِ ٱنۢبَعَثَ أَشۡقَىٰهَا",
        "91:13": "فَقَالَ لَهُمۡ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقۡيَٰهَا",
        "91:14":
          "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمۡدَمَ عَلَيۡهِمۡ رَبُّهُم بِذَنۢبِهِمۡ فَسَوَّىٰهَا",
        "91:15": "وَلَا يَخَافُ عُقۡبَٰهَا",
        "92:1": "وَٱلَّيۡلِ إِذَا يَغۡشَىٰ",
        "92:2": "وَٱلنَّهَارِ إِذَا تَجَلَّىٰ",
        "92:3": "وَمَا خَلَقَ ٱلذَّكَرَ وَٱلۡأُنثَىٰٓ",
        "92:4": "إِنَّ سَعۡيَكُمۡ لَشَتَّىٰ",
        "92:5": "فَأَمَّا مَنۡ أَعۡطَىٰ وَٱتَّقَىٰ",
        "92:6": "وَصَدَّقَ بِٱلۡحُسۡنَىٰ",
        "92:7": "فَسَنُيَسِّرُهُۥ لِلۡيُسۡرَىٰ",
        "92:8": "وَأَمَّا مَنۢ بَخِلَ وَٱسۡتَغۡنَىٰ",
        "92:9": "وَكَذَّبَ بِٱلۡحُسۡنَىٰ",
        "92:10": "فَسَنُيَسِّرُهُۥ لِلۡعُسۡرَىٰ",
        "92:11": "وَمَا يُغۡنِي عَنۡهُ مَالُهُۥٓ إِذَا تَرَدَّىٰٓ",
        "92:12": "إِنَّ عَلَيۡنَا لَلۡهُدَىٰ",
        "92:13": "وَإِنَّ لَنَا لَلۡأٓخِرَةَ وَٱلۡأُولَىٰ",
        "92:14": "فَأَنذَرۡتُكُمۡ نَارٗا تَلَظَّىٰ",
        "92:15": "لَا يَصۡلَىٰهَآ إِلَّا ٱلۡأَشۡقَى",
        "92:16": "ٱلَّذِي كَذَّبَ وَتَوَلَّىٰ",
        "92:17": "وَسَيُجَنَّبُهَا ٱلۡأَتۡقَى",
        "92:18": "ٱلَّذِي يُؤۡتِي مَالَهُۥ يَتَزَكَّىٰ",
        "92:19": "وَمَا لِأَحَدٍ عِندَهُۥ مِن نِّعۡمَةٖ تُجۡزَىٰٓ",
        "92:20": "إِلَّا ٱبۡتِغَآءَ وَجۡهِ رَبِّهِ ٱلۡأَعۡلَىٰ",
        "92:21": "وَلَسَوۡفَ يَرۡضَىٰ",
        "93:1": "وَٱلضُّحَىٰ",
        "93:2": "وَٱلَّيۡلِ إِذَا سَجَىٰ",
        "93:3": "مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ",
        "93:4": "وَلَلۡأٓخِرَةُ خَيۡرٞ لَّكَ مِنَ ٱلۡأُولَىٰ",
        "93:5": "وَلَسَوۡفَ يُعۡطِيكَ رَبُّكَ فَتَرۡضَىٰٓ",
        "93:6": "أَلَمۡ يَجِدۡكَ يَتِيمٗا فَـَٔاوَىٰ",
        "93:7": "وَوَجَدَكَ ضَآلّٗا فَهَدَىٰ",
        "93:8": "وَوَجَدَكَ عَآئِلٗا فَأَغۡنَىٰ",
        "93:9": "فَأَمَّا ٱلۡيَتِيمَ فَلَا تَقۡهَرۡ",
        "93:10": "وَأَمَّا ٱلسَّآئِلَ فَلَا تَنۡهَرۡ",
        "93:11": "وَأَمَّا بِنِعۡمَةِ رَبِّكَ فَحَدِّثۡ",
        "94:1": "أَلَمۡ نَشۡرَحۡ لَكَ صَدۡرَكَ",
        "94:2": "وَوَضَعۡنَا عَنكَ وِزۡرَكَ",
        "94:3": "ٱلَّذِيٓ أَنقَضَ ظَهۡرَكَ",
        "94:4": "وَرَفَعۡنَا لَكَ ذِكۡرَكَ",
        "94:5": "فَإِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرًا",
        "94:6": "إِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرٗا",
        "94:7": "فَإِذَا فَرَغۡتَ فَٱنصَبۡ",
        "94:8": "وَإِلَىٰ رَبِّكَ فَٱرۡغَب",
        "95:1": "وَٱلتِّينِ وَٱلزَّيۡتُونِ",
        "95:2": "وَطُورِ سِينِينَ",
        "95:3": "وَهَٰذَا ٱلۡبَلَدِ ٱلۡأَمِينِ",
        "95:4": "لَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ فِيٓ أَحۡسَنِ تَقۡوِيمٖ",
        "95:5": "ثُمَّ رَدَدۡنَٰهُ أَسۡفَلَ سَٰفِلِينَ",
        "95:6":
          "إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ فَلَهُمۡ أَجۡرٌ غَيۡرُ مَمۡنُونٖ",
        "95:7": "فَمَا يُكَذِّبُكَ بَعۡدُ بِٱلدِّينِ",
        "95:8": "أَلَيۡسَ ٱللَّهُ بِأَحۡكَمِ ٱلۡحَٰكِمِينَ",
        "96:1": "ٱقۡرَأۡ بِٱسۡمِ رَبِّكَ ٱلَّذِي خَلَقَ",
        "96:2": "خَلَقَ ٱلۡإِنسَٰنَ مِنۡ عَلَقٍ",
        "96:3": "ٱقۡرَأۡ وَرَبُّكَ ٱلۡأَكۡرَمُ",
        "96:4": "ٱلَّذِي عَلَّمَ بِٱلۡقَلَمِ",
        "96:5": "عَلَّمَ ٱلۡإِنسَٰنَ مَا لَمۡ يَعۡلَمۡ",
        "96:6": "كـَلَّآ إِنَّ ٱلۡإِنسَٰنَ لَيَطۡغَىٰٓ",
        "96:7": "أَن رَّءَاهُ ٱسۡتَغۡنَىٰٓ",
        "96:8": "إِنَّ إِلَىٰ رَبِّكَ ٱلرُّجۡعَىٰٓ",
        "96:9": "أَرَءَيۡتَ ٱلَّذِي يَنۡهَىٰ",
        "96:10": "عَبۡدًا إِذَا صَلَّىٰٓ",
        "96:11": "أَرَءَيۡتَ إِن كَانَ عَلَى ٱلۡهُدَىٰٓ",
        "96:12": "أَوۡ أَمَرَ بِٱلتَّقۡوَىٰٓ",
        "96:13": "أَرَءَيۡتَ إِن كَذَّبَ وَتَوَلَّىٰٓ",
        "96:14": "أَلَمۡ يَعۡلَم بِأَنَّ ٱللَّهَ يَرَىٰ",
        "96:15": "كـَلَّا لَئِن لَّمۡ يَنتَهِ لَنَسۡفَعَۢا بِٱلنَّاصِيَةِ",
        "96:16": "نَاصِيَةٖ كَٰذِبَةٍ خَاطِئَةٖ",
        "96:17": "فَلۡيَدۡعُ نَادِيَهُۥ",
        "96:18": "سَنَدۡعُ ٱلزَّبَانِيَةَ",
        "96:19": "كـَلَّا لَا تُطِعۡهُ وَٱسۡجُدۡۤ وَٱقۡتَرِب۩",
        "97:1": "إِنَّآ أَنزَلۡنَٰهُ فِي لَيۡلَةِ ٱلۡقَدۡرِ",
        "97:2": "وَمَآ أَدۡرَىٰكَ مَا لَيۡلَةُ ٱلۡقَدۡرِ",
        "97:3": "لَيۡلَةُ ٱلۡقَدۡرِ خَيۡرٞ مِّنۡ أَلۡفِ شَهۡرٖ",
        "97:4":
          "تَنَزَّلُ ٱلۡمَلَٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذۡنِ رَبِّهِم مِّن كُلِّ أَمۡرٖ",
        "97:5": "سَلَٰمٌ هِيَ حَتَّىٰ مَطۡلَعِ ٱلۡفَجۡرِ",
        "98:1":
          "لَمۡ يَكُنِ ٱلَّذِينَ كَفَرُواْ مِنۡ أَهۡلِ ٱلۡكِتَٰبِ وَٱلۡمُشۡرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأۡتِيَهُمُ ٱلۡبَيِّنَةُ",
        "98:2": "رَسُولٞ مِّنَ ٱللَّهِ يَتۡلُواْ صُحُفٗا مُّطَهَّرَةٗ",
        "98:3": "فِيهَا كُتُبٞ قَيِّمَةٞ",
        "98:4":
          "وَمَا تَفَرَّقَ ٱلَّذِينَ أُوتُواْ ٱلۡكِتَٰبَ إِلَّا مِنۢ بَعۡدِ مَا جَآءَتۡهُمُ ٱلۡبَيِّنَةُ",
        "98:5":
          "وَمَآ أُمِرُوٓاْ إِلَّا لِيَعۡبُدُواْ ٱللَّهَ مُخۡلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُواْ ٱلصَّلَوٰةَ وَيُؤۡتُواْ ٱلزَّكَوٰةَۚ وَذَٰلِكَ دِينُ ٱلۡقَيِّمَةِ",
        "98:6":
          "إِنَّ ٱلَّذِينَ كَفَرُواْ مِنۡ أَهۡلِ ٱلۡكِتَٰبِ وَٱلۡمُشۡرِكِينَ فِي نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآۚ أُوْلَٰٓئِكَ هُمۡ شَرُّ ٱلۡبَرِيَّةِ",
        "98:7":
          "إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ أُوْلَٰٓئِكَ هُمۡ خَيۡرُ ٱلۡبَرِيَّةِ",
        "98:8":
          "جَزَآؤُهُمۡ عِندَ رَبِّهِمۡ جَنَّٰتُ عَدۡنٖ تَجۡرِي مِن تَحۡتِهَا ٱلۡأَنۡهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدٗاۖ رَّضِيَ ٱللَّهُ عَنۡهُمۡ وَرَضُواْ عَنۡهُۚ ذَٰلِكَ لِمَنۡ خَشِيَ رَبَّهُۥ",
        "99:1": "إِذَا زُلۡزِلَتِ ٱلۡأَرۡضُ زِلۡزَالَهَا",
        "99:2": "وَأَخۡرَجَتِ ٱلۡأَرۡضُ أَثۡقَالَهَا",
        "99:3": "وَقَالَ ٱلۡإِنسَٰنُ مَا لَهَا",
        "99:4": "يَوۡمَئِذٖ تُحَدِّثُ أَخۡبَارَهَا",
        "99:5": "بِأَنَّ رَبَّكَ أَوۡحَىٰ لَهَا",
        "99:6":
          "يَوۡمَئِذٖ يَصۡدُرُ ٱلنَّاسُ أَشۡتَاتٗا لِّيُرَوۡاْ أَعۡمَٰلَهُمۡ",
        "99:7": "فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ",
        "99:8": "وَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٖ شَرّٗا يَرَهُۥ",
        "100:1": "وَٱلۡعَٰدِيَٰتِ ضَبۡحٗا",
        "100:2": "فَٱلۡمُورِيَٰتِ قَدۡحٗا",
        "100:3": "فَٱلۡمُغِيرَٰتِ صُبۡحٗا",
        "100:4": "فَأَثَرۡنَ بِهِۦ نَقۡعٗا",
        "100:5": "فَوَسَطۡنَ بِهِۦ جَمۡعًا",
        "100:6": "إِنَّ ٱلۡإِنسَٰنَ لِرَبِّهِۦ لَكَنُودٞ",
        "100:7": "وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٞ",
        "100:8": "وَإِنَّهُۥ لِحُبِّ ٱلۡخَيۡرِ لَشَدِيدٌ",
        "100:9": "۞ أَفَلَا يَعۡلَمُ إِذَا بُعۡثِرَ مَا فِي ٱلۡقُبُورِ",
        "100:10": "وَحُصِّلَ مَا فِي ٱلصُّدُورِ",
        "100:11": "إِنَّ رَبَّهُم بِهِمۡ يَوۡمَئِذٖ لَّخَبِيرُۢ",
        "101:1": "ٱلۡقَارِعَةُ",
        "101:2": "مَا ٱلۡقَارِعَةُ",
        "101:3": "وَمَآ أَدۡرَىٰكَ مَا ٱلۡقَارِعَةُ",
        "101:4": "يَوۡمَ يَكُونُ ٱلنَّاسُ كَٱلۡفَرَاشِ ٱلۡمَبۡثُوثِ",
        "101:5": "وَتَكُونُ ٱلۡجِبَالُ كَٱلۡعِهۡنِ ٱلۡمَنفُوشِ",
        "101:6": "فَأَمَّا مَن ثَقُلَتۡ مَوَٰزِينُهُۥ",
        "101:7": "فَهُوَ فِي عِيشَةٖ رَّاضِيَةٖ",
        "101:8": "وَأَمَّا مَنۡ خَفَّتۡ مَوَٰزِينُهُۥ",
        "101:9": "فَأُمُّهُۥ هَاوِيَةٞ",
        "101:10": "وَمَآ أَدۡرَىٰكَ مَا هِيَهۡ",
        "101:11": "نَارٌ حَامِيَةُۢ",
        "102:1": "أَلۡهَىٰكُمُ ٱلتَّكَاثُرُ",
        "102:2": "حَتَّىٰ زُرۡتُمُ ٱلۡمَقَابِرَ",
        "102:3": "كـَلَّا سَوۡفَ تَعۡلَمُونَ",
        "102:4": "ثُمَّ كـَلَّا سَوۡفَ تَعۡلَمُونَ",
        "102:5": "كـَلَّا لَوۡ تَعۡلَمُونَ عِلۡمَ ٱلۡيَقِينِ",
        "102:6": "لَتَرَوُنَّ ٱلۡجَحِيمَ",
        "102:7": "ثُمَّ لَتَرَوُنَّهَا عَيۡنَ ٱلۡيَقِينِ",
        "102:8": "ثُمَّ لَتُسۡـَٔلُنَّ يَوۡمَئِذٍ عَنِ ٱلنَّعِيمِ",
        "103:1": "وَٱلۡعَصۡرِ",
        "103:2": "إِنَّ ٱلۡإِنسَٰنَ لَفِي خُسۡرٍ",
        "103:3":
          "إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ وَتَوَاصَوۡاْ بِٱلۡحَقِّ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ",
        "104:1": "وَيۡلٞ لِّكُلِّ هُمَزَةٖ لُّمَزَةٍ",
        "104:2": "ٱلَّذِي جَمَعَ مَالٗا وَعَدَّدَهُۥ",
        "104:3": "يَحۡسَبُ أَنَّ مَالَهُۥٓ أَخۡلَدَهُۥ",
        "104:4": "كـَلَّاۖ لَيُنۢبَذَنَّ فِي ٱلۡحُطَمَةِ",
        "104:5": "وَمَآ أَدۡرَىٰكَ مَا ٱلۡحُطَمَةُ",
        "104:6": "نَارُ ٱللَّهِ ٱلۡمُوقَدَةُ",
        "104:7": "ٱلَّتِي تَطَّلِعُ عَلَى ٱلۡأَفۡـِٔدَةِ",
        "104:8": "إِنَّهَا عَلَيۡهِم مُّؤۡصَدَةٞ",
        "104:9": "فِي عَمَدٖ مُّمَدَّدَةِۭ",
        "105:1": "أَلَمۡ تَرَ كَيۡفَ فَعَلَ رَبُّكَ بِأَصۡحَٰبِ ٱلۡفِيلِ",
        "105:2": "أَلَمۡ يَجۡعَلۡ كَيۡدَهُمۡ فِي تَضۡلِيلٖ",
        "105:3": "وَأَرۡسَلَ عَلَيۡهِمۡ طَيۡرًا أَبَابِيلَ",
        "105:4": "تَرۡمِيهِم بِحِجَارَةٖ مِّن سِجِّيلٖ",
        "105:5": "فَجَعَلَهُمۡ كَعَصۡفٖ مَّأۡكُولِۭ",
        "106:1": "لِإِيلَٰفِ قُرَيۡشٍ",
        "106:2": "إِۦلَٰفِهِمۡ رِحۡلَةَ ٱلشِّتَآءِ وَٱلصَّيۡفِ",
        "106:3": "فَلۡيَعۡبُدُواْ رَبَّ هَٰذَا ٱلۡبَيۡتِ",
        "106:4": "ٱلَّذِيٓ أَطۡعَمَهُم مِّن جُوعٖ وَءَامَنَهُم مِّنۡ خَوۡفِۭ",
        "107:1": "أَرَءَيۡتَ ٱلَّذِي يُكَذِّبُ بِٱلدِّينِ",
        "107:2": "فَذَٰلِكَ ٱلَّذِي يَدُعُّ ٱلۡيَتِيمَ",
        "107:3": "وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلۡمِسۡكِينِ",
        "107:4": "فَوَيۡلٞ لِّلۡمُصَلِّينَ",
        "107:5": "ٱلَّذِينَ هُمۡ عَن صَلَاتِهِمۡ سَاهُونَ",
        "107:6": "ٱلَّذِينَ هُمۡ يُرَآءُونَ",
        "107:7": "وَيَمۡنَعُونَ ٱلۡمَاعُونَ",
        "108:1": "إِنَّآ أَعۡطَيۡنَٰكَ ٱلۡكَوۡثَرَ",
        "108:2": "فَصَلِّ لِرَبِّكَ وَٱنۡحَرۡ",
        "108:3": "إِنَّ شَانِئَكَ هُوَ ٱلۡأَبۡتَرُ",
        "109:1": "قُلۡ يَٰٓأَيُّهَا ٱلۡكَٰفِرُونَ",
        "109:2": "لَآ أَعۡبُدُ مَا تَعۡبُدُونَ",
        "109:3": "وَلَآ أَنتُمۡ عَٰبِدُونَ مَآ أَعۡبُدُ",
        "109:4": "وَلَآ أَنَا۠ عَابِدٞ مَّا عَبَدتُّمۡ",
        "109:5": "وَلَآ أَنتُمۡ عَٰبِدُونَ مَآ أَعۡبُدُ",
        "109:6": "لَكُمۡ دِينُكُمۡ وَلِيَ دِينِ",
        "110:1": "إِذَا جَآءَ نَصۡرُ ٱللَّهِ وَٱلۡفَتۡحُ",
        "110:2": "وَرَأَيۡتَ ٱلنَّاسَ يَدۡخُلُونَ فِي دِينِ ٱللَّهِ أَفۡوَاجٗا",
        "110:3":
          "فَسَبِّحۡ بِحَمۡدِ رَبِّكَ وَٱسۡتَغۡفِرۡهُۚ إِنَّهُۥ كَانَ تَوَّابَۢا",
        "111:1": "تَبَّتۡ يَدَآ أَبِي لَهَبٖ وَتَبَّ",
        "111:2": "مَآ أَغۡنَىٰ عَنۡهُ مَالُهُۥ وَمَا كَسَبَ",
        "111:3": "سَيَصۡلَىٰ نَارٗا ذَاتَ لَهَبٖ",
        "111:4": "وَٱمۡرَأَتُهُۥ حَمَّالَةَ ٱلۡحَطَبِ",
        "111:5": "فِي جِيدِهَا حَبۡلٞ مِّن مَّسَدِۭ",
        "112:1": "قُلۡ هُوَ ٱللَّهُ أَحَدٌ",
        "112:2": "ٱللَّهُ ٱلصَّمَدُ",
        "112:3": "لَمۡ يَلِدۡ وَلَمۡ يُولَدۡ",
        "112:4": "وَلَمۡ يَكُن لَّهُۥ كُفُوًا أَحَدُۢ",
        "113:1": "قُلۡ أَعُوذُ بِرَبِّ ٱلۡفَلَقِ",
        "113:2": "مِن شَرِّ مَا خَلَقَ",
        "113:3": "وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ",
        "113:4": "وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِي ٱلۡعُقَدِ",

        parseInt(Q_LINES[2 * g], 16),

      ];
      const juzOf = (p) => bisect(JUZ_START, p) + 1;
      /** Hizb from the juz halves (approximation; the app takes it from the KFGQPC data). */
      const hizbOf = (p) => {
        const j = juzOf(p),
          a = JUZ_START[j - 1],
          b = JUZ_START[j] || 605;
        return 2 * j - (p < a + Math.round((b - a) / 2) ? 1 : 0);
      };

          for (let l = ls; l <= le; l++)

          lines: lines.map((segs, i) => {

      function companionArt(stage, size = 160) {
        const lvl =
          [
            "seedling",
            "sprout",
            "bloom",
            "tree",
            "garden",
            "seeker",
            "wayfarer",
            "pilgrim",
            "guidingLight",
            "travellingSpirit",
          ].indexOf(stage) % 5;
        if (S.settings.companionTheme === "garden") {
          const leaves = [1, 2, 4, 6, 9][lvl];
          let g = `<path d="M80 150 V${120 - lvl * 14}" stroke="var(--color-success-foreground)" stroke-width="${3 + lvl}" stroke-linecap="round"/>`;
          for (let i = 0; i < leaves; i++) {
            const y = 135 - i * (60 / Math.max(leaves, 1)) - lvl * 4,
              s = i % 2 ? 1 : -1;
            g += `<ellipse cx="${80 + s * (10 + lvl * 2)}" cy="${y}" rx="${8 + lvl * 2}" ry="${4 + lvl}" fill="var(--color-success)" opacity="${0.6 + i * 0.04}" transform="rotate(${s * -30} ${80 + s * 10} ${y})"/>`;
          }
          if (lvl >= 2)
            for (let i = 0; i < lvl; i++)
              g += `<circle cx="${60 + i * 14}" cy="${70 - lvl * 6 + (i % 2) * 8}" r="${4 + lvl}" fill="var(--color-warning)" opacity=".85"/>`;
          return `<svg viewBox="0 0 160 160" width="${size}" height="${size}" aria-hidden="true"><ellipse cx="80" cy="150" rx="${30 + lvl * 8}" ry="6" fill="var(--color-skeleton)"/>${g}</svg>`;
        }
        const steps = lvl + 1;
        let p = `<path d="M10 140 Q 80 ${100 - lvl * 10} 150 140" fill="none" stroke="var(--color-ring)" stroke-width="2" stroke-dasharray="4 5"/>`;
        for (let i = 0; i < steps; i++)
          p += `<circle cx="${20 + i * 28}" cy="${136 - Math.sin((i / 5) * Math.PI) * (30 + lvl * 4)}" r="4" fill="var(--color-info)"/>`;
        p += `<circle cx="${20 + (steps - 1) * 28}" cy="${110 - Math.sin(((steps - 1) / 5) * Math.PI) * (30 + lvl * 4)}" r="9" fill="var(--color-primary)"/><path d="M${20 + (steps - 1) * 28} ${119 - Math.sin(((steps - 1) / 5) * Math.PI) * (30 + lvl * 4)} v18" stroke="var(--color-primary)" stroke-width="5" stroke-linecap="round"/>`;
        if (lvl >= 3)
          p += `<circle cx="130" cy="30" r="${8 + lvl * 2}" fill="var(--color-warning)" opacity=".7"/>`;
        return `<svg viewBox="0 0 160 160" width="${size}" height="${size}" aria-hidden="true">${p}</svg>`;
      }

      function qiblaLive() {
        const loc = S.settings.location,
          b = qiblaBearing(loc.lat, loc.lng),
          hd = S.view.heading;
        const diff = ((b - hd + 540) % 360) - 180,
          aligned = Math.abs(diff) < 5;
        if (aligned && !RT.qAligned) haptic(40);
        RT.qAligned = aligned;
        const ticks = Array.from(
          { length: 36 },
          (_, i) =>
            `<i class="tick" style="transform:rotate(${i * 10}deg);${i % 9 === 0 ? "height:16px;width:3px;background:var(--color-foreground)" : ""}"></i>`
        ).join("");
        const letters = [
          ["N", "ش", 0],
          ["E", "ق", 90],
          ["S", "ج", 180],
          ["W", "غ", 270],
        ]
          .map(
            ([en, ar, deg]) =>
              `<span style="transform:rotate(${deg}deg) translateY(-112px) rotate(${-deg}deg)">${L(ar, en)}</span>`
          )
          .join("");
        return `<div class="compass ${aligned ? "aligned" : ""}">
      <div class="dial" style="transform:rotate(${-hd}deg)">${ticks}${letters}
        <div class="kaaba" style="transform:rotate(${b}deg) translateY(-84px) rotate(${-b + hd}deg)">${ic("kaaba")}</div>

        ${r.mode === "sound" ? `<div class="xs muted mt4 hstack pulse">${ic("mic")}${L("أستمع للتكبير…", "Listening for Takbir…")}</div>` : r.mode === "mat" ? `<div class="xs muted mt4">${L("السجود يغطي العدسة", "Sujud covers the lens")}</div>` : `<div class="xs muted mt4 hstack">${ic("eyeOff")}${L("الكاميرا تعمل — المعاينة مخفية", "Camera on — preview hidden")}</div>`}
      </div>
      <div class="hstack" style="gap:var(--s2)">
        <button class="btn outline" data-a="assistPrev" ${r.i === 0 ? "disabled" : ""} aria-label="${L("رجوع خطوة", "Step back")}">${ic("back", "flip")}</button>
        <button class="btn ${r.auto ? "primary" : "secondary"} spacer" data-a="assistAuto">${ic(r.auto ? "pause" : "play")}${r.auto ? L("إيقاف التقدّم التلقائي", "Pause auto-advance") : L("تقدّم تلقائي (محاكاة التعرّف)", "Auto-advance (simulated recognition)")}</button>
      </div>
      <p class="xs muted center mt2">${L("اضغط في أي مكان للانتقال يدويًا", "Tap anywhere to advance manually")}</p>
    </div>`;
        },
      };

      /* ── Calendar: Hijri grid, Occasions, Gatherings ── */
      SCREENS.calendar = {
        title: () => L("التقويم", "Calendar"),
        render: (p) => {
          const segv = S.view.calSeg;
          const body =
            segv === "hijri"
              ? calHijri()
              : segv === "occasions"
                ? calOccasions()
                : calGatherings();
          return `${seg(
            [
              ["hijri", L("الهجري", "Hijri")],
              ["occasions", L("المناسبات", "Occasions")],
              ["gatherings", L("المجالس", "Gatherings")],
            ],
            segv,
            "calSeg"
          )}<div class="mt4">${body}</div>`;
        },
      };
      function calHijri() {
        const t = todayISO(),
          th = hijri(t);
        const [y, m] = S.view.calMonth || [th.y, th.m];
        const days = hijriMonthDays(y, m),
          first = weekday(days[0]),
          dow0 = S.ui.lang === "ar" ? 6 : 0;
        const lead = (first - dow0 + 7) % 7,
          sel = S.view.calSel || t;
        const wds = Array.from(
          { length: 7 },
          (_, i) => L(WD_SHORT_AR, WD_SHORT_EN)[(dow0 + i) % 7]
        );
        const selOcc = occasionsOn(sel),
          selG = gatheringsOn(sel);
        const pm = m === 1 ? [y - 1, 12] : [y, m - 1],
          nm = m === 12 ? [y + 1, 1] : [y, m + 1];
        return `<div class="card pad">
    <div class="hstack mb2"><button class="btn icon sm ghost" data-a="calMonth" data-x="${pm.join("-")}" aria-label="${L("الشهر السابق", "Previous month")}">${ic("back", "flip")}</button>
      <div class="spacer center"><div class="strong">${hmName(m)} ${N(y)}</div><div class="xs muted">${fmtGreg(days[0], false)} – ${fmtGreg(days[days.length - 1], false)}</div></div>
      <button class="btn icon sm ghost" data-a="calMonth" data-x="${nm.join("-")}" aria-label="${L("الشهر التالي", "Next month")}">${ic("chev", "flip")}</button></div>
    <div class="cal">${wds.map((w) => `<div class="wd">${w}</div>`).join("")}${"<div></div>".repeat(lead)}${days
      .map((d) => {
        const occ = occasionsOn(d);
        return `<button class="day ${d === t ? "today" : ""} ${d === sel ? "sel" : ""}" data-a="calSel" data-x="${d}" aria-label="${fmtHijri(hijri(d))}">${N(hijri(d).d)}<small>${N(parseISO(d).getUTCDate())}</small>${
          occ.length
            ? `<span class="occ">${occ
                .slice(0, 3)
                .map((o) => `<i class="occ-${o.type}"></i>`)
                .join("")}</span>`
            : ""
        }</button>`;
      })
      .join("")}</div>
    ${!(th.y === y && th.m === m) ? `<button class="btn sm ghost block mt2" data-a="calToday">${L("العودة إلى اليوم", "Back to today")}</button>` : ""}
  </div>
  ${section(`${fmtHijri(hijri(sel))} · ${fmtGreg(sel)}`)}
  ${selOcc.length || selG.length ? group([...selOcc.map((o) => row({ lead: `<i class="dot occ-${o.type}" style="width:10px;height:10px"></i>`, title: LL(o.name), sub: LL(OCC_TYPES[o.type]) })), ...selG.map((g) => row({ icon: "users", title: LL(g.title), sub: `${fmtTime(g.time)} · ${LL(g.venue)}`, a: "go", x: "gathering", y: g.id }))]) : `<div class="card pad small muted">${L("لا مناسبات ولا مجالس في هذا اليوم.", "No Occasions or Gatherings on this day.")}</div>`}
  ${section(L("تعديل التاريخ الهجري", "Hijri Adjustment"))}
  <div class="card pad"><div class="hstack"><div class="spacer"><div class="strong">${L("تعديلك الشخصي", "Your adjustment")}</div><div class="xs muted">${L("تعديل الإدارة للجميع", "Admin adjustment for everyone")}: ${N(S.settings.adminHijriAdj >= 0 ? "+" + S.settings.adminHijriAdj : S.settings.adminHijriAdj)}</div></div>
    <button class="btn icon sm outline" data-a="hijriAdj" data-x="-1" ${S.settings.hijriAdj <= -2 ? "disabled" : ""} aria-label="-1">${ic("minus")}</button>
    <span class="strong num" style="min-width:32px;text-align:center">${N(S.settings.hijriAdj > 0 ? "+" + S.settings.hijriAdj : S.settings.hijriAdj)}</span>
    <button class="btn icon sm outline" data-a="hijriAdj" data-x="1" ${S.settings.hijriAdj >= 2 ? "disabled" : ""} aria-label="+1">${ic("plus")}</button></div></div>
  <div class="chips mt4">${Object.entries(OCC_TYPES)
    .map(
      ([k, v]) =>
        `<span class="badge" style="background:transparent"><i class="dot occ-${k}"></i>${LL(v)}</span>`
    )
    .join("")}</div>`;
      }
      function calOccasions() {
        const f = S.view.occFilter || "all";
        const up = upcomingOccasions(200).filter(
          (x) => f === "all" || x.o.type === f
        );
        const today = occasionsOn(todayISO()).filter(
          (o) => f === "all" || o.type === f
        );
        const byMonth = {};
        for (const x of up) {
          const h = hijri(x.iso),
            k = h.y + "-" + h.m;
          (byMonth[k] = byMonth[k] || { h, items: [] }).items.push(x);
        }
        return `<div class="chips scroll mb3">${[["all", L("الكل", "All")], ...Object.entries(OCC_TYPES).map(([k, v]) => [k, LL(v)])].map(([k, lbl]) => `<button class="chip ${f === k ? "on" : ""}" data-a="occFilter" data-x="${k}">${k !== "all" ? `<i class="dot occ-${k}"></i>` : ""}${lbl}</button>`).join("")}</div>
  ${today.length ? section(L("اليوم", "Today")) + group(today.map((o) => row({ lead: `<i class="dot occ-${o.type}" style="width:10px;height:10px"></i>`, title: LL(o.name), sub: LL(OCC_TYPES[o.type]), end: badge(L("اليوم", "Today"), "solid") }))) : ""}
  ${
    Object.values(byMonth)
      .map(
        (g) =>
          section(`${hmName(g.h.m)} ${N(g.h.y)}`) +
          group(
            g.items.map((x) =>
              row({
                lead: `<i class="dot occ-${x.o.type}" style="width:10px;height:10px"></i>`,
                title: LL(x.o.name),
                sub: `${N(hijri(x.iso).d)} ${hmName(hijri(x.iso).m)} · ${fmtGreg(x.iso)}`,
                end: `<span class="xs">${L(`بعد ${N(x.inDays)} يوم`, `in ${x.inDays} d`)}</span>`,
                a: "calJump",
                x: x.iso,
              })
            )
          )
      )
      .join("") ||
    empty(
      "calendar",
      L("لا مناسبات قادمة", "No upcoming Occasions"),
      L("جرّب نوعًا آخر.", "Try another type.")
    )
  }`;
      }
      const gatheringDate = (g) => addDays(todayISO(), g.day);
      const speakerName = (id) => LL(SPEAKERS.find((s) => s.id === id).name);
      const filteredGatherings = () =>
        GATHERINGS.filter(
          (g) => S.view.speaker === "all" || g.speaker === S.view.speaker
        );
      const gatheringsOn = (iso) =>
        filteredGatherings().filter((g) => gatheringDate(g) === iso);
      const gatheringRow = (g) =>
        row({
          icon: g.live ? "tv" : "users",
          title: LL(g.title),
          sub: `${speakerName(g.speaker)} · ${relDay(gatheringDate(g))} ${fmtTime(g.time)}`,
          a: "go",
          x: "gathering",
          y: g.id,
          end: g.live ? badge(L("بث", "Live"), "danger") : "",
        });
      function mapPlaceholder(list) {
        return `<div class="map" role="img" aria-label="${L("خريطة المجالس (عنصر نائب)", "Gatherings map (placeholder)")}"><svg class="bg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 60 Q30 50 50 62 T100 55 V100 H0z" fill="var(--color-info-soft)"/><path d="M10 0 L30 100 M60 0 L45 100 M0 30 H100 M0 80 H100" stroke="var(--color-border)" stroke-width="1.5"/></svg>
    ${list.map((g) => `<button class="pin" style="left:${g.x}%;top:${g.y}%" data-a="go" data-x="gathering" data-y="${g.id}"><b>${LL(g.venue).split(" ").slice(0, 2).join(" ")}</b><i></i></button>`).join("")}
    <span class="badge" style="position:absolute;bottom:8px;inset-inline-start:8px;background:var(--color-card)">${ic("map")} expo-maps</span></div>`;
      }
      function calGatherings() {
        const v = S.view.gatherView,
          t = todayISO(),
          list = filteredGatherings()
            .filter((g) => g.day >= 0)
            .sort((a, b) => a.day - b.day || a.time - b.time);
        let body = "";
        if (v === "list")
          body = list.length
            ? group(list.map(gatheringRow))
            : empty(
                "users",
                L("لا مجالس", "No Gatherings"),
                L(
                  "غيّر المتحدث أو عُد لاحقًا.",
                  "Change the Speaker filter or check back later."
                )
              );
        else if (v === "day") {
          const d = S.view.gatherDay || t;
          const l = gatheringsOn(d);
          body =
            dateNav(d, "gatherDay", true) +
            `<div class="mt3">${l.length ? group(l.map(gatheringRow)) : empty("calendar", L("لا مجالس في هذا اليوم", "No Gatherings this day"), L("تنقّل بين الأيام.", "Move between days."))}</div>`;
        } else if (v === "week")
          body = Array.from({ length: 7 }, (_, i) => addDays(t, i))
            .map((d) => {
              const l = gatheringsOn(d);
              return (
                section(
                  `${relDay(d)} · ${N(hijri(d).d)} ${hmName(hijri(d).m)}`
                ) +
                (l.length
                  ? group(l.map(gatheringRow))
                  : `<div class="xs muted" style="padding:0 var(--s1)">${L("لا شيء", "Nothing scheduled")}</div>`)
              );
            })
            .join("");
        else if (v === "month") {
          const d0 = parseISO(t);
          const first = toISO(
            new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), 1))
          );
          const n = new Date(
              Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 0)
            ).getUTCDate(),
            lead = weekday(first);
          const sel = S.view.gatherDay || t;
          body = `<div class="card pad"><div class="strong center mb2">${L(GM_AR, GM_EN)[d0.getUTCMonth()]} ${N(d0.getUTCFullYear())}</div><div class="cal">${L(
            WD_SHORT_AR,
            WD_SHORT_EN
          )
            .map((w) => `<div class="wd">${w}</div>`)
            .join("")}${"<div></div>".repeat(lead)}${Array.from(
            { length: n },
            (_, i) => {
              const d = addDays(first, i),
                c = gatheringsOn(d).length;
              return `<button class="day ${d === t ? "today" : ""} ${d === sel ? "sel" : ""}" data-a="gatherDaySel" data-x="${d}">${N(i + 1)}${c ? `<span class="occ">${"<i class='occ-religious'></i>".repeat(Math.min(c, 3))}</span>` : ""}</button>`;
            }
          ).join("")}</div></div>
      ${section(relDay(sel))}${gatheringsOn(sel).length ? group(gatheringsOn(sel).map(gatheringRow)) : `<div class="xs muted" style="padding:0 var(--s1)">${L("لا مجالس", "No Gatherings")}</div>`}`;
        } else
          body =
            mapPlaceholder(list) +
            `<div class="mt3">${group(list.map(gatheringRow))}</div>`;
        return `${seg(
          [
            ["list", L("قائمة", "List")],
            ["day", L("يوم", "Day")],
            ["week", L("أسبوع", "Week")],
            ["month", L("شهر", "Month")],
            ["map", L("خريطة", "Map")],
          ],
          v,
          "gatherView"
        )}
    <div class="hstack mt3 mb3"><span class="small muted">${L("المتحدث", "Speaker")}</span><select class="select spacer" style="height:36px" aria-label="${L("المتحدث", "Speaker")}" data-m="view.speaker" data-r="1"><option value="all">${L("جميع المتحدثين", "All Speakers")}</option>${SPEAKERS.map((s) => `<option value="${s.id}" ${S.view.speaker === s.id ? "selected" : ""}>${LL(s.name)}</option>`).join("")}</select></div>
    ${body}`;
      }
      SCREENS.gathering = {
        title: () => L("المجلس", "Gathering"),
        large: false,
        render: (p) => {
          const g = GATHERINGS.find((x) => x.id === p.id),
            d = gatheringDate(g);
          return `<div class="hstack wrap mb2">${badge(LL(GATHERING_TYPES[g.type]))}${badge(ic("users") + " " + LL(GENDER[g.gender]), g.gender === "both" ? "" : "info")}${g.live ? badge(ic("tv") + " " + L("بث مباشر", "Livestream"), "danger") : ""}</div>
    <h2 style="font-size:var(--t-xl);margin:var(--s2) 0 var(--s4);line-height:1.25">${LL(g.title)}</h2>
    ${group([
      row({
        icon: "user",
        title: speakerName(g.speaker),
        sub: L("المتحدث", "Speaker"),
      }),
      row({
        icon: "calendar",
        title: `${relDay(d)} · ${fmtTime(g.time)}`,
        sub: `${fmtHijri(hijri(d))} · ${L("بعد صلاة العشاء", "After Isha")}`,
      }),
      row({
        icon: "pin",
        title: LL(g.venue),
        sub: LL(CITIES.find((c) => c.id === g.city).name),
        a: "toast",
        x: "info",
        y: L("سيفتح تطبيق الخرائط", "Would open Maps"),
      }),
    ])}
    <div class="mt3">${mapPlaceholder([g])}</div>
    <div class="stack mt4">
      ${g.live ? `<button class="btn lg primary block" data-a="openSheet" data-x="livestream" data-y="${g.id}">${ic("tv")}${L("شاهد البث المباشر", "Watch livestream")}</button>` : `<div class="alert">${ic("info")}<div>${L("لا يوجد بث لهذا المجلس.", "No livestream for this Gathering.")}</div></div>`}
      <div class="grid2"><button class="btn outline" data-a="toast" data-x="success" data-y="${L("أُضيف إلى التقويم", "Added to calendar")}">${ic("calendar")}${L("أضف للتقويم", "Add to calendar")}</button><button class="btn outline" data-a="toast" data-x="info" data-y="${L("ستفتح ورقة المشاركة", "Share sheet would open")}">${ic("share")}${L("مشاركة", "Share")}</button></div>
    </div>`;
        },
      };

      /* ════════════════════════════════════════════════════════════
   Screens (part B): Library + readers, Worship, Tasbih, Insights,
   Companion, Learn, Settings & friends, Onboarding
   ════════════════════════════════════════════════════════════ */
      const norm = (s) =>
        String(s || "")
          .toLowerCase()
          .replace(/[\u064B-\u065F\u0670\u0640]/g, "")
          .replace(/[أإآٱ]/g, "ا")
          .replace(/ة/g, "ه")
          .replace(/ى/g, "ي");
      const numBadge = (n) =>
        `<span style="width:34px;height:34px;border-radius:10px;background:var(--color-secondary);display:grid;place-items:center;font-size:var(--t-xs);font-weight:700;flex:none" class="num">${N(n)}</span>`;
      const surahRow = (s) =>
        row({
          lead: numBadge(s.n),
          title: L(s.ar, s.en),
          sub: `${L(s.en, s.ar)} · ${N(s.ayat)} ${L("آية", "ayat")} · ${L("ص", "p.")} ${N(s.page)}`,
          a: "openSurah",
          x: s.n,
          end: isFav("surah", s.n)
            ? `<span style="color:var(--color-destructive)">${ic("heartFill")}</span>`
            : "",
        });
      const ayahFavRow = (k) =>
        row({
          icon: "bookmark",
          title: L("سورة ", "") + ayahRef(k),
          sub: QT[k]
            ? `<span style="font-family:var(--font-mushaf)">${QT[k].split(" ").slice(0, 6).join(" ")} …</span>`
            : `${L("صفحة", "Page")} ${N(pageOfAyah(k))}`,
          a: "openAyah",
          x: k,
        });
      const suppRow = (book, it, sec) =>
        row({
          icon: "book",
          title: LL(it.t),
          sub: `${LL(BOOKS[book].t)}${sec ? " · " + LL(sec.t) : ""}`,
          a: "openSupp",
          x: book,
          y: it.id,
          end: S.user.completions.some(
            (c) => c.id === it.id && c.date === todayISO()
          )
            ? badge(ic("check"), "success")
            : "",
        });
      const assetIcon = {
        pdf: "file",
        audio: "music",
        video: "video",
        json: "text",
      };
      const assetRow = (a) =>
        row({
          icon: assetIcon[a.type],
          title: LL(a.title),
          sub: `${LL(a.author)} · ${a.type.toUpperCase()} · ${a.size}`,
          a: "go",
          x: "asset",
          y: a.id,
        });

      SCREENS.library = {
        title: () => L("المكتبة", "Library"),
        render: () => {
          const q = norm(S.view.libQuery.trim());
          const search = `<div class="search mb3">${ic("search")}<input id="libq" class="input" type="search" placeholder="${L("ابحث في السور والأدعية والملفات", "Search Surahs, Supplications, files")}" value="${esc(S.view.libQuery)}" data-m="view.libQuery" data-r="input" aria-label="${L("بحث", "Search")}"></div>`;
          if (q) {
            const surahs = SURAHS.filter(
              (s) =>
                norm(s.ar).includes(q) ||
                norm(s.en).includes(q) ||
                String(s.n) === q
            );
            const supps = [];
            for (const b of Object.keys(BOOKS))
              for (const sec of BOOKS[b].sections())
                for (const it of sec.items)
                  if (norm(it.t[0]).includes(q) || norm(it.t[1]).includes(q))
                    supps.push([b, it, sec]);
            const assets = ASSETS.filter(
              (a) =>
                norm(a.title[0]).includes(q) ||
                norm(a.title[1]).includes(q) ||
                norm(a.author[0]).includes(q) ||
                norm(a.author[1]).includes(q)
            );
            const total = surahs.length + supps.length + assets.length;
            return (
              search +
              (total
                ? `${surahs.length ? section(L("السور", "Surahs") + ` · ${N(surahs.length)}`) + group(surahs.slice(0, 20).map(surahRow)) : ""}
        ${supps.length ? section(L("الأدعية والنصوص", "Supplications") + ` · ${N(supps.length)}`) + group(supps.slice(0, 20).map(([b, it, sec]) => suppRow(b, it, sec))) : ""}
        ${assets.length ? section(L("الملفات", "Library Assets")) + group(assets.map(assetRow)) : ""}`
                : empty(
                    "search",
                    L("لا نتائج", "No results"),
                    L(
                      "جرّب اسم سورة أو رقمها، أو اسم دعاء مثل «كميل».",
                      'Try a Surah name or number, or a Supplication like "Kumayl".'
                    ),
                    `<button class="btn outline" data-a="clearSearch">${L("مسح البحث", "Clear search")}</button>`
                  ))
            );
          }
          const sg = S.view.librarySeg;
          let body = "";
          if (sg === "quran") {
            body = `${continueQuranCard()}
        <div class="hstack mt3"><button class="btn sm outline" data-a="openSheet" data-x="pageJump">${ic("list")}${L("اذهب إلى صفحة", "Go to page")}</button><button class="btn sm ghost" data-a="openSheet" data-x="quranIndex">${L("الأجزاء", "Juz index")}</button><button class="btn sm ghost" data-a="openQuran" data-x="1">${L("من البداية", "From the start")}</button></div>
        ${section(L("السور", "Surahs") + ` · ${N(114)}`)}${group(SURAHS.map(surahRow))}`;
          } else if (sg === "books") {
            body =
              group(
                Object.entries(BOOKS).map(([k, b]) =>
                  row({
                    icon:
                      k === "nahj"
                        ? "star"
                        : k === "sahifa"
                          ? "sparkle"
                          : "book",
                    title: LL(b.t),
                    sub: `${LL(b.author)} · ${N(b.sections().reduce((n, s) => n + s.items.length, 0))} ${L("نصًا", "texts")}`,
                    a: "go",
                    x: "book",
                    y: k,
                  })
                )
              ) +
              section(L("أتممت قراءتها مؤخرًا", "Recently completed")) +
              (S.user.completions.length
                ? group(
                    S.user.completions
                      .slice(-5)
                      .reverse()
                      .map((c) => {
                        const f = findSupp(c.book, c.id);
                        return f
                          ? row({
                              icon: "check",
                              title: LL(f.it.t),
                              sub: relDay(c.date),
                              a: "openSupp",
                              x: c.book,
                              y: c.id,
                            })
                          : "";
                      })
                  )
                : `<div class="card pad small muted">${L("لا توجد قراءات مكتملة بعد.", "No Reading Completions yet.")}</div>`);
          } else if (sg === "assets") {

        title: (p) => {
          const f = findSupp(p.book, p.id);

        large: false,
        end: (p) =>
          `<button class="nb-btn" data-a="favSupp" data-x="${p.book}" data-y="${p.id}" aria-label="${L("المفضلة", "Favorite")}">${ic(isFav("supp", p.id, p.book) ? "heartFill" : "heart")}</button><button class="nb-btn" data-a="openSheet" data-x="readerSettings" data-y="supp" aria-label="${L("إعدادات القراءة", "Reader settings")}">${ic("type")}</button>`,

          return `<div class="xs muted">${LL(BOOKS[p.book].t)} · ${LL(sec.t)}</div>

        [
          ["ar", L("العربية", "Arabic")],
          ["en", "English"],
          ["both", L("كلاهما", "Both")],

        ${lang === "both" && en ? `<hr style="border:0;border-top:1px solid var(--color-border);margin:var(--s4) 0">` : ""}
        ${lang !== "ar" ? (en ? `<div class="reader-en" style="font-size:${Math.round(fs * 0.72)}px">${esc(en)}</div>` : `<div class="small muted">${L("لا ترجمة إنجليزية مضمّنة لهذا النص في النموذج.", "No English translation bundled for this text in the prototype.")}</div>`) : ""}
        <div class="xs muted mt3">${L("مقتطف للعرض — النص الكامل مضمّن في التطبيق.", "Excerpt for the walkthrough — full text is bundled in the app.")}</div>
      </div>
      ${ar && lang !== "en" ? `<div class="card pad mt3 hstack"><span class="r-icon" style="width:32px;height:32px;border-radius:10px;background:var(--color-secondary);display:grid;place-items:center">${ic("mic")}</span><div class="spacer"><div class="strong">${L("التلاوة المصاحبة", "Recite-Along")}</div><div class="xs muted">${L("تتلوّن الكلمات أثناء قراءتك", "Words light up as you recite")}</div></div>${sw("view.reciteOn", v.reciteOn, L("التلاوة المصاحبة", "Recite-Along"))}</div>` : ""}
      ${
        v.reciteOn && ar && lang !== "en"
          ? `<div class="recite-bar">
        ${seg(
          [
            ["hold", L("ضغط مطوّل", "Hold")],
            ["auto", L("تلقائي", "Auto")],
            ["voice", L("صوتي", "Voice")],
          ],
          S.settings.recite.mode,
          "reciteMode"
        )}
        ${
          S.settings.recite.mode === "auto"
            ? `<div class="mt2">${seg(
                [
                  ["slow", L("بطيء", "Slow")],
                  ["normal", L("عادي", "Normal")],
                  ["fast", L("سريع", "Fast")],
                ],
                S.settings.recite.pace,
                "recitePace"
              )}</div>`
            : ""
        }
        <div class="hstack mt3">
          <button class="btn icon outline" data-a="reciteRestart" aria-label="${L("من البداية", "Restart")}">${ic("refresh")}</button>
          ${
            S.settings.recite.mode === "hold"
              ? `<button class="btn primary spacer" data-hold="recite" style="touch-action:none;user-select:none">${ic("hand")}${L("اضغط مطوّلًا للتقدّم", "Press and hold to advance")}</button>`
              : S.settings.recite.mode === "auto"
                ? `<button class="btn primary spacer" data-a="reciteToggle">${ic(v.reciteRunning ? "pause" : "play")}${v.reciteRunning ? L("إيقاف", "Pause") : L("ابدأ", "Start")}</button>`
                : `<button class="btn ${v.reciteRunning ? "danger-soft" : "primary"} spacer" data-a="reciteToggle">${ic("mic", v.reciteRunning ? "pulse" : "")}${v.reciteRunning ? L("أستمع… (محاكاة)", "Listening… (simulated)") : L("ابدأ الاستماع", "Start listening")}</button>`
          }
          <span class="xs muted num">${N(Math.min(v.reciteIdx, wordCount))}/${N(wordCount)}</span>
        </div></div>`
          : ""
      }
      <div class="mt4">${doneToday ? `<div class="alert success">${ic("check")}<div><div class="a-title">${L("أكملت القراءة اليوم", "Completed today")}</div>${L("سُجّلت في قراءاتك المكتملة.", "Saved to your Reading Completions.")}</div></div>` : `<button class="btn lg primary block" data-a="completeReading" data-x="${p.book}" data-y="${p.id}">${ic("check")}${L("أكملت القراءة", "Mark complete")}</button>`}</div>`;

            );

            return (
              head +
              `<div class="comp-art" style="height:240px">${ic("music")}</div><div class="card pad mt3"><div class="strong mb3">${LL(a.title)}</div>${playerRow(a.id, a.dur)}<div class="hstack mt3"><button class="btn sm ghost" data-a="seek" data-x="-15">−15${L("ث", "s")}</button><span class="spacer"></span><button class="btn sm ghost" data-a="toast" data-x="info" data-y="${L("السرعة ١٫٢٥×", "Speed 1.25×")}">1.25×</button><span class="spacer"></span><button class="btn sm ghost" data-a="seek" data-x="15">+15${L("ث", "s")}</button></div></div>`

      <button class="btn icon lg" style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);color:#fafafa" data-a="togglePlay" data-x="${a.id}" aria-label="${L("تشغيل", "Play")}">${ic(S.view.playing === a.id ? "pause" : "play")}</button>
      <span class="xs" style="position:absolute;bottom:8px;inset-inline-start:10px;color:#d4d4d4">${L("معاينة فيديو (عنصر نائب)", "Video placeholder")}</span></div>
      <div class="card pad mt3">${playerRow(a.id, a.dur)}</div>`
          );
        },

      const TIMING = {
        before: ["قبل", "Before"],
        after: ["بعد", "After"],
        general: ["أي وقت", "Anytime"],
      };
      const ACT_TYPES = {
        regular: ["عمل", "Act"],
        dua: ["دعاء", "Dua"],
        prayer: ["صلاة", "Prayer"],
      };
      function actRow(a, d) {
        const done = !!S.user.actCompletions[d + "|" + a.id];
        return `<div class="row">${checkBtn(done, "toggleAct", d, a.id, LL(a.name))}<button class="r-main" style="text-align:start" data-a="openSheet" data-x="act" data-y="${a.id}|${d}"><div class="r-title" style="${done ? "color:var(--color-muted-foreground)" : ""}">${LL(a.name)}</div><div class="r-sub">${LL(a.program.name)} · ${LL(ACT_TYPES[a.type])}${a.timing !== "general" ? ` · ${LL(TIMING[a.timing])} ${ptName(a.salah)}` : ""}</div></button>${chev()}</div>`;
      }
      const freqLabel = (h) =>
        h.freq === "daily"
          ? L("يوميًا", "Daily")
          : h.freq === "weekdays"
            ? h.days.map((d) => L(WD_AR, WD_EN)[d]).join(L("، ", ", "))
            : L("مرة واحدة", "Once") + " · " + (h.date ? relDay(h.date) : "");
      SCREENS.worship = {
        title: () => L("العبادات", "Worship"),
        end: () =>
          S.view.worshipSeg === "habits"

            : S.view.worshipSeg === "programs"
              ? `<button class="nb-btn" data-a="go" data-x="programBuilder" aria-label="${L("برنامج شخصي", "Personal Program")}">${ic("plus")}</button>`
              : "",
        render: () => {
          const sg = S.view.worshipSeg;
          const top = seg(
            [
              ["today", L("اليوم", "Today")],
              ["habits", L("العادات", "Habits")],
              ["programs", L("البرامج", "Programs")],
            ],
            sg,
            "worshipSeg"
          );

            return top + `<div class="mt4">${worshipToday()}</div>`;
          if (sg === "habits")
            return top + `<div class="mt4">${worshipHabits()}</div>`;
          return top + `<div class="mt4">${worshipPrograms()}</div>`;
        },
      };
      function worshipToday() {
        const d = S.view.worshipDate,
          acts = actsFor(d),
          log = logOf(d),
          times = prayerTimes(d);
        const habits = S.user.habits.filter(
          (h) => !h.archived && habitScheduled(h, d)
        );
        const doneActs = acts.filter(
            (a) => S.user.actCompletions[d + "|" + a.id]
          ).length,
          doneH = habits.filter((h) => S.user.habitLogs[d + "|" + h.id]).length;
        const total = acts.length + habits.length,
          done = doneActs + doneH;
        let html =
          dateNav(d, "setWorshipDate") +
          `<div class="card pad mt3"><div class="hstack mb2"><span class="strong spacer">${N(done)} ${L("من", "of")} ${N(total)} ${L("أُنجزت", "done")}</span><span class="xs muted">${N(S.user.subscriptions.filter((s) => !s.paused).length)} ${L("برامج نشطة", "active Programs")}</span></div>${progress(total ? (done / total) * 100 : 0, "success")}</div>`;
        if (!S.user.subscriptions.length)
          html += `<div class="mt3">${empty("hands", L("لا برامج بعد", "No Programs yet"), L("اشترك في برنامج رسمي أو ابنِ برنامجك الشخصي لتظهر أعمالك هنا مرتبة حول الصلوات.", "Subscribe to an Official Program or build a Personal one; your Acts will appear here around each Salah."), `<button class="btn primary" data-a="worshipSeg" data-x="programs">${L("تصفّح البرامج", "Browse Programs")}</button>`)}</div>`;
        for (const k of SALAH) {
          const before = acts.filter(
              (a) => a.salah === k && a.timing === "before"
            ),
            after = acts.filter((a) => a.salah === k && a.timing === "after");
          html +=
            section(`${ptName(k)} · ${fmtTime(times[k])}`) +
            `<div class="group">
      ${before.length ? `<div class="xs muted strong" style="padding:var(--s2) var(--s4) 0">${L("قبل الصلاة", "Before Salah")}</div>${before.map((a) => actRow(a, d)).join("")}` : ""}
      <div class="row" style="background:var(--color-inset)">${checkBtn(log[k], "toggleSalah", d, k, ptName(k))}<span class="r-main"><div class="r-title strong">${L("صلاة", "Salah:")} ${ptName(k)}</div><div class="r-sub">${N(RAKAH_COUNT[k])} ${L("ركعات", "Rak'ahs")}</div></span><button class="btn sm ghost" data-a="go" data-x="assistant" data-y="${k}">${ic("hands")}</button></div>
      ${after.length ? `<div class="xs muted strong" style="padding:var(--s2) var(--s4) 0">${L("بعد الصلاة", "After Salah")}</div>${after.map((a) => actRow(a, d)).join("")}` : ""}
    </div>`;
        }
        const general = acts.filter((a) => a.timing === "general");
        if (general.length)
          html +=
            section(L("في أي وقت", "Anytime")) +
            `<div class="group">${general.map((a) => actRow(a, d)).join("")}</div>`;
        html += section(
          L("عاداتي", "My Habits"),
          `<button class="sec-act" data-a="worshipSeg" data-x="habits">${L("إدارة", "Manage")}</button>`
        );
        html += habits.length
          ? `<div class="group">${habits.map((h) => `<div class="row">${checkBtn(!!S.user.habitLogs[d + "|" + h.id], "toggleHabit", d, h.id, habitName(h))}<span class="r-main"><div class="r-title">${esc(habitName(h))}</div><div class="r-sub">${freqLabel(h)}${h.reminder ? ` · ${ic("bell").replace("<svg", '<svg style="width:12px;height:12px;vertical-align:-1px"')} ${N(h.time)}` : ""}</div></span>${habitStreak(h) ? badge(ic("flame") + " " + N(habitStreak(h)), "warning") : ""}</div>`).join("")}</div>`
          : `<div class="card pad small muted">${L("لا عادات مجدولة لهذا اليوم.", "No Habits scheduled for this day.")}</div>`;
        return html;
      }
      function worshipHabits() {
        const active = S.user.habits.filter((h) => !h.archived),
          archived = S.user.habits.filter((h) => h.archived);
        return `${active.length ? group(active.map((h) => row({ icon: h.reminder ? "bell" : "check", title: esc(habitName(h)), sub: `${freqLabel(h)}${h.reminder ? " · " + N(h.time) : ""}`, a: "habitEdit", x: h.id, end: habitStreak(h) ? badge(ic("flame") + " " + N(habitStreak(h)), "warning") : "" }))) : empty("check", L("لا عادات", "No Habits"), L("أنشئ عادة يومية أو في أيام محددة أو لمرة واحدة، مع تذكير اختياري.", "Create a daily, weekday or one-time Habit, with an optional Reminder."))}

        total: S.user.subscriptions.length,

          (s) => programById(s.id)?.kind === "seasonal"
        ).length,
      });

    <div class="hstack" style="align-items:flex-start;gap:var(--s3)"><span class="r-icon" style="width:40px;height:40px;border-radius:12px;background:var(--color-secondary);display:grid;place-items:center;flex:none">${ic(p.icon || "hands")}</span>
      <button class="spacer" style="text-align:start" data-a="go" data-x="program" data-y="${p.id}"><div class="strong">${LL(p.name)}</div><div class="xs muted mt1">${LL(p.desc)}</div>
        <div class="hstack wrap mt2">${badge(N(p.acts.length) + " " + L("أعمال", "Acts"))}${p.kind === "seasonal" ? badge(ic("calendar") + " " + windowLabel(p), season ? "success" : "") + (season ? badge(L("في موسمه", "In season"), "success") : badge(L("خارج الموسم", "Out of season"))) : ""}${sub?.paused ? badge(L("متوقف مؤقتًا", "Paused"), "warning") : ""}</div></button></div>
    <div class="hstack mt3">${sub ? `<button class="btn sm secondary spacer" data-a="unsubscribe" data-x="${p.id}">${ic("check")}${L("مشترك", "Subscribed")}</button>` : `<button class="btn sm primary spacer" data-a="subscribe" data-x="${p.id}">${ic("plus")}${L("اشترك", "Subscribe")}</button>`}</div>
  </div>`;
      }
      function worshipPrograms() {
        const sg = S.view.programsSeg,
          c = subCount();
        const limits = `<div class="card pad"><div class="hstack small"><span class="spacer">${L("الاشتراكات", "Subscriptions")}</span><span class="strong num">${N(c.total)}/${N(5)}</span></div>${progress((c.total / 5) * 100)}<div class="xs muted mt2">${L("حد أقصى ٥ اشتراكات، منها برنامج رسمي عام واحد وبرنامج موسمي واحد.", "At most 5 Subscriptions: one General and one Seasonal Official Program.")} (${L("عام", "General")} ${N(c.general)}/${N(1)} · ${L("موسمي", "Seasonal")} ${N(c.seasonal)}/${N(1)})</div></div>`;
        const s2 = seg(
          [
            ["official", L("الرسمية", "Official")],
            ["mine", L("برامجي", "Mine")],
          ],
          sg,
          "programsSeg"
        );
        if (sg === "official")
          return `${s2}<div class="mt3">${limits}</div>${section(L("عامة", "General"))}<div class="stack">${PROGRAMS.filter(
            (p) => p.kind === "general"

            .map(programCard)
            .join(
              ""
            )}</div>${section(L("موسمية", "Seasonal"))}<div class="stack">${PROGRAMS.filter(
            (p) => p.kind === "seasonal"
          )
            .map(programCard)
            .join("")}</div>`;
        const subs = S.user.subscriptions;
        return `${s2}<div class="mt3">${limits}</div>${section(L("اشتراكاتي", "My Subscriptions"))}
    ${
      subs.length
        ? `<div class="group">${subs
            .map((s) => {
              const p = programById(s.id);

                ? `<div class="row has-icon"><span class="r-icon">${ic(p.icon || "hands")}</span><button class="r-main" style="text-align:start" data-a="go" data-x="program" data-y="${p.id}"><div class="r-title">${LL(p.name)}</div><div class="r-sub">${p.kind === "personal" ? L("شخصي", "Personal") : p.kind === "general" ? L("رسمي · عام", "Official · General") : L("رسمي · موسمي", "Official · Seasonal")}${s.paused ? " · " + L("متوقف", "Paused") : ""}</div></button><span class="xs muted">${L("إيقاف", "Pause")}</span>${sw("pause:" + s.id, s.paused, L("إيقاف مؤقت", "Pause"))}</div>`
                : "";
            })
            .join("")}</div>`
        : empty(
            "hands",
            L("لا اشتراكات", "No Subscriptions"),
            L(
              "اشترك في برنامج رسمي أو أنشئ برنامجًا شخصيًا.",
              "Subscribe to an Official Program or create a Personal one."
            )
          )
    }
    ${section(L("برامجي الشخصية", "My Personal Programs"))}
    ${S.user.personalPrograms.length ? `<div class="stack">${S.user.personalPrograms.map(programCard).join("")}</div>` : `<div class="card pad small muted">${L("لم تنشئ برنامجًا بعد.", "You haven't built a Program yet.")}</div>`}
    <button class="btn lg outline block mt3" data-a="go" data-x="programBuilder">${ic("plus")}${L("أنشئ برنامجًا شخصيًا", "Build a Personal Program")}</button>`;

        title: (p) => LL(programById(p.id)?.name || ["", ""]),

          const pr = programById(p.id);
          if (!pr)
            return empty(
              "hands",
              L("البرنامج غير موجود", "Program not found"),
              ""
            );
          const sub = S.user.subscriptions.find((s) => s.id === pr.id);
          return `<p class="small muted" style="margin-top:-8px">${LL(pr.desc)}</p>

      <button class="btn outline block mt3" data-a="builderAddAct">${ic("plus")}${L("أضف عملًا", "Add Act")}</button>
      <button class="btn lg primary block mt6" data-a="builderSave">${L("احفظ واشترك", "Save & subscribe")}</button>`;
        },
      };

      /* ── Tasbih ── */
      const zahraTotal = () => {
        const z = S.user.tasbih.zahra;

        title: () => L("التسبيح", "Tasbih"),
        end: () =>
          `<button class="nb-btn" data-a="openSheet" data-x="export" aria-label="${L("تصدير", "Export")}">${ic("share")}</button>`,
        render: () => {
          const z = S.user.tasbih.zahra,

          const sessions = S.user.dhikrSessions.slice(-6).reverse();
          return `<div class="card pad">
      <div class="hstack mb3"><div class="spacer"><div class="strong">${L("تسبيح الزهراء (ع)", "Tasbih al-Zahra")}</div><div class="xs muted">${N(zahraTotal())}/${N(100)} · ${L("ينتقل تلقائيًا", "Auto-advances")}</div></div><button class="btn sm ghost" data-a="zahraReset">${ic("refresh")}${L("تصفير", "Reset")}</button></div>

    ${section(L("تسابيح مفتوحة", "Open Tasbih"), `<button class="sec-act" data-a="openSheet" data-x="tasbihNew">${L("جديد", "New")}</button>`)}
    ${S.user.tasbih.open.length ? group(S.user.tasbih.open.map((t) => row({ icon: "beads", title: esc(t.name), sub: t.target ? `${N(t.count)}/${N(t.target)}${t.notes ? " · " + esc(t.notes) : ""}` : `${N(t.count)} ${L("بلا هدف", "no target")}${t.notes ? " · " + esc(t.notes) : ""}`, a: "go", x: "openTasbih", y: t.id, end: t.target ? `<span style="width:44px">${progress((t.count / t.target) * 100, t.count >= t.target ? "success" : "")}</span>` : "" }))) : empty("beads", L("لا تسابيح مفتوحة", "No Open Tasbih"), L("أنشئ تسبيحًا باسمك وهدفك وملاحظاتك.", "Create one with your own name, target and notes."))}
    ${section(L("جلسات الذكر", "Dhikr Sessions"), `<button class="sec-act" data-a="openSheet" data-x="export">${L("تصدير", "Export")}</button>`)}
    ${sessions.length ? group(sessions.map((s) => row({ icon: "check", title: esc(s.name), sub: `${relDay(s.date)} · ${N(s.at)}`, end: `<span class="num">${N(s.count)}</span>` }))) : `<div class="card pad small muted">${L("ستظهر هنا كل جلسة ذكر مكتملة.", "Every completed Dhikr Session appears here.")}</div>`}`;
        },
      };
      SCREENS.openTasbih = {
        title: (p) =>
          esc(S.user.tasbih.open.find((t) => t.id === p.id)?.name || ""),
