name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: check-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholder for the web build's required public variable. CI never
      # talks to a server; real values live in the deploy environment.
      VITE_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      # Vitest needs Node ^22.12 || ^24 || >=26; the runner's default may lag.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # uncheck (oxlint, oxfmt, tsc, sherif) and dependency-cruiser boundaries
      - run: bun run check
      - run: bun run test
      - run: bun run build

  # The iOS simulator build and the end-to-end journeys run in e2e.yml on a
  # macOS runner. Their prerequisites are documented in README.md under "CI".
